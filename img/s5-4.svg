<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <filter id="dropshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="360" rx="14" fill="#f0f9ff"/>
  <rect x="12" y="12" width="576" height="336" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" opacity="0.95" filter="url(#dropshadow)"/>
  
  <!-- Subtle header banner -->
  <rect x="12" y="12" width="576" height="44" rx="10" fill="#0284c7"/>
  <rect x="12" y="44" width="576" height="12" fill="#0284c7"/>
  <text x="32" y="38" fill="#ffffff" font-size="14" font-family="'Noto Serif TC', serif" font-weight="900" letter-spacing="1">圖 5-4　基因體時代：高通量定序與生物資訊</text>
  <circle cx="560" cy="34" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="538" cy="34" r="5" fill="#ffffff" opacity="0.3"/>

  <!-- Content -->
  
        <!-- Genomics era, NGS & Bioinformatics -->
        <g transform="translate(300, 170)">
          <!-- DNA Microarray / Chip grid -->
          <g transform="translate(-140, -60)">
            <rect width="100" height="100" rx="6" fill="#0f172a"/>
            <!-- Dots on chip -->
            <circle cx="20" cy="20" r="7" fill="#ef4444"/><circle cx="50" cy="20" r="7" fill="#22c55e"/><circle cx="80" cy="20" r="7" fill="#eab308"/>
            <circle cx="20" cy="50" r="7" fill="#22c55e"/><circle cx="50" cy="50" r="7" fill="#ef4444"/><circle cx="80" cy="50" r="7" fill="#22c55e"/>
            <circle cx="20" cy="80" r="7" fill="#eab308"/><circle cx="50" cy="80" r="7" fill="#22c55e"/><circle cx="80" cy="80" r="7" fill="#ef4444"/>
            <text x="50" y="115" fill="#0284c7" font-size="11" font-weight="bold" text-anchor="middle">DNA 微陣列晶片</text>
          </g>
          <!-- NGS & Big Data Analytics -->
          <g transform="translate(40, -40)">
            <rect width="180" height="80" rx="8" fill="#fff" stroke="#0284c7" stroke-width="2"/>
            <text x="90" y="30" fill="#0284c7" font-size="13" font-weight="bold" text-anchor="middle">次世代定序 (NGS)</text>
            <text x="90" y="55" fill="#555" font-size="11" text-anchor="middle">人類基因體計畫 HGP</text>
          </g>
          <text x="0" y="110" fill="#0369a1" font-size="13" font-weight="bold" text-anchor="middle">生物資訊學 · 癌症基因檢測 · 個人化精準醫療</text>
        </g>
        
</svg>