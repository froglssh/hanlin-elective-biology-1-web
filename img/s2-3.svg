<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <filter id="dropshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="360" rx="14" fill="#fffbeb"/>
  <rect x="12" y="12" width="576" height="336" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5" opacity="0.95" filter="url(#dropshadow)"/>
  
  <!-- Subtle header banner -->
  <rect x="12" y="12" width="576" height="44" rx="10" fill="#d97706"/>
  <rect x="12" y="44" width="576" height="12" fill="#d97706"/>
  <text x="32" y="38" fill="#ffffff" font-size="14" font-family="'Noto Serif TC', serif" font-weight="900" letter-spacing="1">圖 2-3　能量流轉與生命維持的關係</text>
  <circle cx="560" cy="34" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="538" cy="34" r="5" fill="#ffffff" opacity="0.3"/>

  <!-- Content -->
  
        <!-- ATP Cycle & Carbon energy cycle -->
        <g transform="translate(300, 180)">
          <circle cx="0" cy="0" r="100" fill="none" stroke="#fde68a" stroke-width="30"/>
          <!-- Upper Arc Arrow (Exergonic to ATP) -->
          <path d="M-90,-40 A100,100 0 0,1 90,-40" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
          <text x="0" y="-120" fill="#b45309" font-size="13" font-weight="bold" text-anchor="middle">呼吸作用釋能合成 ATP</text>
          <!-- Lower Arc Arrow (ATP hydrolysis to work) -->
          <path d="M90,40 A100,100 0 0,1 -90,40" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
          <text x="0" y="135" fill="#15803d" font-size="13" font-weight="bold" text-anchor="middle">ATP水解供能推動細胞生理反應</text>
          <!-- Center ATP <-> ADP -->
          <text x="0" y="-10" fill="#78350f" font-size="20" font-weight="900" text-anchor="middle">ATP</text>
          <text x="0" y="15" fill="#78350f" font-size="13" font-weight="bold" text-anchor="middle">⇄ ADP + Pi</text>
        </g>
        
</svg>