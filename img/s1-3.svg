<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <filter id="dropshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="360" rx="14" fill="#f0fdfa"/>
  <rect x="12" y="12" width="576" height="336" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" opacity="0.95" filter="url(#dropshadow)"/>
  
  <!-- Subtle header banner -->
  <rect x="12" y="12" width="576" height="44" rx="10" fill="#0d9488"/>
  <rect x="12" y="44" width="576" height="12" fill="#0d9488"/>
  <text x="32" y="38" fill="#ffffff" font-size="14" font-family="'Noto Serif TC', serif" font-weight="900" letter-spacing="1">圖 1-3　細胞膜物質運輸方式比較</text>
  <circle cx="560" cy="34" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="538" cy="34" r="5" fill="#ffffff" opacity="0.3"/>

  <!-- Content -->
  
        <!-- Membrane transport mechanisms comparison -->
        <g transform="translate(60, 60)">
          <!-- 4 transport modes columns -->
          <g transform="translate(30, 20)">
            <rect width="105" height="200" rx="10" fill="#fff" stroke="#99f6e4" stroke-width="2"/>
            <text x="52" y="30" fill="#0f766e" font-size="13" font-weight="bold" text-anchor="middle">簡單擴散</text>
            <text x="52" y="65" fill="#555" font-size="11" text-anchor="middle">順濃度梯度</text>
            <text x="52" y="90" fill="#0d9488" font-size="11" font-weight="bold" text-anchor="middle">不耗能</text>
            <text x="52" y="130" fill="#555" font-size="10" text-anchor="middle">O2, CO2</text>
            <text x="52" y="150" fill="#555" font-size="10" text-anchor="middle">脂溶性分子</text>
          </g>
          <g transform="translate(150, 20)">
            <rect width="105" height="200" rx="10" fill="#fff" stroke="#99f6e4" stroke-width="2"/>
            <text x="52" y="30" fill="#0f766e" font-size="13" font-weight="bold" text-anchor="middle">促進性擴散</text>
            <text x="52" y="65" fill="#555" font-size="11" text-anchor="middle">順濃度梯度</text>
            <text x="52" y="90" fill="#0d9488" font-size="11" font-weight="bold" text-anchor="middle">通道/載體</text>
            <text x="52" y="130" fill="#555" font-size="10" text-anchor="middle">葡萄糖, 胺基酸</text>
            <text x="52" y="150" fill="#555" font-size="10" text-anchor="middle">離子 (不耗能)</text>
          </g>
          <g transform="translate(270, 20)">
            <rect width="105" height="200" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
            <text x="52" y="30" fill="#b45309" font-size="13" font-weight="bold" text-anchor="middle">主動運輸</text>
            <text x="52" y="65" fill="#b91c1c" font-size="11" font-weight="bold" text-anchor="middle">逆濃度梯度</text>
            <text x="52" y="90" fill="#d97706" font-size="11" font-weight="bold" text-anchor="middle">需消耗 ATP</text>
            <text x="52" y="130" fill="#555" font-size="10" text-anchor="middle">鈉鉀幫浦</text>
            <text x="52" y="150" fill="#555" font-size="10" text-anchor="middle">質子幫浦</text>
          </g>
          <g transform="translate(390, 20)">
            <rect width="105" height="200" rx="10" fill="#fff" stroke="#6366f1" stroke-width="2"/>
            <text x="52" y="30" fill="#4338ca" font-size="13" font-weight="bold" text-anchor="middle">胞吞與胞吐</text>
            <text x="52" y="65" fill="#555" font-size="11" text-anchor="middle">大分子/顆粒</text>
            <text x="52" y="90" fill="#4f46e5" font-size="11" font-weight="bold" text-anchor="middle">膜囊泡運動</text>
            <text x="52" y="130" fill="#555" font-size="10" text-anchor="middle">需消耗 ATP</text>
            <text x="52" y="150" fill="#555" font-size="10" text-anchor="middle">吞噬/胞飲/分泌</text>
          </g>
        </g>
        
</svg>