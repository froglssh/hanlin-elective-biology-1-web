<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <filter id="dropshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="360" rx="14" fill="#f0f9ff"/>
  <rect x="12" y="12" width="576" height="336" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" opacity="0.95" filter="url(#dropshadow)"/>
  
  <!-- Subtle header banner -->
  <rect x="12" y="12" width="576" height="44" rx="10" fill="#0284c7"/>
  <rect x="12" y="44" width="576" height="12" fill="#0284c7"/>
  <text x="32" y="38" fill="#ffffff" font-size="14" font-family="'Noto Serif TC', serif" font-weight="900" letter-spacing="1">圖 5-2　重組DNA技術與質體載體切割拼接</text>
  <circle cx="560" cy="34" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="538" cy="34" r="5" fill="#ffffff" opacity="0.3"/>

  <!-- Content -->
  
        <!-- Recombinant DNA: Restriction enzyme + Ligase -->
        <g transform="translate(300, 180)">
          <!-- Plasmid Ring -->
          <circle cx="-100" cy="0" r="70" fill="none" stroke="#0284c7" stroke-width="8" stroke-dasharray="90 20 60 20"/>
          <!-- EcoRI Scissors -->
          <g transform="translate(-100, -70)">
            <text x="0" y="-15" fill="#b91c1c" font-size="12" font-weight="bold" text-anchor="middle">限制酶 EcoRI 切割</text>
            <path d="M-15,-5 L15,10 M-15,10 L15,-5" stroke="#ef4444" stroke-width="3"/>
          </g>
          <!-- Insert Gene -->
          <g transform="translate(90, 0)">
            <rect x="-60" y="-20" width="120" height="40" rx="8" fill="#ec4899" stroke="#fff" stroke-width="2"/>
            <text x="0" y="5" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">目標基因 (胰島素等)</text>
          </g>
          <!-- Arrow & Ligase -->
          <text x="0" y="100" fill="#0369a1" font-size="13" font-weight="bold" text-anchor="middle">DNA 連接酶形成磷酸二酯鍵 → 構築重組質體</text>
        </g>
        
</svg>