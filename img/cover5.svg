<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bggrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="480" rx="16" fill="url(#bggrad)"/>
  
  <!-- Subtle Scientific Grid / Hex Pattern -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.08" fill="none">
    <circle cx="200" cy="240" r="180"/>
    <circle cx="200" cy="240" r="140"/>
    <circle cx="200" cy="240" r="100"/>
    <line x1="20" y1="240" x2="380" y2="240"/>
    <line x1="200" y1="60" x2="200" y2="420"/>
    <line x1="72" y1="112" x2="328" y2="368"/>
    <line x1="72" y1="368" x2="328" y2="112"/>
  </g>

  <!-- Top Spine Header -->
  <rect x="0" y="0" width="400" height="56" fill="rgba(0,0,0,0.22)"/>
  <text x="26" y="34" fill="#ffffff" font-size="12" font-family="'Noto Sans TC', sans-serif" letter-spacing="2.5" font-weight="700" opacity="0.95">普通型高級中等學校 · 自然科學領域</text>
  <rect x="330" y="16" width="44" height="24" rx="12" fill="#38bdf8"/>
  <text x="352" y="32" fill="#ffffff" font-size="11" font-family="'Noto Sans TC', sans-serif" font-weight="900" text-anchor="middle">翰林</text>

  <!-- Chapter Number & Tag -->
  <g transform="translate(32, 90)">
    <rect x="0" y="0" width="130" height="30" rx="15" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="65" y="20" fill="#ffffff" font-size="13" font-family="'Noto Sans TC', sans-serif" font-weight="700" letter-spacing="2" text-anchor="middle">CHAPTER 05</text>
  </g>

  <!-- Main Illustration Art -->
  
        <!-- PCR & Gel Electrophoresis & Plasmid -->
        <g transform="translate(200, 260)">
          <!-- Plasmid Ring -->
          <circle cx="-40" cy="10" r="65" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="80 15 50 15"/>
          <!-- Insert gene -->
          <path d="M-40,-55 A65,65 0 0,1 25,10" fill="none" stroke="#ec4899" stroke-width="12"/>
          <!-- Gel Electrophoresis bands -->
          <g transform="translate(60, -70)">
            <rect x="0" y="0" width="60" height="150" rx="8" fill="#0f172a" stroke="#fff" stroke-width="2"/>
            <rect x="10" y="25" width="40" height="8" rx="2" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
            <rect x="10" y="55" width="40" height="8" rx="2" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
            <rect x="10" y="90" width="40" height="8" rx="2" fill="#ec4899" filter="drop-shadow(0 0 6px #ec4899)"/>
            <rect x="10" y="120" width="40" height="8" rx="2" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
          </g>
        </g>
        

  <!-- Title & Description Block -->
  <g transform="translate(32, 380)">
    <text x="0" y="0" fill="#38bdf8" font-size="11" font-family="'Noto Sans TC', sans-serif" font-weight="700" letter-spacing="3.5" text-transform="uppercase">BIOTECHNOLOGY & APPLICATIONS</text>
    <text x="0" y="36" fill="#ffffff" font-size="30" font-family="'Noto Serif TC', serif" font-weight="900" letter-spacing="1.5">生物技術的應用與發展</text>
    <text x="0" y="62" fill="rgba(255,255,255,0.85)" font-size="12" font-family="'Noto Sans TC', sans-serif" font-weight="500">PCR連鎖反應 · 重組DNA · 基因轉殖 · 基因體時代</text>
  </g>

  <!-- Bottom Brand Footer -->
  <line x1="32" y1="452" x2="368" y2="452" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="32" y="468" fill="rgba(255,255,255,0.7)" font-size="10.5" font-family="'Noto Sans TC', sans-serif" letter-spacing="1">選修生物（Ⅰ）互動教材 · 臺北市立麗山高中生物科自編</text>
  <text x="368" y="468" fill="#38bdf8" font-size="11" font-family="'Noto Sans TC', sans-serif" font-weight="900" text-anchor="end">HANLIN</text>
</svg>