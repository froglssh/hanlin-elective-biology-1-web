<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <filter id="dropshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="360" rx="14" fill="#eef2ff"/>
  <rect x="12" y="12" width="576" height="336" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" opacity="0.95" filter="url(#dropshadow)"/>
  
  <!-- Subtle header banner -->
  <rect x="12" y="12" width="576" height="44" rx="10" fill="#4f46e5"/>
  <rect x="12" y="44" width="576" height="12" fill="#4f46e5"/>
  <text x="32" y="38" fill="#ffffff" font-size="14" font-family="'Noto Serif TC', serif" font-weight="900" letter-spacing="1">圖 3-1　遺傳的染色體學說與聯鎖互換</text>
  <circle cx="560" cy="34" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="538" cy="34" r="5" fill="#ffffff" opacity="0.3"/>

  <!-- Content -->
  
        <!-- Sutton-Boveri & Morgan linkage -->
        <g transform="translate(300, 180)">
          <!-- Homologous pair 1 -->
          <g transform="translate(-120, -50)">
            <rect x="-15" y="-40" width="30" height="90" rx="12" fill="#6366f1"/>
            <circle cx="0" cy="5" r="7" fill="#fbbf24"/>
            <text x="0" y="-15" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">A</text>
            <text x="0" y="30" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">B</text>
          </g>
          <g transform="translate(-70, -50)">
            <rect x="-15" y="-40" width="30" height="90" rx="12" fill="#a5b4fc"/>
            <circle cx="0" cy="5" r="7" fill="#fbbf24"/>
            <text x="0" y="-15" fill="#312e81" font-size="12" font-weight="bold" text-anchor="middle">a</text>
            <text x="0" y="30" fill="#312e81" font-size="12" font-weight="bold" text-anchor="middle">b</text>
          </g>
          <!-- Chiasma Crossing Over Representation -->
          <g transform="translate(100, -50)">
            <rect x="-20" y="-40" width="40" height="90" rx="12" fill="#818cf8"/>
            <path d="M-10,10 L10,35" stroke="#ec4899" stroke-width="12" stroke-linecap="round"/>
            <text x="0" y="-15" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">互換</text>
            <text x="0" y="30" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">重組</text>
          </g>
          <!-- Explanation box -->
          <rect x="-240" y="65" width="480" height="45" rx="8" fill="#fff" stroke="#c7d2fe"/>
          <text x="0" y="92" fill="#312e81" font-size="13" font-weight="bold" text-anchor="middle">薩登與包法利：基因位於染色體上，減數分裂中成對分離</text>
        </g>
        
</svg>