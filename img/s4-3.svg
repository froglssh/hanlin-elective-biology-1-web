<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <filter id="dropshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="360" rx="14" fill="#fdf2f8"/>
  <rect x="12" y="12" width="576" height="336" rx="10" fill="#ffffff" stroke="#be185d" stroke-width="1.5" opacity="0.95" filter="url(#dropshadow)"/>
  
  <!-- Subtle header banner -->
  <rect x="12" y="12" width="576" height="44" rx="10" fill="#be185d"/>
  <rect x="12" y="44" width="576" height="12" fill="#be185d"/>
  <text x="32" y="38" fill="#ffffff" font-size="14" font-family="'Noto Serif TC', serif" font-weight="900" letter-spacing="1">圖 4-3　基因表現調控：乳糖操縱組機制</text>
  <circle cx="560" cy="34" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="538" cy="34" r="5" fill="#ffffff" opacity="0.3"/>

  <!-- Content -->
  
        <!-- Lac Operon model -->
        <g transform="translate(100, 100)">
          <!-- Operon Gene segments -->
          <rect x="0" y="20" width="80" height="40" fill="#cbd5e1" stroke="#475569"/><text x="40" y="45" fill="#1e293b" font-size="12" font-weight="bold" text-anchor="middle">啟動子 P</text>
          <rect x="80" y="20" width="80" height="40" fill="#fde68a" stroke="#d97706"/><text x="120" y="45" fill="#b45309" font-size="12" font-weight="bold" text-anchor="middle">操縱基因 O</text>
          <rect x="160" y="20" width="80" height="40" fill="#bbf7d0" stroke="#16a34a"/><text x="200" y="45" fill="#15803d" font-size="12" font-weight="bold" text-anchor="middle">lac Z</text>
          <rect x="240" y="20" width="80" height="40" fill="#bbf7d0" stroke="#16a34a"/><text x="280" y="45" fill="#15803d" font-size="12" font-weight="bold" text-anchor="middle">lac Y</text>
          <rect x="320" y="20" width="80" height="40" fill="#bbf7d0" stroke="#16a34a"/><text x="360" y="45" fill="#15803d" font-size="12" font-weight="bold" text-anchor="middle">lac A</text>
          <!-- Repressor blocking O -->
          <circle cx="120" cy="110" r="24" fill="#ef4444" stroke="#fff" stroke-width="2"/>
          <text x="120" y="115" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">阻遏蛋白</text>
          <path d="M120,86 L120,62" stroke="#ef4444" stroke-width="3" stroke-dasharray="4 3"/>
          <text x="200" y="160" fill="#9d174d" font-size="13" font-weight="bold" text-anchor="middle">有乳糖存在時：異乳糖與阻遏蛋白結合使其去活化，RNA聚合酶啟動轉錄</text>
        </g>
        
</svg>