<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <filter id="dropshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="360" rx="14" fill="#f0fdfa"/>
  <rect x="12" y="12" width="576" height="336" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" opacity="0.95" filter="url(#dropshadow)"/>
  
  <!-- Subtle header banner -->
  <rect x="12" y="12" width="576" height="44" rx="10" fill="#0d9488"/>
  <rect x="12" y="44" width="576" height="12" fill="#0d9488"/>
  <text x="32" y="38" fill="#ffffff" font-size="14" font-family="'Noto Serif TC', serif" font-weight="900" letter-spacing="1">圖 1-4　細胞週期與細胞分裂過程</text>
  <circle cx="560" cy="34" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="538" cy="34" r="5" fill="#ffffff" opacity="0.3"/>

  <!-- Content -->
  
        <!-- Cell Cycle circle & Mitosis -->
        <g transform="translate(300, 180)">
          <!-- Outer Pie Chart -->
          <circle cx="0" cy="0" r="110" fill="none" stroke="#ccfbf1" stroke-width="28"/>
          <!-- M-phase highlighted sector -->
          <circle cx="0" cy="0" r="110" fill="none" stroke="#0d9488" stroke-width="32" stroke-dasharray="80 610"/>
          <text x="75" y="-85" fill="#0f766e" font-size="14" font-weight="900">M 分裂期</text>
          <!-- Interphase zones -->
          <text x="-90" y="-30" fill="#0f766e" font-size="13" font-weight="bold">G1 期 (生長)</text>
          <text x="-30" y="85" fill="#0f766e" font-size="13" font-weight="bold">S 期 (DNA複製)</text>
          <text x="60" y="30" fill="#0f766e" font-size="13" font-weight="bold">G2 期</text>
          <!-- Center Text -->
          <circle cx="0" cy="0" r="55" fill="#fff" stroke="#0d9488" stroke-width="2"/>
          <text x="0" y="-5" fill="#0f766e" font-size="13" font-weight="bold" text-anchor="middle">細胞週期</text>
          <text x="0" y="16" fill="#666" font-size="11" text-anchor="middle">間期 90%</text>
        </g>
        
</svg>