<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <filter id="dropshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="360" rx="14" fill="#f0fdfa"/>
  <rect x="12" y="12" width="576" height="336" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" opacity="0.95" filter="url(#dropshadow)"/>
  
  <!-- Subtle header banner -->
  <rect x="12" y="12" width="576" height="44" rx="10" fill="#0d9488"/>
  <rect x="12" y="44" width="576" height="12" fill="#0d9488"/>
  <text x="32" y="38" fill="#ffffff" font-size="14" font-family="'Noto Serif TC', serif" font-weight="900" letter-spacing="1">圖 1-1　細胞的分子組成與生物巨分子</text>
  <circle cx="560" cy="34" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="538" cy="34" r="5" fill="#ffffff" opacity="0.3"/>

  <!-- Content -->
  
        <!-- Water molecules hydrogen bonds & peptide bond -->
        <g transform="translate(300, 200)">
          <!-- Water cluster -->
          <g transform="translate(-160, -40)">
            <circle cx="0" cy="0" r="26" fill="#38bdf8"/>
            <circle cx="-20" cy="-22" r="14" fill="#e0f2fe"/><circle cx="20" cy="-22" r="14" fill="#e0f2fe"/>
            <text x="0" y="7" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">O</text>
            <text x="-20" y="-17" fill="#0369a1" font-size="10" font-weight="bold" text-anchor="middle">H</text>
            <text x="20" y="-17" fill="#0369a1" font-size="10" font-weight="bold" text-anchor="middle">H</text>
            <!-- H-bond dashes -->
            <path d="M26,-10 L70,-10" stroke="#0284c7" stroke-width="3" stroke-dasharray="4 4"/>
          </g>
          <!-- Peptide Bond Diagram -->
          <g transform="translate(60, -40)">
            <rect x="-100" y="-35" width="200" height="70" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
            <text x="0" y="-10" fill="#0f766e" font-size="14" font-weight="bold" text-anchor="middle">胜肽鍵 (—CO—NH—)</text>
            <text x="0" y="16" fill="#134e4a" font-size="12" text-anchor="middle">胺基酸脫水縮合形成多胜肽</text>
          </g>
          <!-- Four Macromolecules Cards -->
          <g transform="translate(-220, 60)">
            <g transform="translate(0,0)"><rect width="95" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="47" y="22" fill="#0369a1" font-size="12" font-weight="bold" text-anchor="middle">醣類</text><text x="47" y="38" fill="#555" font-size="10" text-anchor="middle">單醣/雙醣/多醣</text></g>
            <g transform="translate(115,0)"><rect width="95" height="50" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="47" y="22" fill="#b45309" font-size="12" font-weight="bold" text-anchor="middle">脂質</text><text x="47" y="38" fill="#555" font-size="10" text-anchor="middle">三酸甘油酯/磷脂</text></g>
            <g transform="translate(230,0)"><rect width="95" height="50" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="47" y="22" fill="#15803d" font-size="12" font-weight="bold" text-anchor="middle">蛋白質</text><text x="47" y="38" fill="#555" font-size="10" text-anchor="middle">胺基酸/四級結構</text></g>
            <g transform="translate(345,0)"><rect width="95" height="50" rx="8" fill="#fce7f3" stroke="#db2777"/><text x="47" y="22" fill="#be185d" font-size="12" font-weight="bold" text-anchor="middle">核酸</text><text x="47" y="38" fill="#555" font-size="10" text-anchor="middle">DNA / RNA 核苷酸</text></g>
          </g>
        </g>
        
</svg>