<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bggrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="pgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="480" rx="16" fill="url(#bggrad)"/>
  
  <!-- Subtle Scientific Grid / Hex Pattern -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.08" fill="none">
    <circle cx="200" cy="240" r="180"/>
    <circle cx="200" cy="240" r="140"/>
    <circle cx="200" cy="240" r="100"/>
    <line x1="20" y1="240" x2="380" y2="240"/>
    <line x1="200" y1="60" x2="200" y2="420"/>
    <line x1="72" y1="112" x2="328" y2="368"/>
    <line x1="72" y1="368" x2="328" y2="112"/>
  </g>

  <!-- Top Spine Header -->
  <rect x="0" y="0" width="400" height="56" fill="rgba(0,0,0,0.22)"/>
  <text x="26" y="34" fill="#ffffff" font-size="12" font-family="'Noto Sans TC', sans-serif" letter-spacing="2.5" font-weight="700" opacity="0.95">普通型高級中等學校 · 自然科學領域</text>
  <rect x="330" y="16" width="44" height="24" rx="12" fill="#f59e0b"/>
  <text x="352" y="32" fill="#ffffff" font-size="11" font-family="'Noto Sans TC', sans-serif" font-weight="900" text-anchor="middle">翰林</text>

  <!-- Chapter Number & Tag -->
  <g transform="translate(32, 90)">
    <rect x="0" y="0" width="130" height="30" rx="15" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="65" y="20" fill="#ffffff" font-size="13" font-family="'Noto Sans TC', sans-serif" font-weight="700" letter-spacing="2" text-anchor="middle">CHAPTER 02</text>
  </g>

  <!-- Main Illustration Art -->
  
        <!-- ATP Synthase & Mitochondria energy concept -->
        <g transform="translate(200, 260)">
          <!-- Outer membrane & proton gradient -->
          <circle cx="0" cy="0" r="130" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 8" opacity="0.6"/>
          <!-- Central Turbine / ATP Synthase -->
          <circle cx="0" cy="0" r="50" fill="url(#pgrad)" stroke="#fff" stroke-width="3"/>
          <g fill="#fff" opacity="0.9">
            <rect x="-10" y="-75" width="20" height="35" rx="6"/>
            <rect x="-10" y="40" width="20" height="35" rx="6"/>
            <rect x="-75" y="-10" width="35" height="20" rx="6"/>
            <rect x="40" y="-10" width="35" height="20" rx="6"/>
          </g>
          <!-- Rotation dynamic arrows -->
          <path d="M-80,-60 A100,100 0 0,1 60,-80" fill="none" stroke="#fde68a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
          <path d="M80,60 A100,100 0 0,1 -60,80" fill="none" stroke="#fde68a" stroke-width="5" stroke-linecap="round"/>
          <text x="0" y="8" fill="#fff" font-size="20" font-weight="900" text-anchor="middle" font-family="sans-serif">ATP</text>
        </g>
        

  <!-- Title & Description Block -->
  <g transform="translate(32, 380)">
    <text x="0" y="0" fill="#f59e0b" font-size="11" font-family="'Noto Sans TC', sans-serif" font-weight="700" letter-spacing="3.5" text-transform="uppercase">ENERGY & METABOLISM</text>
    <text x="0" y="36" fill="#ffffff" font-size="30" font-family="'Noto Serif TC', serif" font-weight="900" letter-spacing="1.5">細胞的能量與代謝</text>
    <text x="0" y="62" fill="rgba(255,255,255,0.85)" font-size="12" font-family="'Noto Sans TC', sans-serif" font-weight="500">新陳代謝 · 酵素催化 · 呼吸作用 · ATP能量流轉</text>
  </g>

  <!-- Bottom Brand Footer -->
  <line x1="32" y1="452" x2="368" y2="452" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="32" y="468" fill="rgba(255,255,255,0.7)" font-size="10.5" font-family="'Noto Sans TC', sans-serif" letter-spacing="1">選修生物（Ⅰ）互動教材 · 臺北市立麗山高中生物科自編</text>
  <text x="368" y="468" fill="#f59e0b" font-size="11" font-family="'Noto Sans TC', sans-serif" font-weight="900" text-anchor="end">HANLIN</text>
</svg>