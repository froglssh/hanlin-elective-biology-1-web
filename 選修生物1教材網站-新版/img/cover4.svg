<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bggrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d174d"/>
      <stop offset="60%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="pgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="480" rx="16" fill="url(#bggrad)"/>
  
  <!-- Subtle Scientific Grid / Hex Pattern -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.08" fill="none">
    <circle cx="200" cy="240" r="180"/>
    <circle cx="200" cy="240" r="140"/>
    <circle cx="200" cy="240" r="100"/>
    <line x1="20" y1="240" x2="380" y2="240"/>
    <line x1="200" y1="60" x2="200" y2="420"/>
    <line x1="72" y1="112" x2="328" y2="368"/>
    <line x1="72" y1="368" x2="328" y2="112"/>
  </g>

  <!-- Top Spine Header -->
  <rect x="0" y="0" width="400" height="56" fill="rgba(0,0,0,0.22)"/>
  <text x="26" y="34" fill="#ffffff" font-size="12" font-family="'Noto Sans TC', sans-serif" letter-spacing="2.5" font-weight="700" opacity="0.95">普通型高級中等學校 · 自然科學領域</text>
  <rect x="330" y="16" width="44" height="24" rx="12" fill="#f472b6"/>
  <text x="352" y="32" fill="#ffffff" font-size="11" font-family="'Noto Sans TC', sans-serif" font-weight="900" text-anchor="middle">翰林</text>

  <!-- Chapter Number & Tag -->
  <g transform="translate(32, 90)">
    <rect x="0" y="0" width="130" height="30" rx="15" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="65" y="20" fill="#ffffff" font-size="13" font-family="'Noto Sans TC', sans-serif" font-weight="700" letter-spacing="2" text-anchor="middle">CHAPTER 04</text>
  </g>

  <!-- Main Illustration Art -->
  
        <!-- DNA Replication Fork & Central Dogma -->
        <g transform="translate(200, 260)">
          <!-- Double helix ribbons -->
          <path d="M-120,-90 Q-60,-130 0,-90 T120,-90" stroke="#f472b6" stroke-width="6" fill="none"/>
          <path d="M-120,-50 Q-60,-10 0,-50 T120,-50" stroke="#60a5fa" stroke-width="6" fill="none"/>
          <!-- Base pairs rungs -->
          <line x1="-90" y1="-105" x2="-90" y2="-35" stroke="#fff" stroke-width="3" opacity="0.8"/>
          <line x1="-30" y1="-75" x2="-30" y2="-65" stroke="#fff" stroke-width="3" opacity="0.8"/>
          <line x1="30" y1="-105" x2="30" y2="-35" stroke="#fff" stroke-width="3" opacity="0.8"/>
          <line x1="90" y1="-75" x2="90" y2="-65" stroke="#fff" stroke-width="3" opacity="0.8"/>
          <!-- RNA Polymerase transcription bubble -->
          <ellipse cx="0" cy="40" rx="80" ry="50" fill="url(#pgrad)" stroke="#fff" stroke-width="3" opacity="0.95"/>
          <path d="M-60,30 Q-20,10 20,40 T70,25" stroke="#fbbf24" stroke-width="5" fill="none"/>
          <text x="0" y="55" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">mRNA</text>
        </g>
        

  <!-- Title & Description Block -->
  <g transform="translate(32, 380)">
    <text x="0" y="0" fill="#f472b6" font-size="11" font-family="'Noto Sans TC', sans-serif" font-weight="700" letter-spacing="3.5" text-transform="uppercase">EXPRESSION & REGULATION OF GENES</text>
    <text x="0" y="36" fill="#ffffff" font-size="30" font-family="'Noto Serif TC', serif" font-weight="900" letter-spacing="1.5">遺傳訊息的表現與調控</text>
    <text x="0" y="62" fill="rgba(255,255,255,0.85)" font-size="12" font-family="'Noto Sans TC', sans-serif" font-weight="500">DNA複製 · 轉錄修飾 · 轉譯合成 · 操縱組調控</text>
  </g>

  <!-- Bottom Brand Footer -->
  <line x1="32" y1="452" x2="368" y2="452" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="32" y="468" fill="rgba(255,255,255,0.7)" font-size="10.5" font-family="'Noto Sans TC', sans-serif" letter-spacing="1">選修生物（Ⅰ）互動教材 · 臺北市立麗山高中生物科自編</text>
  <text x="368" y="468" fill="#f472b6" font-size="11" font-family="'Noto Sans TC', sans-serif" font-weight="900" text-anchor="end">HANLIN</text>
</svg>