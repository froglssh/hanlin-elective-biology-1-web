<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <filter id="dropshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="360" rx="14" fill="#f0fdfa"/>
  <rect x="12" y="12" width="576" height="336" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" opacity="0.95" filter="url(#dropshadow)"/>
  
  <!-- Subtle header banner -->
  <rect x="12" y="12" width="576" height="44" rx="10" fill="#0d9488"/>
  <rect x="12" y="44" width="576" height="12" fill="#0d9488"/>
  <text x="32" y="38" fill="#ffffff" font-size="14" font-family="'Noto Serif TC', serif" font-weight="900" letter-spacing="1">圖 1-2　生物膜的流體鑲嵌模型</text>
  <circle cx="560" cy="34" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="538" cy="34" r="5" fill="#ffffff" opacity="0.3"/>

  <!-- Content -->
  
        <!-- Fluid Mosaic Model -->
        <g transform="translate(300, 180)">
          <!-- Lipid heads top & bottom -->
          <g fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5">
            <circle cx="-200" cy="-40" r="10"/><circle cx="-160" cy="-40" r="10"/><circle cx="-120" cy="-40" r="10"/><circle cx="-80" cy="-40" r="10"/>
            <circle cx="80" cy="-40" r="10"/><circle cx="120" cy="-40" r="10"/><circle cx="160" cy="-40" r="10"/><circle cx="200" cy="-40" r="10"/>
            <circle cx="-200" cy="40" r="10"/><circle cx="-160" cy="40" r="10"/><circle cx="-120" cy="40" r="10"/><circle cx="-80" cy="40" r="10"/>
            <circle cx="80" cy="40" r="10"/><circle cx="120" cy="40" r="10"/><circle cx="160" cy="40" r="10"/><circle cx="200" cy="40" r="10"/>
          </g>
          <!-- Fatty acid tails -->
          <g stroke="#14b8a6" stroke-width="2.5" fill="none">
            <path d="M-200,-30 L-200,-5 M-160,-30 L-160,-5 M-120,-30 L-120,-5 M-80,-30 L-80,-5"/>
            <path d="M80,-30 L80,-5 M120,-30 L120,-5 M160,-30 L160,-5 M200,-30 L200,-5"/>
            <path d="M-200,30 L-200,5 M-160,30 L-160,5 M-120,30 L-120,5 M-80,30 L-80,5"/>
            <path d="M80,30 L80,5 M120,30 L120,5 M160,30 L160,5 M200,30 L200,5"/>
          </g>
          <!-- Transmembrane Protein -->
          <rect x="-35" y="-65" width="70" height="130" rx="22" fill="#0d9488" stroke="#fff" stroke-width="3"/>
          <text x="0" y="5" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">膜蛋白</text>
          <!-- Cholesterol -->
          <rect x="-105" y="-15" width="10" height="30" rx="3" fill="#fbbf24"/>
          <!-- Glycoprotein sugar tree -->
          <path d="M15,-65 L30,-105 M30,-105 L20,-125 M30,-105 L45,-120" stroke="#f59e0b" stroke-width="3" fill="none"/>
          <circle cx="20" cy="-125" r="5" fill="#f59e0b"/><circle cx="45" cy="-120" r="5" fill="#f59e0b"/>
          <text x="50" y="-135" fill="#b45309" font-size="12" font-weight="bold">醣蛋白（細胞辨識）</text>
        </g>
        
</svg>