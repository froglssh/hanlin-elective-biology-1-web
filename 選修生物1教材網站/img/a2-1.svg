            <text x="0" y="160" fill="#78350f" font-size="12" font-weight="bold" text-anchor="middle">室溫常態 (新鮮肝臟)</text>
            <text x="0" y="178" fill="#15803d" font-size="11" font-weight="bold" text-anchor="middle">劇烈釋放 O2 氣泡</text>
