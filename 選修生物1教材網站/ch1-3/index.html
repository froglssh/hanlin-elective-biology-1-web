const CONTENT={"lessons": [{"id": "b1-c13-l01", "t": "選擇性通透：先看分子，再看路徑", "sec": "s1", "slide": 1, "sourceSlides": [1, 2, 5], "sourcePages": [1], "src": "課本P36；PPT 1、2、5", "figSpec": {"image": "ppt_005"}, "txt": "<h3>圖像與機制</h3><ul><li>脂雙層內部疏水，分子的大小、電荷、極性與脂溶性共同影響通透性。</li><li>O₂、CO₂等小型非極性分子可直接穿膜；離子通常需要運輸蛋白。</li><li>水與甘油有極性，不能因教材列在可穿膜例子中，就稱它們為非極性；是否有專屬蛋白也影響速率。</li></ul><p class=\"thinking\"><strong>想一想</strong> 鈉離子很小，為何仍不能像氧氣直接大量穿過脂雙層？</p><div class=\"quote\">細<br>胞<br>膜<br>水、離子等<br>脂溶性物質、酒精、水或 O2<br>及CO2 等氣體<br>a簡單擴散<br>b促進性擴散（通道蛋白）<br>被動運輸<br>-3 細胞膜運輸物質的方式<br>1<br>　　細胞膜是細胞的屏障，可以選擇性讓某些物質通過，氣體可經<br>由擴散作用通過細胞膜，以進出動、植物細胞，而蛋白質分子則否。物<br>質能否進出細胞膜以及通過細胞膜的方式，和細胞的種類及該物質的分<br>子大小、結構有關。<br>1-3.1 小分子物質通過細胞膜的運輸<br>細胞膜的結構為脂雙層，內部主要是疏水性的脂肪酸，因此帶有電荷<br>的離子或是具有極性的分子必須藉由細胞膜上的運輸蛋白進出細胞，故細<br>胞膜對物質進出具有選擇性，又稱為選擇性通透膜。<br>小分子物質通過細胞膜的方式有兩種，分別為被動運輸與主動運輸。<br>被動運輸不需消耗能量，是物質由濃度較高處擴散至較低處的過程。不帶<br>電荷及不具極性或極性較小的物質，可以直接通過磷脂層，稱為簡單擴散<br>（圖 1－26a），如脂溶性的物質（如脂肪酸）、酒精、水或 O2 及 CO2 <br>被動運輸　passive transport<br>主動運輸　active transport<br>簡單擴散　simple diffusion<br>36　選修生物 Ⅰ (全)<br><small>課本P36完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">1-3 <br>細胞膜運輸物質的方式<br>1-3.1 <br>小分子物質通過細胞膜的運輸<br>1-3.2 <br>大分子物質進出細胞的方式<br>ATP<br>ADP + Pi<small>原PPT第1頁完整抽取原文；補充範圍見教學重點</small></div><div class=\"quote\">◆ 細胞膜<br>對物質的進出具<br>選擇性<br>→ <br>分子大小<br>、<br>結構<br>決定<br>物質<br>能否<br>通過<br>細胞膜<br>，還有其<br>通過細胞膜的方式<br>1-3 <br>細胞膜運輸物質的方式<br>配合<br>課本 <br>P36<small>原PPT第2頁完整抽取原文；補充範圍見教學重點</small></div><div class=\"quote\">◆ 細胞膜為脂雙層，內部是疏水性的脂肪酸<br>1-3.1 <br>小分子物質通過細胞膜的運輸<br>→ <br>不帶電荷物質<br>、<br>脂溶性物質 <br>：<br>直接通過細胞膜<br>→ <br>帶電荷物質<br>、<br>水溶性<br>物質 <br>：藉<br>細胞膜上的<br>運輸蛋白<br>通過<br>細胞膜<br>細胞外<br>細胞內<br>脂雙層<br>運輸蛋白<br>親水性<br>頭部<br>疏<br>水性<br>尾部<br>磷脂<br>配合<br>課本 <br>P36<small>原PPT第5頁完整抽取原文；補充範圍見教學重點</small></div>", "tb": [["step_001", "P36完整課本頁"]]}, {"id": "b1-c13-l02", "t": "簡單擴散：看的是淨移動方向", "sec": "s1", "slide": 6, "sourceSlides": [6], "sourcePages": [1], "src": "課本P36；PPT 6", "figSpec": {"image": "transport_ab"}, "txt": "<h3>圖像與機制</h3><ul><li>不經 性的物質（如脂肪酸）、酒精、水或 O2 及 CO2 <br>被動運輸　passive transport<br>主動運輸　active transport<br>簡單擴散　simple diffusion<br>36　選修生物 Ⅰ (全)<br><small>課本P36完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">葡萄糖、胺基酸等<br>c促進性擴散（載體蛋白）<br>d主動運輸（載體蛋白）<br>可逆濃度運輸的物質<br>細<br>胞<br>膜<br>主動運輸<br>ADP＋<br>ATP<br>Pi<br> 圖 1－26　<br>     小分子物質通過細胞膜的運輸<br>等氣體。帶電荷或具極性的物質則須經由膜上運輸蛋白進<br>出細胞，稱為促進性擴散（圖 1－26bc），如離子、葡<br>萄糖等。當細胞內外發生溶液的濃度差，水可藉由簡單擴<br>散或促進性擴散通過，此過程為滲透作用。<br>運輸蛋白具專一性，只讓特定物質通過，可分為通道<br>蛋白及載體蛋白。通道蛋白在膜上形成通道，容許水分<br>子、特定離子通過，例如：水通道蛋白與鉀離子通道蛋<br>白（圖 1－26b）；載體蛋白則先與輸送的物質結合，透<br>過構形改變而將物質轉運至膜的另一側，例如：葡萄糖<br>載體蛋白（圖 1－26c）。<br>主動運輸是細胞利用膜上的載體蛋白，以消耗能量的<br>方式運輸物質，此方式不受濃度梯度限制，可以將物質由<br>低濃度處通過細胞膜往高濃度處運輸。主動運輸所需的能<br>量通常來自 ATP，例如：細胞膜上的質子幫浦（圖 1－<br>26d）利用 ATP 釋出的能量將氫離子送出細胞，使細胞<br>內的氫離子濃度遠低於細胞外。<br>阿格里　Peter Agre, 1949∼<br>麥金農　Roderick MacKinnon, 1956∼<br>促進性擴散　facilitated diffusion<br>滲透作用　osmosis<br>通道蛋白　channel protein<br>載體蛋白　carrier protein<br>質子幫浦　proton pump<br>第 1 章  細胞的構造與功能　37<br>水通道蛋白<br>水通道蛋白是水分子的<br>通道蛋白，可使水分子快速<br>進出細胞，以維持細胞內、<br>外滲透度的平衡。美國科學<br>家阿格里因研究細胞膜上的<br>水通道蛋白，於 2003 年與<br>研究鉀離子通道的麥金農共<br>同獲得諾貝爾化學獎。<br>知識補給站<br><small>課本P37完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">①<br> <br>通道蛋白<br> <br>：親水性通道，如水<br>通道<br>蛋白<br>、<br>鉀離子<br>通道<br>蛋白<br>②<br> <br>載體蛋白<br> <br>：運輸物質時<br>構形會發生改變，如葡萄糖載體蛋白<br>◆ <br>物質藉通過<br>細胞<br>膜<br>上的<br>運輸<br>蛋白<br>進出細胞，包括<br>帶電荷物質<br>、<br>水溶性物質<br>◆ <br>運輸蛋白 <br>：<br>通道蛋白<br>載體<br>蛋白<br>1-3.1 <br>小分子物質通過細胞膜的運輸<br>促進性擴散<br>配合<br>課本 <br>P37<small>原PPT第7頁完整抽取原文；補充範圍見教學重點</small></div>", "tb": [["step_001", "P36完整課本頁"], ["step_002", "P37完整課本頁"]]}, {"id": "b1-c13-l04", "t": "載體蛋白：結合、變形、釋放", "sec": "s1", "slide": 7, "sourceSlides": [7, 8], "sourcePages": [2], "src": "課本P37；PPT 7、8", "figSpec": {"image": "transport_cd"}, "txt": "<h3>圖像與機制</h3><ul><li>載體先與受質結合，再改變構形，把受質釋放到另一側。</li><li>促進性擴散不直接消耗ATP，仍順受質的有效梯度。</li><li>有限數量與周轉速率使載體可能出現運輸上限；不能把所有通道都說成載體結合位點飽和的同一機制。</li></ul><p class=\"thinking\"><strong>想一想</strong> 同樣需要膜蛋白，為何葡萄糖載體不一定是主動運輸？</p><div class=\"quote\">葡萄糖、胺基酸等<br>c促進性擴散（載體蛋 strong> 只看到「有蛋白質」，還缺哪項證據才能判定主動運輸？</p><div class=\"quote\">細<br>胞<br>膜<br>水、離子等<br>脂溶性物質、酒精、水或 O2<br>及CO2 等氣體<br>a簡單擴散<br>b促進性擴散（通道蛋白）<br>被動運輸<br>-3 細胞膜運輸物質的方式<br>1<br>　　細胞膜是細胞的屏障，可以選擇性讓某些物質通過，氣體可經<br>由擴散作用通過細胞膜，以進出動、植物細胞，而蛋白質分子則否。物<br>質能否進出細胞膜以及通過細胞膜的方式，和細胞的種類及該物質的分<br>子大小、結構有關。<br>1-3.1 小分子物質通過細胞膜的運輸<br>細胞膜的結構為脂雙層，內部主要是疏水性的脂肪酸，因此帶有電荷<br>的離子或是具有極性的分子必須藉由細胞膜上的運輸蛋白進出細胞，故細<br>胞膜對物質進出具有選擇性，又稱為選擇性通透膜。<br>小分子物質通過細胞膜的方式有兩種，分別為被動運輸與主動運輸。<br>被動運輸不需消耗能量，是物質由濃度較高處擴散至較低處的過程。不帶<br>電荷及不具極性或極性較小的物質，可以直接通過磷脂層，稱為簡單擴散<br>（圖 1－26a），如脂溶性的物質（如脂肪酸）、酒精、水或 O2 及 CO2 <br>被動運輸　passive transport<br>主動運輸　active transport<br>簡單擴散　simple diffusion<br>36　選修生物 Ⅰ (全)<br><small>課本P36完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">葡萄糖、胺基酸等<br>c促進性擴散（載體蛋白）<br>d主動運輸（載體蛋白）<br>可逆濃度運輸的物質<br>細<br>胞<br>膜<br>主動運輸<br>ADP＋<br>ATP<br>Pi<br> 圖 1－26　<br>     小分子物質通過細胞膜的運輸<br>等氣體。帶電荷或具極性的物質則須經由膜上運輸蛋白進<br>出細胞，稱為促進性擴散（圖 1－26bc），如離子、葡<br>萄糖等。當細胞內外發生溶液的濃度差，水可藉由簡單擴<br>散或促進性擴散通過，此過程為滲透作用。<br>運輸蛋白具專一性，只讓特定物質通過，可分為通道<br>蛋白及載體蛋白。通道蛋白在膜上形成通道，容許水分<br>子、特定離子通過，例如：水通道蛋白與鉀離子通道蛋<br>白（圖 1－26b）；載體蛋白則先與輸送的物質結合，透<br>過構形改變而將物質轉運至膜的另一側，例如：葡萄糖<br>載體蛋白（圖 1－26c）。<br>主動運輸是細胞利用膜上的載體蛋白，以消耗能量的<br>方式運輸物質，此方式不受濃度梯度限制，可以將物質由<br>低濃度處通過細胞膜往高濃度處運輸。主動運輸所需的能<br>量通常來自 ATP，例如：細胞膜上的質子幫浦（圖 1－<br>26d）利用 ATP 釋出的能量將氫離子送出細胞，使細胞<br>內的氫離子濃度遠低於細胞外。<br>阿格里　Peter Agre, 1949∼<br>麥金農　Roderick MacKinnon, 1956∼<br>促進性擴散　facilitated diffusion<br>滲透作用　osmosis<br>通道蛋白　channel protein<br>載體蛋白　carrier protein<br>質子幫浦　proton pump<br>第 1 章  細胞的構造與功能　37<br>水通道蛋白<br>水通道蛋白是水分子的<br>通道蛋白，可使水分子快速<br>進出細胞，以維持細胞內、<br>外滲透度的平衡。美國科學<br>家阿格里因研究細胞膜上的<br>水通道蛋白，於 2003 年與<br>研究鉀離子通道的麥金農共<br>同獲得諾貝爾化學獎。<br>知識補給站<br><small>課本P37完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">◆ <br>相同點 <br>：<br>①<br> <br>促進性擴散需運輸蛋白<br>①<br> <br>不需消耗能量<br>②<br> <br>物質運輸方向<br>：<br>高濃度→低濃度<br>◆ <br>相異點 <br>：<br>→運輸蛋白<br>具專一性<br>1-3.1 <br>小分子物質通過細胞膜的運輸<br>簡單<br>擴散 <br>vs.<br> 促進<br>性擴散<br>配合<br>課本 <br>P37<small>原PPT第8頁完整抽取原文；補充範圍見教學重點</small></div><div class=\"quote\">被動運輸<br>細胞外<br>細胞膜<br>細胞內<br>通道蛋白<br>脂溶性物質、酒 <br>，如質子幫浦<br>1-3.1 <br>小分子物質通過細胞膜的運輸<br>主動運輸<br>ATP<br>ADP+Pi<br>配合<br>課本 <br>P37<small>原PPT第11頁完整抽取原文；補充範圍見教學重點</small></div><div class=\"quote\">◆<br> <br>特點<br> <br>：<br>(1)<br> <br>需消耗能量<br>(2)<br> <br>物質運輸方向<br>：<br>低濃度<br>→<br>高濃度<br> <br>(<br>違反濃度梯度<br>)<br>(3)<br> <br>需<br>運輸蛋白<br>，具專一性<br>1-3.1 <br>小分子物質通過細胞膜的運輸<br>主動運輸<br>配合<br>課本 <br>P37<small>原PPT第12頁完整抽取原文；補充範圍見教學重點</small></div>", "tb": [["step_002", "P37完整課本頁"]]}, {"id": "b1-c13-l08", "t": "四種路徑：用條件作分類", "sec": "s2", "slide": 3, "sourceSlides": [3, 4, 13, 14], "sourcePages": [1, 2], "src": "課本P36、37；PPT 3、4、13、14", "figSpec": {"image": "ppt_014"}, "txt": "<h3>圖像與機制</h3><ul><li>先分脂雙層直接通過、通道、載體與幫浦，再比較梯度與能量。</li><li>簡單擴散無蛋白載運的周轉限制，但通量仍受膜面積、通透性與梯度影響，不是速率無限。</li><li>主動運輸與胞吞都可耗能，但本章將小分子跨膜主動運輸與囊泡運輸分列。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若只知道運輸耗能，為何還不能直接稱作質子幫浦？</p><div class=\"quote\">細<br>胞<br>膜<br>水、離子等<br>脂溶性物質、酒精、水或 O2<br>及CO2 等氣體<br>a簡單擴散<br>b促進性擴散（通道蛋白）<br>被動運輸<br>-3 細胞膜運輸物質的方式<br>1<br>　　細胞膜是細胞的屏障，可以選擇性讓某些物質通過，氣體可經<br>由擴散作用通過細胞膜，以進出動、植物細胞，而蛋白質分子則否。物<br>質能否進出細胞膜以及通過細胞膜的方式，和細胞的種類及該物質的分<br>子大小、結構有關。<br>1-3.1 小分子物質通過細胞膜的運輸<br>細胞膜的結構為脂雙層，內部主要是疏水性的脂肪酸，因此帶有電荷<br>的離子或是具有極性的分子必須藉由細胞膜上的運輸蛋白進出細胞，故細<br>胞膜對物質進出具有選擇性，又稱為選擇性通透膜。<br>小分子物質通過細胞膜的方式有兩種，分別為被動運輸與主動運輸。<br>被動運輸不需消耗能量，是物質由濃度較高處擴散至較低處的過程。不帶<br>電荷及不具極性或極性較小的物質，可以直接通過磷脂層，稱為簡單擴散<br>（圖 1－26a），如脂溶性的物質（如脂肪酸）、酒精、水或 O2 及 CO2 <br>被動運輸　passive transport<br>主動運輸　active transport<br>簡單擴散　simple diffusion<br>36　選修生物 Ⅰ (全)<br><small>課本P36完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">葡萄糖、胺基酸等<br>c促進性擴散（載體蛋白）<br>d主動運輸（載體蛋白）<br>可逆濃度運輸的物質<br>細<br>胞<br>膜<br>主動運輸<br>ADP＋<br>ATP<br>Pi<br> 圖 1－26　<br>     小分子物質通過細胞膜的運輸<br>等氣體。帶電荷或具極性的物質則須經由膜上運輸蛋白進<br>出細胞，稱為促進性擴散（圖 1－26bc），如離子、葡<br>萄糖等。當細胞內外發生溶液的濃度差，水可藉由簡單擴<br>散或促進性擴散通過，此過程為滲透作用。<br>運輸蛋白具專一性，只讓特定物質通過，可分為通道<br>蛋白及載體蛋白。通道蛋白在膜上形成通道，容許水分<br>子、特定離子通過，例如：水通道蛋白與鉀離子通道蛋<br>白（圖 1－26b）；載體蛋白則先與輸送的物質結合，透<br>過構形改變而將物質轉運至膜的另一側，例如：葡萄糖<br>載體蛋白（圖 1－26c）。<br>主動運輸是細胞利用膜上的載體蛋白，以消耗能量的<br>方式運輸物質，此方式不受濃度梯度限制，可以將物質由<br>低濃度處通過細胞膜往高濃度處運輸。主動運輸所需的能<br>量通常來自 ATP，例如：細胞膜上的質子幫浦（圖 1－<br>26d）利用 ATP 釋出的能量將氫離子送出細胞，使細胞<br>內的氫離子濃度遠低於細胞外。<br>阿格里　Peter Agre, 1949∼<br>麥金農　Roderick MacKinnon, 1956∼<br>促進性擴散　facilitated diffusion<br>滲透作用　osmosis<br>通道蛋白　channel protein<br>載體蛋白　carrier protein<br>質子幫浦　proton pump<br>第 1 章  細胞的構造與功能　37<br>水通道蛋白<br>水通道蛋白是水分子的<br>通道蛋白，可使水分子快速<br>進出細胞，以維持細胞內、<br>外滲透度的平衡。美國科學<br>家阿格里因研究細胞膜上的<br>水通道蛋白，於 2003 年與<br>研究鉀離子通道的麥金農共<br>同獲得諾貝爾化學獎。<br>知識補給站<br><small>課本P37完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">物質通過細胞膜的運輸<br>簡單擴散<br>促進性擴散<br>大分子物質<br>小分子物質<br>被動運輸<br>(<br>擴散作用<br>)<br>主動運輸<br>1-3 <br>細胞膜運輸物質的方式<br>胞吐作用<br>胞吞作用<br>吞噬作用<br>胞飲作用<br>受體媒介胞吞作用<br>物質通過細胞膜的方式<br>補充<small>原PPT第3頁完整抽取原文；補充範圍見教學重點</small></div><div class=\"quote\">物質通過細胞膜的運輸<br>簡單擴散<br>促進性擴散<br>小分子物質<br>大分子物質<br>被動運輸<br>(<br>擴散作用<br>)<br>主動運輸<br>胞吐作用<br>胞吞作用<br>吞噬作用<br>胞飲作用<br>受體媒介胞吞作用<br>1-3.1 <br>小分子物質通過細胞膜的運輸<br>補充<small>原PPT第4頁完整抽取原文；補充範圍見教學重點</small></div><div class=\"quote\">被動運輸<br>細胞外<br>細胞膜<br>細胞內<br>通道蛋白<br>脂溶性物質、酒精、水<br>或 <br>O<br>2<br>及 <br>CO<br>2 <br>等<br>氣體<br>水、離子等<br>載體<br>蛋白<br>載體<br>蛋白<br>可逆濃度運輸的物質<br>ATP<br>ADP + Pi<br>1-3.1 <br>小分子物質通過細胞膜的運輸<br>促進性擴散<br>簡單擴散<br>主動運輸<br>葡萄糖、胺基酸等<br>配合<br>課本 <br>P37<br>、<br>38<small>原PPT第13頁完整抽取原文；補充範圍見教學重點</small></div><div class=\"quote\">◆ 被動運輸和主動運輸的比較 ：<br>被動運輸<br>主動運輸<br>簡單擴散<br>促進性擴散<br>物質淨移<br>動方向<br>高濃度<br>↓<br>低濃度<br>高濃度<br>↓<br>低濃度<br>低濃度<br>↓<br>高濃度<br>運輸蛋白<br>不需要<br>需要<br>需要<br>能量消耗<br>不需要<br>不需要<br>需要<br>專一性<br>無<br>有<br>有<br>1-3.1 <br>小分子物質通過細胞膜的運輸<br>補充<small>原PPT第14頁完整抽取原文；補充範圍見教學重點</small></div>", "tb": [["step_001", "P36完整課本頁"], ["step_002", "P37完整課本頁"]]}, {"id": "b1-c13-l09", "t": "滲透作用：水勢與條件", "sec": "s3", "slide": 9, "sourceSlides": [9, 15], "sourcePages": [2, 3], "src": "課本P37、38；PPT 9、15", "figSpec": {"image": "osmosis_all"}, "txt": "<h3>圖像與機制</h3><ul><li>水跨選擇性通透膜的被動移動稱為滲透；需先確認膜允許哪些溶質通過。</li><li>在溶質不能通過且壓力相同的簡化模型中，水淨移向溶質濃度較高的一側。</li><li>一般情況還受壓力影響，可用水勢整合判讀；平衡不必等於兩側溶質濃度完全一樣。</li></ul><p class=\"thinking\"><strong>想一想</strong> 為何植物細胞膨壓增加後，內外濃度仍可 endocytosis"}, "txt": "<h3>圖像與機制</h3><ul><li>胞吞把胞外物質包入囊泡；胞吐使囊泡與膜融合後釋出內容物。</li><li>兩者都涉及能量與膜重塑；本章分別於小分子的載體主動運輸。</li><li>囊泡內腔與細胞質不是同一區域；吞入不等於受質直接溶到細胞質液。</li></ul><p class=\"thinking\"><strong>想一想</strong> 一個蛋白質被吞入囊泡後，是否已直接跨過磷脂層進入細胞質？</p><div class=\"quote\">1-3.2 大分子物質進出細胞的方式<br>細胞可經由胞吞作用將大分子物質帶進細胞，也可<br>經由胞吐作用將物質釋出細胞，兩者都需要消耗能量。<br>胞吞作用又可分為吞噬作用、胞飲作用及受體媒介<br>胞吞作用（圖 1－27a）。吞噬作用是細胞膜向外伸展<br>成偽足，將細胞外較大的固體顆粒包住，進入細胞後形<br>成食泡；胞飲作用是藉由細胞膜的內陷，將細胞外的可<br>溶性物質隨著液體包在囊泡內送進細胞。<br>胞吞作用　endocytosis<br>胞吐作用　exocytosis<br>胞飲作用　pinocytosis<br>受體媒介胞吞作用　receptor-mediated endocytosis<br> 圖 1－27　大分子物質進出細胞的方式。a胞吞作用；b胞吐作用。<br>吞噬作用<br>胞飲作用<br>胞吞作用<br>a<br>偽足<br>固體顆粒<br>可溶性物質<br>細胞膜<br>細胞外液<br>細胞質液<br>食泡<br>囊泡<br>40　選修生物 Ⅰ (全)<br>細胞經胞吐作用將分泌<br>物運送到細胞外，內膜系統<br>的膜最後經囊泡成為細胞膜<br>的一部分，細胞膜的面積因<br>此會增大。但是生物體的細<br>胞大多會維持適當的大小，<br>不會持續增大，可見細胞另<br>有一套機制，可以回收多餘<br>的細胞膜，請問細胞如何處<br>理這些多出來的細胞膜？<br>腦力激盪<br><small>課本P40完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">另外，有些物質必須先與細胞膜上的受體接合，細<br>胞再進行胞吞作用攝入這些物質，稱為受體媒介胞吞作<br>用，例如：肝臟細胞膜上的受體蛋白，可與運輸膽固醇<br>的特定蛋白質進行專一性接合，經由受體媒介胞吞作用<br>將血液中的膽固醇移入肝細胞中。<br>胞吐作用是細胞內形成的囊泡移向細胞膜並與膜融<br>合，將囊泡內的物質釋出細胞，而囊泡的膜則併入細胞<br>膜。細胞的分泌物如酵素或激素等，通常以此方式釋出<br>至細胞外，即分泌作用（圖 1－27b）。<br>胞吐作用<br>b<br>受體媒介胞吞作用<br>受體<br>酵素或激素<br>膽固醇<br>蛋白質<br>囊泡<br>囊泡<br>第 1 章  細胞的構造與功能　41<br><small>課本P41完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">物質通過細胞膜的運輸<br>簡單擴散<br>促進性擴散<br>小分子物質<br>大分子物質<br>被動運輸<br>(<br>擴散作用<br>)<br>主動運輸<br>1-3 <br>細胞膜運輸物質的方式<br>胞吐作用<br>胞吞作用<br>吞噬作用<br>胞飲作用<br>受體媒介胞吞作用<br>補充<small>原PPT第19頁完整抽取原文；補充範圍見教學重點</small></div><div class=\"quote\">1-3.2 <br>大分子物質進出細胞的方式<br>物質通過細胞膜的運輸<br>簡單擴散<br>促進性擴散<br>小分子物質<br>大分子物質<br>被動運輸<br>(<br>擴散作用<br>)<br>主動運輸<br>胞吞作用<br>胞吐作用<br>吞噬作用<br>胞飲作用<br>受體媒介胞吞作用<br>補充<br>胞吞作用與胞吐作用<small>原PPT第20頁完整抽取原文；補充範圍見教學重點</small></div>", "tb": [["step_005", "P40完整課本頁"], ["step_006", "P41完整課本頁"]]}, {"id": "b1-c13-l15", "t": "吞噬：偽足包住大顆粒", "sec": "s4", "slide": 21, "sourceSlides": [21], "sourcePages": [5], "src": "課本P40；PPT 21", "figSpec": {"image": "endocytosis"}, "txt": "<h3>圖像與機制</h 的膜最後經囊泡成為細胞膜<br>的一部分，細胞膜的面積因<br>此會增大。但是生物體的細<br>胞大多會維持適當的大小，<br>不會持續增大，可見細胞另<br>有一套機制，可以回收多餘<br>的細胞膜，請問細胞如何處<br>理這些多出來的細胞膜？<br>腦力激盪<br><small>課本P40完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">1-3.2 <br>大分子物質進出細胞的方式<br>囊泡<br>胞飲作用<br>◆ 過程 ：<br>細胞膜內陷形成囊泡→囊泡將物質包裹起來→物質進入細胞內<br>◆ 需要耗能<br>◆ 物質 ：可溶性物質<br>配合<br>課本 <br>P40<small>原PPT第22頁完整抽取原文；補充範圍見教學重點</small></div>", "tb": [["step_005", "P40完整課本頁"]]}, {"id": "b1-c13-l17", "t": "受體媒介胞吞：先結合再內陷", "sec": "s4", "slide": 23, "sourceSlides": [23], "sourcePages": [6], "src": "課本P41；PPT 23", "figSpec": {"image": "receptor"}, "txt": "<h3>圖像與機制</h3><ul><li>受質先與膜上的受體接合，再由膜內陷形成囊泡。</li><li>專一性來自受體與配體辨識，不是膽固醇直接穿過受體通道。</li><li>受體數量、結合與胞內分選都可能影響攝入；受體回收與受質利用是不同步驟。</li></ul><p class=\"thinking\"><strong>想一想</strong> 受體正常結合但無法內陷，能否保證攝入量正常？</p><div class=\"quote\">另外，有些物質必須先與細胞膜上的受體接合，細<br>胞再進行胞吞作用攝入這些物質，稱為受體媒介胞吞作<br>用，例如：肝臟細胞膜上的受體蛋白，可與運輸膽固醇<br>的特定蛋白質進行專一性接合，經由受體媒介胞吞作用<br>將血液中的膽固醇移入肝細胞中。<br>胞吐作用是細胞內形成的囊泡移向細胞膜並與膜融<br>合，將囊泡內的物質釋出細胞，而囊泡的膜則併入細胞<br>膜。細胞的分泌物如酵素或激素等，通常以此方式釋出<br>至細胞外，即分泌作用（圖 1－27b）。<br>胞吐作用<br>b<br>受體媒介胞吞作用<br>受體<br>酵素或激素<br>膽固醇<br>蛋白質<br>囊泡<br>囊泡<br>第 1 章  細胞的構造與功能　41<br><small>課本P41完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">蛋白質受體<br>膽固醇<br>蛋白質<br>囊泡<br>1-3.2 <br>大分子物質進出細胞的方式<br>◆ 過程 ：物質和細胞膜上的受體結合<br>→細胞膜內陷形成囊泡→囊泡將<br>物質<br>攝入細胞內<br>◆ 需要耗能<br>◆ 物質 ：<br>特定分子，具有高度專一性<br>受體媒<br>介胞吞<br>作用<br>配合<br>課本 <br>P41<small>原PPT第23頁完整抽取原文；補充範圍見教學重點</small></div>", "tb": [["step_006", "P41完整課本頁"]]}, {"id": "b1-c13-l18", "t": "LDL：運送、分選與受體回收", "sec": "s4", "slide": 24, "sourceSlides": [24, 25], "sourcePages": [6], "src": "課本P41；PPT 24、25", "figSpec": {"image": "ppt_025"}, "txt": "<h3>圖像與機制</h3><ul><li>LDL脂蛋白粒子攜帶膽固醇等脂質，以表面載脂蛋白與受體辨識。</li><li>經內體分選，受體可回到細胞膜；LDL內容物可送至溶體處理。</li><li>原PPT將受體回收畫成經內質網、高基氏體的固定路徑過度簡化；教學以內體回收概念補充。</li></ul><p class=\"thinking\"><strong>想一想</strong> 受體與貨物進入同一囊泡，後來是否一定去同一位置？</p><div class=\"scope-note\">原PPT24、25的「缺脂蛋白」用語應理解為載脂蛋白；原文保留，標準名稱及回收路徑於此補充。</div><div class=\"quote\">另外，有些物質必須先與細胞膜上的受體接合，細<br>胞再進行胞吞作用攝入這些物質，稱為受體媒介胞吞作<br>用，例如：肝臟細胞膜上的受體蛋白，可與運輸膽固醇<br>的特定蛋白質進行專一性接合，經由受體媒介胞吞作用<br>將血液中的膽固醇移入肝細胞中。<br>胞吐作用是細胞內形成的囊泡移向細胞膜並與膜融<br>合，將囊泡內的物質釋出細胞，而囊泡的膜則併入細胞<br>膜。細胞的分泌物如酵素或激素等，通常以此方式釋出<br>至細胞外，即分泌作用（圖 1－27b）。<br>胞吐作用<br>b<br>受體媒介胞吞作用<br>受體<br>酵素或激素<br>膽固醇<br>蛋白質<br>囊泡<br>囊泡<br>第 1 章  細胞的構造與功能　41<br><small>課本P41完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">1-3.2 <br>大分子物質進出細胞的方式<br>例<br>如<br> <br>：膽固醇的運輸<br>受體媒<br>介胞吞<br>作用<br>三酸甘油酯<br>膽固醇<br>缺脂蛋白<br>磷脂質<br>脂蛋白<br>→膽固醇被缺脂蛋白包圍，以脂蛋白的形式在血漿中運送<br>補充<small>原PPT第24頁完整抽取原文；補充範圍見教學重點</small></div><div class=\"quote\">1-3.2 <br>大分子物質進出細胞的方式<br>受體媒<br>介胞吞<br>作用<br>缺脂蛋白<br>受體<br>囊泡<br>溶體<br>水解酵素<br>肝細胞<br>膽固醇可以進入內質網中供細胞使用<br>受體則經由內質網、高基氏體、囊泡等再度運送到細胞表面<br>補充<small>原PPT第25頁完整抽取原文；補充範圍見教學重點</small></div>", "tb": [["step_006", "P41完整課本頁"]]}, {"id": "b1-c13-l19", "t": "胞吐：融合釋出與膜併入", "sec": "s4", "slide": 26, "sourceSlides": [26], "sourcePages": [6], "src": "課本P41；PPT 26", "figSpec": {"image": "exocytosis"}, "txt": "<h3>圖像與機制</h3><ul><li>囊泡移至細胞膜並融合，內容物釋出至胞外，囊泡膜成為細胞膜的一部分。</li><li>酵素、胰島素等分泌物可用此方式釋出。</li><li>不是所有激素都靠胞吐；脂溶性類固醇等可用不同方式，本圖限定囊泡分泌。</li></ul><p class=\"thinking\"><strong>想一想</strong> 釋放內容物後，囊泡膜去了哪裡？</p><div class=\"quote\">另外，有些物質必須先與細胞膜上的受體接合，細<br>胞再進行胞吞作用攝入這些物質，稱為受體媒介胞吞作<br>用，例如：肝臟細胞膜上的受體蛋白，可與運輸膽固醇<br>的特定蛋白質進行專一性接合，經由受體媒介胞吞作用<br>將血液中的膽固醇移入肝細胞中。<br>胞吐作用是細胞內形成的囊泡移向細胞膜並與膜融<br>合，將囊泡內的物質釋出細胞，而囊泡的膜則併入細胞<br>膜。細胞的分泌物如酵素或激素等，通常以此方式釋出<br>至細胞外，即分泌作用（圖 1－27b）。<br>胞吐作用<br>b<br>受體媒介胞吞作用<br>受體<br>酵素或激素<br>膽固醇<br>蛋白質<br>囊泡<br>囊泡<br>第 1 章  細胞的構造與功能　41<br><small>課本P41完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">1-3.2 <br>大分子物質進出細胞的方式<br>胞吐作用<br>◆ 過程 ：細胞中的<br>囊泡逐漸外移→<br>囊泡的膜<br>與細胞膜融合→囊泡內<br>的<br>物質釋出細胞<br>◆ 需要耗能<br>◆ 物質 ：酵素、激素等<br>囊泡<br>配合<br>課本 <br>P41<small>原PPT第26頁完整抽取原文；補充範圍見教學重點</small></div>", "tb": [["step_006", "P41完整課本頁"]]}, {"id": "b1-c13-l20", "t": "膜面積：增加與回收的動態平衡", "sec": "s4", "slide": 27, "sourceSlides": [27], "sourcePages": [5, 6], "src": "課本P40、41；PPT 27", "figSpec": {"pair": ["receptor", "exocytosis"]}, "txt": "<h3>圖像與機制</h3><ul><li>胞吐將囊泡膜併入 一想</strong> 哪一種比較需要先確認作者的分類範圍？</p><div class=\"quote\">細<br>胞<br>膜<br>水、離子等<br>脂溶性物質、酒精、水或 O2<br>及CO2 等氣體<br>a簡單擴散<br>b促進性擴散（通道蛋白）<br>被動運輸<br>-3 細胞膜運輸物質的方式<br>1<br>　　細胞膜是細胞的屏障，可以選擇性讓某些物質通過，氣體可經<br>由擴散作用通過細胞膜，以進出動、植物細胞，而蛋白質分子則否。物<br>質能否進出細胞膜以及通過細胞膜的方式，和細胞的種類及該物質的分<br>子大小、結構有關。<br>1-3.1 小分子物質通過細胞膜的運輸<br>細胞膜的結構為脂雙層，內部主要是疏水性的脂肪酸，因此帶有電荷<br>的離子或是具有極性的分子必須藉由細胞膜上的運輸蛋白進出細胞，故細<br>胞膜對物質進出具有選擇性，又稱為選擇性通透膜。<br>小分子物質通過細胞膜的方式有兩種，分別為被動運輸與主動運輸。<br>被動運輸不需消耗能量，是物質由濃度較高處擴散至較低處的過程。不帶<br>電荷及不具極性或極性較小的物質，可以直接通過磷脂層，稱為簡單擴散<br>（圖 1－26a），如脂溶性的物質（如脂肪酸）、酒精、水或 O2 及 CO2 <br>被動運輸　passive transport<br>主動運輸　active transport<br>簡單擴散　simple diffusion<br>36　選修生物 Ⅰ (全)<br><small>課本P36完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">葡萄糖、胺基酸等<br>c促進性擴散（載體蛋白）<br>d主動運輸（載體蛋白）<br>可逆濃度運輸的物質<br>細<br>胞<br>膜<br>主動運輸<br>ADP＋<br>ATP<br>Pi<br> 圖 1－26　<br>     小分子物質通過細胞膜的運輸<br>等氣體。帶電荷或具極性的物質則須經由膜上運輸蛋白進<br>出細胞，稱為促進性擴散（圖 1－26bc），如離子、葡<br>萄糖等。當細胞內外發生溶液的濃度差，水可藉由簡單擴<br>散或促進性擴散通過，此過程為滲透作用。<br>運輸蛋白具專一性，只讓特定物質通過，可分為通道<br>蛋白及載體蛋白。通道蛋白在膜上形成通道，容許水分<br>子、特定離子通過，例如：水通道蛋白與鉀離子通道蛋<br>白（圖 1－26b）；載體蛋白則先與輸送的物質結合，透<br>過構形改變而將物質轉運至膜的另一側，例如：葡萄糖<br>載體蛋白（圖 1－26c）。<br>主動運輸是細胞利用膜上的載體蛋白，以消耗能量的<br>方式運輸物質，此方式不受濃度梯度限制，可以將物質由<br>低濃度處通過細胞膜往高濃度處運輸。主動運輸所需的能<br>量通常來自 ATP，例如：細胞膜上的質子幫浦（圖 1－<br>26d）利用 ATP 釋出的能量將氫離子送出細胞，使細胞<br>內的氫離子濃度遠低於細胞外。<br>阿格里　Peter Agre, 1949∼<br>麥金農　Roderick MacKinnon, 1956∼<br>促進性擴散　facilitated diffusion<br>滲透作用　osmosis<br>通道蛋白　channel protein<br>載體蛋白　carrier protein<br>質子幫浦　proton pump<br>第 1 章  細胞的構造與功能　37<br>水通道蛋白<br>水通道蛋白是水分子的<br>通道蛋白，可使水分子快速<br>進出細胞，以維持細胞內、<br>外滲透度的平衡。美國科學<br>家阿格里因研究細胞膜上的<br>水通道蛋白，於 2003 年與<br>研究鉀離子通道的麥金農共<br>同獲得諾貝爾化學獎。<br>知識補給站<br><small>課本P37完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">1-3.2 大分子物質進出細胞的方式<br>細胞可經由胞吞作用將大分子物質帶進細胞，也可<br>經由胞吐作用將物質釋出細胞，兩者都需要消耗能量。<br>胞吞作用又可分為吞噬作用、胞飲作用及受體媒介<br>胞吞作用（圖 1－27a）。吞噬作用是細胞膜向外伸展<br>成偽足，將細胞外較大的固體顆粒包住，進入細胞後形<br>成食泡；胞飲作用是藉由細胞膜的內陷，將細胞外的可<br>溶性物質隨著液體包在囊泡內送進細胞。<br>胞吞作用　endocytosis<br>胞吐作用　exocytosis<br>胞飲作用　pinocytosis<br>受體媒介胞吞作用　receptor-mediated endocytosis<br> 圖 1－27　大分子物質 v class=\"quote\">知識補給站<br>等<br>張<br>溶<br>液<br>紅血球<br>紫背萬年青葉片表皮細胞<br>a<br>b<br>c<br>d<br>e<br>f<br>高<br>張<br>溶<br>液<br>低<br>張<br>溶<br>液<br>10 mm<br>20 mm<br>20 mm<br>20 mm<br>10 mm<br>10 mm<br>等張溶液、高張溶液與低張溶液<br>大部分的細胞膜允許水分子自由進出細胞，但會限制其他物質的進出，因此細胞內、外的溶質濃度<br>差異會決定水的移動方向。例如：將人類紅血球置於生理食鹽水（如0.9％ NaCl 溶液）中，細胞可維<br>持原來的形狀（圖a），此生理食鹽水是紅血球的等張溶液；若將紅血球置於高濃度的食鹽水（如2％ <br>NaCl 溶液）中，離開細胞的水多於進入細胞的水，造成細胞萎縮（圖b），此高濃度食鹽水為紅血球的<br>高張溶液；若將紅血球置於低濃度的食鹽水（如0.2％ NaCl 溶液）中，進入細胞的水多於離開細胞的<br>水，造成細胞膨脹（圖c），最後可能破裂，此低濃度的食鹽水為紅血球的低張溶液。<br>等張溶液　isotonic solution<br>高張溶液　hypertonic solution<br>低張溶液　hypotonic solution<br>38　選修生物 Ⅰ (全)<br><small>課本P38完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">細胞質<br>細胞壁<br>細胞質<br>細胞核<br>液泡<br>液泡<br>細胞壁<br>細胞膜<br>土壤水分多寡影響植物葉片的變化<br>g<br>h<br>同樣地，將植物細胞置於等張溶液中，細胞會維持原來的形狀（圖d）；若置於高張溶液中，細胞<br>質會喪失水分而造成質離現象（圖e）；但若置於低張溶液中，因有細胞壁保護，細胞會膨脹但不會破<br>裂（圖f），此時細胞膜緊貼細胞壁造成壓力稱為膨壓。<br>膨壓使草本植物在水分充足時能夠挺立，因為土壤中的水分會藉由滲透方式進入植物體，產生足夠<br>的膨壓來維持細胞壁的張力，因此植物體可維持堅挺的外觀（圖g）。但若在乾旱的情況下，土壤中的<br>水分極為缺乏，植物無法經由滲透作用自土壤中得到水分，使液泡中的水分漸漸變少，使得細胞的膨壓<br>降低，細胞壁無法產生足夠張力，植物體也因此失去支撐而凋萎（圖h）。<br>膨壓　turgor pressure<br>  紅血球與紫背萬年青葉片表皮細胞在等張、高<br>張與低張溶液中，水分子移動所造成的結果，<br>以及土壤水分多寡影響植物葉片的變化。<br>細胞膨壓充足時的<br>植株<br>細胞膨壓不足時的<br>植株<br>植物細胞發生質離現象<br>第 1 章  細胞的構造與功能　39<br><small>課本P39完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">1-3.2 大分子物質進出細胞的方式<br>細胞可經由胞吞作用將大分子物質帶進細胞，也可<br>經由胞吐作用將物質釋出細胞，兩者都需要消耗能量。<br>胞吞作用又可分為吞噬作用、胞飲作用及受體媒介<br>胞吞作用（圖 1－27a）。吞噬作用是細胞膜向外伸展<br>成偽足，將細胞外較大的固體顆粒包住，進入細胞後形<br>成食泡；胞飲作用是藉由細胞膜的內陷，將細胞外的可<br>溶性物質隨著液體包在囊泡內送進細胞。<br>胞吞作用　endocytosis<br>胞吐作用　exocytosis<br>胞飲作用　pinocytosis<br>受體媒介胞吞作用　receptor-mediated endocytosis<br> 圖 1－27　大分子物質進出細胞的方式。a胞吞作用；b胞吐作用。<br>吞噬作用<br>胞飲作用<br>胞吞作用<br>a<br>偽足<br>固體顆粒<br>可溶性物質<br>細胞膜<br>細胞外液<br>細胞質液<br>食泡<br>囊泡<br>40　選修生物 Ⅰ (全)<br>細胞經胞吐作用將分泌<br>物運送到細胞外，內膜系統<br>的膜最後經囊泡成為細胞膜<br>的一部分，細胞膜的面積因<br>此會增大。但是生物體的細<br>胞大多會維持適當的大小，<br>不會持續增大，可見細胞另<br>有一套機制，可以回收多餘<br>的細胞膜，請問細胞如何處<br>理這些多出來的細胞膜？<br>腦力激盪<br><small>課本P40完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">另外，有些物質必須先與細胞膜上的受體接合，細<br>胞再進行胞吞作用攝入這些物質，稱為受體媒介胞吞作<br>用，例如：肝臟細胞膜上的受體蛋白，可與運輸膽固醇<br>的特定蛋白質進行專一性接合，經由受體媒介胞吞作用<br>將血液中的膽固醇移入肝細胞中。<br>胞吐作用是細胞內形成的囊泡移向細胞膜並與膜融<br>合，將囊泡內的物質釋出細胞，而囊泡的膜則併入細胞<br>膜。細胞的分泌物如酵素或激素等，通常以此方式釋出<br>至細胞外，即分泌作用（圖 1－27b）。<br>胞吐作用<br>b<br>受體媒介胞吞作用<br>受體<br>酵素或激素<br>膽固醇<br>蛋白質<br>囊泡<br>囊泡<br>第 1 章  細胞的構造與功能　41<br><small>課本P41完整抽取原文；尺度以原圖為準</small></div><div class=\"quote\">1-3 <br>細胞膜運輸物質的方式<br>1-3.1 <br>小分子物質通過細胞膜的運輸<br>1-3.2 <br>大分子物質進出細胞的方式<br>ATP<br>ADP + Pi<small>原PPT第1頁完整抽取原文；補充範圍見教學重點</small></div><div class=\"quote\">物質通過細胞膜的運輸<br>簡單擴散<br>促進性擴散<br>大分子物質<br>小分子物質<br>被動運輸<br>(<br>擴散作用<br>)<br>主動運輸<br>1-3 <br>細胞膜運輸物質的方式<br>胞吐作用<br>胞吞作用<br>吞噬作用<br>胞飲作用<br>受體媒介胞吞作用<br>物質通過細胞膜的方式<br>補充<small>原PPT第3頁完整抽取原文；補充範圍見教學重點</small></div><div class=\"quote\">物質通過細胞膜的運輸<br>簡單擴散<br>促進性擴散<br>小分子物質<br>大分子物質<br>被動運輸<br>(<br>擴散作用<br>)<br>主動運輸<br>胞吐作用<br>胞吞作用<br>吞噬作用<br>胞飲作用<br>受體媒介胞吞作用<br>1-3.1 <br>小分子物質通過細胞膜的運輸<br>補充<small>原PPT第4頁完整抽取原文；補充範圍見教學重點</small></div><div class=\"quote\">物質通過細胞膜的運輸<br>簡單擴散<br>促進性擴散<br>小分子物質<br>大分子物質<br>被動運輸<br>(<br>擴散作用<br>)<br>主動運輸<br>1-3 <br>細胞膜運輸物質的方式<br>胞吐作用<br>胞吞作用<br>吞噬作用<br>胞飲作用<br>受體媒介胞吞作用<br>補充<small>原PPT第19頁完整抽取原文；補充範圍見教學重點</small></div><div class=\"quote\">1-3.2 <br>大分子物質進出細胞的方式<br>物質通過細胞膜的運輸<br>簡單擴散<br>促進性擴散<br>小分子物質<br>大分子物質<br>被動運輸<br>(<br>擴散作用<br>)<br>主動運輸<br>胞吞作用<br>胞吐作用<br>吞噬作用<br>胞飲作用<br>受體媒介胞吞作用<br>補充<br>胞吞作用與胞吐作用<small>原PPT第20頁完整抽取原文；補充範圍見教學重點</small></div>", "tb": [["step_001", "P36完整課本頁"], ["step_002", "P37完整課本頁"], ["step_003", "P38完整課本頁"], ["step_004", "P39完整課本頁"], ["step_005", "P40完整課本頁"], ["step_006", "P41完整課本頁"]]}], "questions": [{"t": "小分子運輸分類盤", "q": "將6張卡放回三種運輸方式。", "learn": 7, "tag": "diffusion", "hint": "看路徑、梯度與能量，不只看名稱。", "why": "限定教材中的路徑例子；葡萄糖在不同膜面也可採其他機制。", "sub": "課本P36、37；PPT 3、4、13、14", "refs": [{"src": "ppt_014", "cap": "教材來源圖"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "g0s0", "label": "簡單擴散", "group": 0}, {"id": "g0s1", "label": "簡單擴散", "group": 0}, {"id": "g1s0", "label": "促進性擴散", "group": 1}, {"id": "g1s1", "label": "促進性擴散", "group": 1}, {"id": "g2s0", "label": "主動運輸", "group": 2}, {"id": "g2s1", "label": "主動運輸", "group": 2}], "pieces": [{"id": "ag0s0", "label": "O₂與CO₂直接穿膜", "group": 0}, {"id": "ag0s1", "label": "乙醇可直接穿脂雙層", "group": 0}, {"id": "ag1s0", "label": "葡萄糖載體順梯度運送", "group": 1}, {"id": "ag1s1", "label": "水經水通道進出", "group": 1}, {"id": "ag2s0", "label": "質子幫浦逆梯度運送", "group": 2}, {"id": "ag2s1", "label": "質子幫浦由ATP供能", "group": 2}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g1s0": "ag1s0", "g1s1": "ag1s1", "g2s0": "ag2s0", "g2s1": "ag2s1"}, "pre": {}, "id": "b1-c13-q01"}, {"t": "擴散特徵大考驗", "q": "物質進出細胞必須通過含有脂肪酸的細胞膜，下列關於物質跨膜運輸的敘述，何者正確？", "learn": 4, "tag": "protein", "hint": "對照右側圖 1-26：酒精為脂溶性；蛋白質構形改變的是哪種？吞噬作用專門運送大分子固體。", "why": "A錯：乙醇具脂溶性，以簡單擴散直接穿膜；C錯：吞噬作用吞入大固體顆粒，不具化學受體的專一性；D錯：主動運輸是逆濃度累積物質，不會達到內外等濃度平衡。B正確：載體蛋白運送葡萄糖時會改變立體構形。 本題比較教材典型模型；吞噬辨識也可能涉及受體，不宜推論所有吞噬皆無專一性。", "sub": "原網頁延伸題2；課本P36、37；PPT 8、13、14", "refs": [{"src": "transport_ab", "cap": "教材來源圖"}], "legacyQuestion": 2, "kind": "single", "opts": [{"t": "乙醇為水溶性小分子，必須藉由通道蛋白才能快速進出細胞", "ok": false, "tag": "protein"}, {"t": "葡萄糖藉由載體蛋白進行促進性擴散，運送時載體蛋白會改變構形", "ok": true, "tag": "protein"}, {"t": "主動運輸與吞噬作用皆需消耗能量，且兩者皆具高度專一性", "ok": false, "tag": "protein"}, {"t": "被動運輸與主動運輸的受質分子，最終在細胞內外必達到等濃度平衡", "ok": false, "tag": "protein"}], "fig": "transport_ab", "figCaption": "教材原圖（完整標示）", "id": "b1-c13-q02"}, {"t": "植物滲透型態判讀", "q": "進行植物細胞滲透實驗時，將紫背萬年青葉片細胞置於不同濃度蔗糖溶液中，下列相關分析哪些正確？", "learn": 10, "tag": "osmosis", "hint": "對照上方三張植物細胞照片：注意質離現象的定義、細胞壁的作用、以及膨壓對草本植物的意義。", "why": "B錯：植物細胞外有堅韌細胞壁保護，產生膨壓抗衡水分進入，不會破裂；E錯：細胞壁為全透性，細胞膜皺縮後，細胞壁與細胞膜之間充滿的是外側的高張蔗糖溶液。A、C、D皆正確。", "sub": "原網頁延伸題3；課本P38、39；PPT 17", "refs": [{"src": "osmosis_plant", "cap": "教材來源圖"}], "legacyQuestion": 3, "kind": "multi", "opts": [{"t": "置於高張溶液時，液泡失水縮小，發生細胞膜與細胞壁分離的「質離現象」", "ok": true, "tag": "osmosis"}, {"t": "置於低張溶液時，植物細胞大量吸水膨脹，最終會像紅血球一樣破裂", "ok": false, "tag": "osmosis"}, {"t": "當細胞處於質離狀態時，細胞膨壓降為零", "ok": true, "tag": "osmosis"}, {"t": "草本植物在乾旱環境中萎蔫凋萎，主因是細胞缺乏充足膨壓的支撐", "ok": true, "tag": "osmosis"}, {"t": "高張溶液中的植物細胞，其原生質體與細胞壁之間的空隙充滿了純水", "ok": false, "tag": "osmosis"}], "id": "b1-c13-q03", "figRow": [["op_d", "(d)"], ["op_e", "(e)"], ["op_f", "(f)"]], "figRowCaption": "課本P38 紫背萬年青葉片表皮細胞在三種蔗糖溶液中 · 點圖放大"}, {"t": "主動與被動：條件配對", "q": "將6項特徵放進對應欄位。", "learn": 6, "tag": "active", "hint": "本章幫浦直接耗ATP；延伸還有梯度供能。", "why": "被動的「不耗能」指不需細胞提供代謝能，不代表分子沒有動能。", "sub": "課本P37；PPT 11、12", "refs": [{"src": "transport_cd", "cap": "教材來源圖"}], "legacyQuestion": 4, "kind": "drag", "slots": [{"id": "g0s0", "label": "被動運輸", "group": 0}, {"id": "g0s1", "label": "被動運輸", "group": 0}, {"id": "g0s2", "label": "被動運輸", "group": 0}, {"id": "g1s0", "label": "主動運輸", "group": 1}, {"id": "g1s1", "label": "主動運輸", "group": 1}, {"id": "g1s2", "label": "主動運輸", "group": 1}], "pieces": [{"id": "ag0s0", "label": "順有效梯度淨移動", "group": 0}, {"id": "ag0s1", "label": "不需細胞直接供ATP", "group": 0}, {"id": "ag0s2", "label": "動力來自分子熱運動", "group": 0}, {"id": "ag1s0", "label": "可逆有效梯度累積", "group": 1}, {"id": "ag1s1", "label": "需要能量來源", "group": 1}, {"id": "ag1s2", "label": "依賴專屬運輸蛋白", "group": 1}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g0s2": "ag0s2", "g1s0": "ag1s0", "g1s1": "ag1s1", "g1s2": "ag1s2"}, "pre": {}, "id": "b1-c13-q04"}, {"t": "大分子運輸辨析", "q": "關於大分子物質進出細胞的運輸方式，下列哪些敘述正確？", "learn": 13, "tag": "vesicle", "hint": "大分子運輸都需要消耗能量嗎？偽足是哪種作用特有？受體媒介胞吞有什麼專一性？", "why": "C錯：胞飲作用是細胞膜內陷吸入液體，不具受體專一性；E錯：大分子物質（蛋白質、多醣）無法通過通道蛋白，必須以囊泡包裹的胞吞或胞吐作用運輸。A、B、D皆正確。", "sub": "原網頁延伸題5；課本P40、41；PPT 19、20", "refs": [{"src": "endocytosis", "cap": "教材來源圖"}], "legacyQuestion": 5, "kind": "multi", "opts": [{"t": "胞吞作用與胞吐作用皆涉及細胞膜的形變與融合，兩者都需要消耗 ATP", "ok": true, "tag": "vesicle"}, {"t": "變形蟲攝食與人體白血球吞噬細菌，皆屬於伸出偽足的吞噬作用", "ok": true, "tag": "vesicle"}, {"t": "胞飲作用與受體媒介胞吞作用都會形成囊泡進入細胞，兩者皆具高度專一性", "ok": false, "tag": "vesicle"}, {"t": "肝細胞攝入血液中的膽固醇（LDL），主要藉由專屬受體媒介胞吞作用完成", "ok": true, "tag": "vesicle"}, {"t": "大分子物質進出細胞時，可藉由貫穿膜的通道蛋白快速通過", "ok": false, "tag": "vesicle"}], "fig": "endocytosis", "figCaption": "教材原圖（完整標示）", "id": "b1-c13-q05"}, {"t": "胞吐分泌與膜面積平衡", "q": "胰島細胞持續進行胞吐作用分泌胰島素，但其細胞膜表面積並未無限增大，主要原因為何？", "learn": 19, "tag": "membrane", "hint": "想一想：胞吐作用使膜面積增加，細胞靠什麼機制回收多餘的膜？", "why": "胞吐作用使囊泡膜併入細胞膜而擴大面積；細胞同時透過胞吞作用（特別是胞飲）將膜向內凹陷剪切成囊泡回收，使細胞膜面積保持動態恆定。", "sub": "原網頁延伸題6；課本P40、41；PPT 27", "refs": [{"src": "exocytosis", "cap": "教材來源圖"}], "legacyQuestion": 6, "kind": "single", "opts": [{"t": "多餘的細胞膜會被細胞外液中的水解酵素自然分解", "ok": false, "tag": "membrane"}, {"t": "細胞膜會同時進行胞吞作用，將多餘的膜向內回收形成囊泡", "ok": true, "tag": "membrane"}, {"t": "囊泡與細胞膜融合後，囊泡膜會立即自動縮回高基氏體", "ok": false, "tag": "membrane"}, {"t": "細胞分泌後細胞膜會發生溶解，再由細胞核重新合成新膜", "ok": false, "tag": "membrane"}], "fig": "exocytosis", "figCaption": "教材原圖（完整標示）", "id": "b1-c13-q06"}, {"t": "紅血球：溶液與外觀配對", "q": "將水流與型態配對至課本三種NaCl濃度。", "learn": 9, "tag": "osmosis", "hint": "濃度例子限定本教材紅血球條件。", "why": "等張不表示水停止移動；紅血球無細胞壁，不稱質離。", "sub": "課本P38；PPT 16", "refs": [{"src": "rbc_iso", "cap": "教材來源圖"}], "legacyQuestion": 7, "kind": "drag", "slots": [{"id": "g0s0", "label": "0.9%等張", "group": 0}, {"id": "g0s1", "label": "0.9%等張", "group": 0}, {"id": "g1s0", "label": "2%高張", "group": 1}, {"id": "g1s1", "label": "2%高張", "group": 1}, {"id": "g2s0", "label": "0.2%低張", "group": 2}, {"id": "g2s1", "label": "0.2%低張", "group": 2}], "pieces": [{"id": "ag0s0", "label": "維持正常雙凹圓盤狀", "group": 0}, {"id": "ag0s1", "label": "水進出量動態平衡", "group": 0}, {"id": "ag1s0", "label": "紅血球皺縮", "group": 1}, {"id": "ag1s1", "label": "淨失水", "group": 1}, {"id": "ag2s0", "label": "膨脹且可能溶血", "group": 2}, {"id": "ag2s1", "label": "淨吸水", "group": 2}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g1s0": "ag1s0", "g1s1": "ag1s1", "g2s0": "ag2s0", "g2s1": "ag2s1"}, "pre": {}, "id": "b1-c13-q07"}, {"t": "物質運輸全方位評量", "q": "下列關於細胞膜運輸物質方式的整合比較，哪些敘述完全正確？", "learn": 21, "tag": "integration", "hint": "全面檢視：水通道蛋白、受體媒介胞吞、滲透平衡與能量代謝關係。", "why": "D錯：促進性擴散仰賴專屬膜蛋白，具高度專一性與運載飽和性；E錯：膽固醇是藉由受體媒介胞吞作用攝入，患者主因是 LDL 受體缺陷，而非缺乏主動運輸幫浦。A、B、C皆正確。 本題採教材受體缺陷模型；相關疾病可能涉及不同基因與路徑。 本題「唯一」限定本章小分子跨膜運輸分類；次級主動運輸仍屬主動運輸。", "sub": "原網頁延伸題8；課本P36、37、38、39、40、41；PPT 1、3、4、19、20", "refs": [{"src": "transport_cd", "cap": "教材來源圖"}], "legacyQuestion": 8, "kind": "multi", "opts": [{"t": "水分子可藉簡單擴散緩慢穿膜，亦可藉水通道蛋白進行高速促進性擴散", "ok": true, "tag": "integration"}, {"t": "主動運輸是唯一能夠將溶質逆著濃度梯度運送的跨膜運輸方式", "ok": true, "tag": "integration"}, {"t": "神經細胞釋放神經傳導物質與胰臟分泌胰島素，皆屬於胞吐作用", "ok": true, "tag": "integration"}, {"t": "簡單擴散與促進性擴散皆不需消耗能量，兩者皆不具備專一性與運載飽和性", "ok": false, "tag": "integration"}, {"t": "家族性高膽固醇血症患者主因是細胞缺乏載體幫浦，導致膽固醇無法主動運輸", "ok": false, "tag": "integration"}], "fig": "transport_cd", "figCaption": "教材原圖（完整標示）", "id": "b1-c13-q08"}, {"kind": "drag", "labelFig": "lf_126", "lfStack": true, "slots": [{"id": "h_passive", "label": "", "group": 0, "x": 7.82, "y": 10.56, "w": 7.5, "h": 10.78}, {"id": "h_active", "label": "", "group": 1, "x": 83.06, "y": 10.56, "w": 7.5, "h": 10.78}, {"id": "simple", "label": "", "group": 2, "x": 10.62, "y": 93.97, "w": 6.6, "h": 6.9}, {"id": "channel", "label": "", "group": 3, "x": 34.88, "y": 93.97, "w": 14.1, "h": 6.9}, {"id": "carrier", "label": "", "group": 4, "x": 63.04, "y": 93.97, "w": 13.91, "h": 6.9}, {"id": "pump", "label": "", "group": 5, "x": 88.98, "y": 93.97, "w": 13.01, "h": 6.9}], "pieces": [{"id": "p1", "label": "被動運輸", "group": 0}, {"id": "p2", "label": "主動運輸", "group": 1}, {"id": "p3", "label": "簡單擴散", "group": 2}, {"id": "p4", "label": "促進性擴散（通道蛋白）", "group": 3}, {"id": "p5", "label": "促進性擴散（載體蛋白）", "group": 4}, {"id": "p6", "label": "主動運輸（載體蛋白）", "group": 5}, {"id": "x0", "label": "胞飲作用", "group": 90}, {"id": "x1", "label": "受體媒介胞吞作用", "group": 91}], "sol": {"h_passive": "p1", "h_active": "p2", "simple": "p3", "channel": "p4", "carrier": "p5", "pump": "p6"}, "pre": {}, "refs": [{"src": "lf_126", "cap": "課本原圖（標籤已遮住）"}], "id": "b1-c13-q09-fig", "t": "課本圖1-26：小分子怎樣通過細胞膜", "q": "把名稱卡放回課本圖1-26被遮住的6個標籤。", "learn": 7, "tag": "protein", "sub": "課本P36–37 圖1-26", "hint": "先看有沒有膜蛋白，再看箭頭方向（順或逆濃度梯度）與是否需要ATP。通道蛋白像一條通道；載體蛋白會與物質結合並改變形狀。", "why": "(a)脂溶性物質與O₂、CO₂等直接穿過脂雙層，是簡單擴散；(b)水、離子經通道蛋白、(c)葡萄糖、胺基酸等與載體蛋白結合後送過膜，都是促進性擴散。三者皆順濃度梯度、不耗能，屬被動運輸；(d)載體蛋白利用ATP逆濃度梯度運輸物質，屬主動運輸。"}, {"kind": "drag", "labelFig": "lf_p38", "lfStack": false, "slots": [{"id": "iso", "label": "", "group": 0, "x": 8.53, "y": 20.22, "w": 5.26, "h": 15.28, "vertical": true}, {"id": "hyper", "label": "", "group": 1, "x": 8.53, "y": 51.46, "w": 5.26, "h": 15.73, "vertical": true}, {"id": "hypo", "label": "", "group": 2, "x": 8.53, "y": 82.25, "w": 5.26, "h": 15.73, "vertical": true}], "pieces": [{"id": "p1", "label": "等張溶液", "group": 0}, {"id": "p2", "label": "高張溶液", "group": 1}, {"id": "p3", "label": "低張溶液", "group": 2}, {"id": "x0", "label": "中性溶液", "group": 90}, {"id": "x1", "label": "飽和溶液", "group": 91}], "sol": {"iso": "p1", "hyper": "p2", "hypo": "p3"}, "pre": {}, "refs": [{"src": "lf_p38", "cap": "課本原圖（標籤已遮住）"}], "id": "b1-c13-q10-fig", "t": "課本P38滲透實驗：三種溶液", "q": "依紅血球與紫背萬年青葉表皮細胞的型態，把溶液名稱放回表格左側被遮住的三格。", "learn": 9, "tag": "osmosis", "sub": "課本P38 知識補給站", "hint": "紅血球皺縮代表淨失水；植物細胞的原生質體縮小、與細胞壁分開（質離）也代表外液濃度較高。", "why": "(a)(d)維持原來形狀→等張溶液；(b)紅血球萎縮、(e)發生質離→高張溶液；(c)紅血球膨脹、最後可能破裂，(f)植物細胞有細胞壁保護不會破裂→低張溶液。「中性」描述酸鹼，「飽和」描述溶解度，都不是對細胞的張力。"}, {"kind": "drag", "labelFig": "lf_127", "lfStack": true, "slots": [{"id": "endo", "label": "", "group": 0, "x": 25.12, "y": 3.72, "w": 7.63, "h": 5.79}, {"id": "exo", "label": "", "group": 1, "x": 87.35, "y": 3.72, "w": 7.54, "h": 5.79}, {"id": "phago", "label": "", "group": 2, "x": 15.35, "y": 10.88, "w": 5.68, "h": 5.79}, {"id": "pino", "label": "", "group": 3, "x": 37.72, "y": 10.88, "w": 5.68, "h": 5.79}, {"id": "rme", "label": "", "group": 4, "x": 63.79, "y": 10.88, "w": 10.65, "h": 5.79}, {"id": "pseudo", "label": "", "group": 5, "x": 9.94, "y": 74.38, "w": 2.49, "h": 4.41}, {"id": "foodvac", "label": "", "group": 6, "x": 23.52, "y": 88.71, "w": 2.49, "h": 4.41}, {"id": "receptor", "label": "", "group": 7, "x": 56.25, "y": 25.9, "w": 2.49, "h": 4.41}], "pieces": [{"id": "p1", "label": "胞吞作用", "group": 0}, {"id": "p2", "label": "胞吐作用", "group": 1}, {"id": "p3", "label": "吞噬作用", "group": 2}, {"id": "p4", "label": "胞飲作用", "group": 3}, {"id": "p5", "label": "受體媒介胞吞作用", "group": 4}, {"id": "p6", "label": "偽足", "group": 5}, {"id": "p7", "label": "食泡", "group": 6}, {"id": "p8", "label": "受體", "group": 7}, {"id": "x0", "label": "載體蛋白", "group": 90}, {"id": "x1", "label": "溶體", "group": 91}], "sol": {"endo": "p1", "exo": "p2", "phago": "p3", "pino": "p4", "rme": "p5", "pseudo": "p6", "foodvac": "p7", "receptor": "p8"}, "pre": {}, "refs": [{"src": "lf_127", "cap": "課本原圖（標籤已遮住）"}], "id": "b1-c13-q11-fig", "t": "課本圖1-27：大分子進出細胞", "q": "把名稱卡放回課本圖1-27被遮住的8個標籤。", "learn": 13, "tag": "vesicle", "sub": "課本P40–41 圖1-27", "hint": "先分方向：物質進入細胞是胞吞，送出細胞是胞吐。再看胞吞包進的是固體顆粒、含可溶性物質的液體，或是先與膜上受體結合的物質。", "why": "(a)胞吞作用：吞噬作用以偽足包圍固體顆粒形成食泡；胞飲作用由細胞膜內凹把含可溶性物質的液體包入囊泡；受體媒介胞吞作用中物質（如含膽固醇的脂蛋白）先與受體結合再內陷。(b)胞吐作用：囊泡與細胞膜融合，把酵素或激素釋出細胞外。"}, {"t": "濃度相同：分子停止了嗎", "q": "兩側水交換速率相同，最適當的說法為何？", "learn": 1, "tag": "gradient", "hint": "分清總流量與淨流量。", "why": "平衡指宏觀淨變化為零，不代表熱運動消失。", "sub": "課本P36；PPT 6", "refs": [{"src": "transport_ab", "cap": "教材來源圖"}], "kind": "single", "opts": [{"t": "仍有雙向移動，淨流量為零", "ok": true, "tag": "gradient"}, {"t": "每個水分子完全停止", "ok": false, "tag": "gradient"}, {"t": "膜已必定失去通透性", "ok": false, "tag": "gradient"}, {"t": "必定啟動主動運輸", "ok": false, "tag": "gradient"}], "id": "b1-c13-q12"}, {"t": "離子方向：只看濃度夠嗎", "q": "離子兩側濃度已知，但膜電位未知，能否僅此預測淨流向？", "learn": 2, "tag": "gradient", "hint": "離子帶電，水分子不帶淨電荷。", "why": "離子受濃度與電場共同影響。", "sub": "課本P36、37；PPT 7", "refs": [{"src": "transport_ab", "cap": "教材來源圖"}], "kind": "single", "opts": [{"t": "仍需考慮電位差及通道狀態", "ok": true, "tag": "gradient"}, {"t": "可以，離子只看濃度", "ok": false, "tag": "gradient"}, {"t": "只要有蛋白就逆梯度", "ok": false, "tag": "gradient"}, {"t": "帶電粒子都無法移動", "ok": false, "tag": "gradient"}], "id": "b1-c13-q13"}, {"t": "抑制ATP：結果與時間尺度", "q": "短時間抑制ATP生成，哪項預測較合理？", "learn": 6, "tag": "active", "hint": "分開直接供能與間接維持梯度。", "why": "需考慮ATP餘量、既有梯度、時間與細胞狀態，避免「立即全部停止」。", "sub": "課本P37；PPT 11、12", "refs": [{"src": "transport_cd", "cap": "教材來源圖"}], "ki 運輸\n受體媒\n介胞吞\n作用\n三酸甘油酯\n膽固醇\n缺脂蛋白\n磷脂質\n脂蛋白\n→膽固醇被缺脂蛋白包圍，以脂蛋白的形式在血漿中運送\n補充", "25": "1-3.2 \n大分子物質進出細胞的方式\n受體媒\n介胞吞\n作用\n缺脂蛋白\n受體\n囊泡\n溶體\n水解酵素\n肝細胞\n膽固醇可以進入內質網中供細胞使用\n受體則經由內質網、高基氏體、囊泡等再度運送到細胞表面\n補充", "26": "1-3.2 \n大分子物質進出細胞的方式\n胞吐作用\n◆ 過程 ：細胞中的\n囊泡逐漸外移→\n囊泡的膜\n與細胞膜融合→囊泡內\n的\n物質釋出細胞\n◆ 需要耗能\n◆ 物質 ：酵素、激素等\n囊泡\n配合\n課本 \nP41", "27": "  \n腦力激盪\n　　細胞\n經胞吐作用將分泌物運送到細胞外，內膜系統的膜最後經囊泡成為細胞膜的一部分，細胞膜的面積因此會增大。但是生物體的細胞大多會維持適當的大小，不會持續增大，可見細胞另有一套機制，可以回收多餘的細胞膜，請問細胞如何處理這些多出來的細胞膜？\n答 ：胞吞作用可以回收細胞膜進入細胞中，尤其是其中的胞飲作用，分泌愈旺盛的細胞，胞飲作用愈\n明顯\n配合\n課本 \nP40", "28": "  \nQuestion\n1. \n物質進出細胞必須通過含有脂肪酸的細胞膜\n，\n右\n圖\n為各種物質進出細胞的方式，下列敘述何者正確？\n(A)\n乙醇可用 \nd\n 的方式進出\n細胞　\n(\nB)\n \nb\n、\nc\n 與 \nd\n 的運輸方式都具有專一性 \n　\n(\nC)\n \nd\n、\ne\n 都屬於耗能的主動運輸，差別在 \ne\n 無專一\n性　\n(\nD)\n所有運輸方式都會導致分子分布均勻。", "29": "  \nQuestion\n解析 \n:\n \n(A)\n乙醇為脂溶性分子，以 \na \n簡單擴散即可進出細胞。\n(C) d \n為主動運輸，耗能將小分子往特定方向運送；\ne \n為吞噬作用，可將大分子吞入細胞\n。\n\n(\nD) d \n為主動運輸，可逆濃度梯度運送分子，而 \ne \n為吞噬作用，為大分子進入細胞的方式之一。以耗能方式運輸的方向為配合細胞生理需求，不一定會使分子分布均勻。\n解答 \n:\n \n(B)", "30": "  \nQuestion\n2. \n小林在學校進行植物細胞的滲透度實驗，圖\n(\n一\n)\n是老師提供的資料，表達細胞在不同體積的兩種壓力：滲透度是細胞內外溶質濃度不同，水分進出細胞產生的壓力；而膨壓則是植物細胞之細胞膜對細胞壁產生的壓力。小林將植物細胞放在不同環境中，觀察其形狀變化並繪圖記錄如圖\n(\n二\n)\n，但小林沒有記錄這些狀態下的濃度，請就圖\n(\n一\n)\n、圖\n(\n二\n)\n判斷下列敘述哪些正確\n?", "31": "  \nQuestion\n(A\n) ABCD \n是細胞的膨\n壓　\n(\nB\n) FED \n是細胞的滲透\n度　\n(\nC)\n圖\n(\n二\n)\n中乙狀態的細胞維持平衡，應是圖\n(\n一\n)\n中 \nD \n點的\n狀態　\n(\nD)\n圖\n(\n二\n)\n丙的狀態稱為質離現象，此時沒有膨\n壓　\n(\nE)\n圖\n(\n二\n)\n甲的狀態下，細胞不會脹破是因為具有細胞壁。", "32": "  \nQuestion\n解析 \n:\n \n(A) ABCD \n為滲透度，隨水分流入細胞而下降。 \n(B) FED \n為膨壓，隨水分累積而上升。\n(C\n)\n題\n圖\n(\n二\n)\n乙為細胞的生理平衡狀態，應\n為\n題\n圖\n(\n一\n) B\n \nF \n的狀態。\n解答 \n:\n \n(D)(E)", "33": "  \nQuestion\n3. \n下列有關大分子進出細胞的方式，何者正確\n？ \n(\nA)\n大分子進入細胞時，細胞必定會伸出\n偽足　\n(\nB)\n屬於主動運輸的\n一種　\n(\nC)\n皆會形成囊\n泡　\n(\nD)\n過程無專一性。\n解析 \n:\n \n(A)\n僅吞噬作用會伸出偽足，胞飲作用、受體媒介胞吞作用皆藉由細胞膜凹陷形成囊泡。\n(B)\n主動運輸為小分子利用細胞膜上之載體蛋白，以消耗能量的方式通過細胞\n膜。\n(\nD)\n受體媒介胞吞作用具有專一性。\n解答 \n:\n \n(C)"}, "sourceCorrections": [{"ppt": [5, 6, 7, 8, 12, 14], "note": "濃度箭頭為入門模型；離子需考慮電化學梯度，水與甘油有極性，主動運輸不全直接水解ATP。"}, {"ppt": [15, 16, 17, 18, 30, 31, 32], "note": "滲透判讀須確認膜對溶質通透性與壓力；µm尺度以原圖為準，原題「滲透度」用語保留。"}, {"ppt": [24, 25], "note": "原文「缺脂蛋白」應理解為載脂蛋白；LDL受體可經內體回收至表面，不必每次經ER與高基氏體。"}, {"ppt": [21, 22, 23, 26, 33], "note": "依本章分類，囊泡運輸與小分子載體主動運輸分列；不概括全部激素都經胞吐。"}], "originalPPTQuestions": {"28": {"answer": [1]}, "30": {"answer": [3, 4]}, "33": {"answer": [2]}}};

el('hint-toggle').setAttribute('aria-haspopup','dialog');el('hint-toggle').onclick=()=>{el('hint-toggle').setAttribute('aria-expanded','true');const d=openDialog('思考提示',`<p>${esc(STAGES[QI].hint)}</p>`);d.addEventListener('close',()=>el('hint-toggle').setAttribute('aria-expanded','false'),{once:true});};el('reference-btn').onclick=()=>openReferences(STAGES[QI]);el('question-learn').onclick=()=>{returnQuestion=true;navigate('learn',STAGES[QI].learn)};el('q-jump').onchange=e=>showQuestion(+e.target.value);el('prev-btn').onclick=()=>QI>0&&showQuestion(QI-1);el('skip-btn').onclick=()=>QI<STAGES.length-1?showQuestion(QI+1):navigate('done');el('check-btn').onclick=check;el('reset-btn').onclick=resetQuestion;el('finish-btn').onclick=()=>navigate('done');
el('shsel').innerHTML=[...new Set(DECK.map(d=>d[1]))].map(n=>`<option value="${n}">PPT第${n}頁 · ${esc(DECK.find(d=>d[1]===n)[2].slice(0,22))}</option>`).join('');el('shsel').onchange=e=>{showStopPlay();SI=DECK.findIndex(d=>d[1]===+e.target.value);showRender();};el('shprev').onclick=()=>showStep(-1);el('shnext').onclick=()=>showStep(1);el('shplay').onclick=()=>{if(SPLAY)showStopPlay();else{if(SI===DECK.length-1)SI=0;showRender();SPLAY=setInterval(()=>{if(SI>=DECK.length-1){showStopPlay();return;}SI++;showRender()},2600);el('shplay').textContent='⏸ 暫停';}};el('shfs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else el('show').requestFullscreen?.().catch(()=>{el('shfs').textContent='此瀏覽器不支援原生全螢幕'})};el('shclose').onclick=()=>navigate('intro');
el('theme-toggle').onclick=()=>{ST.theme=ST.theme==='dark'?'light':'dark';applyPreferences();save();};el('font-toggle').onclick=()=>{ST.font=(ST.font+1)%3;applyPreferences();save();fit();};function applyPreferences(){document.documentElement.dataset.theme=ST.theme;document.documentElement.style.setProperty('--text',[20,22,24][ST.font]+'px');document.documentElement.dataset.font=ST.font;el('theme-toggle').setAttribute('aria-pressed',String(ST.theme==='dark'));el('font-toggle').title='文字大小 '+[20,22,24][ST.font]+'px';}
document.addEventListener('fullscreenchange',fullscreenSync);document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const fs=document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation');if(fs){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();if(LI>0)showLearn(LI-1);}else if(e.key==='Escape')exitLearnFullscreen();return;}if(PAGE==='show'){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showStep(1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();showStep(-1);}else if(e.key==='Escape')navigate('intro');else if(e.key==='Home'){SI=0;showRender()}else if(e.key==='End'){SI=DECK.length-1;showRender()}return;}if(PAGE==='learn'&&el('flip')){if(e.key==='ArrowRight'){e.preventDefault();flipStop();flipShow(FI+1)}if(e.key==='ArrowLeft'){e.preventDefault();flipStop();flipShow(FI-1)}}});
el('learn-stage').addEventListener('contextmenu',e=>{if(document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation')){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1)}});
window.addEventListener('resize',fit);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){flipStop();showStopPlay();save();}});new ResizeObserver(fit).observe(el('bar'));
el('slide-text').onclick=()=>{const page=DECK[SI][1];openDialog('原PPT第'+page+'頁原文',`${CONTENT.sourceCorrections.filter(x=>x.ppt.includes(page)).map(x=>'<div class="scope-note">'+esc(x.note)+'</div>').join('')}<p>${esc(CONTENT.pptText[page])}</p>`);};el('hero-image').src=IMG['transport_cd'];el('video-external').href=VIDEO_URL;el('video-external').textContent='在 Google 雲端硬碟開啟影片 ↗';el('raw-animation').onclick=()=>{const d=openDialog('原始簡報動畫',`<p class="animation-note">原動畫保留原教材內容；請配合圖解的濃度梯度、膨壓與受體回收的補充說明閱讀。</p><video controls autoplay playsinline style="width:100%" src="${ANIMATION_SRC}"></video>`);d.addEventListener('close',()=>d.querySelector('video')?.pause(),{once:true});};applyPreferences();const start=['learn','play','done'].includes(ST.page)?ST.page:'intro';navigate(start);if(!saving)storageNotice();
</script></body></html>
