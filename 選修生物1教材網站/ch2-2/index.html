const CONTENT={"lessons": [{"id": "b1-22-l01", "t": "呼吸作用：把燃料能量轉到 ATP", "src": "課本 P75；原簡報第 1、2 頁", "slide": 1, "figSpec": {"image": "overview"}, "sec": "s1", "txt": "<h3>分解與能量轉換</h3><p>細胞以酵素催化有機養分的氧化反應，把部分能量轉移到 <b>ATP</b>，供生命活動使用。</p><p>本課本以廣義「呼吸作用」統整有氧呼吸、無氧呼吸與發酵。較嚴格的生化用語會把使用電子傳遞鏈的呼吸，與不使用它的發酵分開。</p><p>比較時先問：有沒有電子傳遞鏈？最終電子接受者是誰？ATP 如何形成？不能只看有沒有氧。</p><div class=\"quote\"><p>少量<br>粒線體<br>\u001f\u001e\u001d\u001c<br>\u001b\u001e\u001d\u001c\u001a<br>細胞質液<br>少量<br>\u0019\u001a<br>-2 呼吸作用<br>2<br>呼吸作用　respiration <br>有氧呼吸　aerobic respiration<br>無氧呼吸　anaerobic respiration <br>電子傳遞鏈　electron transport chain<br>發酵作用　fermentation <br> 圖 2－5　有氧呼吸的反應總圖<br>參與有氧呼吸的輔<br>NADH 與 FADH2 屬於還原態輔<br>，在細胞呼吸作用中參與能量代<br>謝的過程。<br>FAD + 2e<br>－+ 2H<br>＋<br>FADH2<br>NAD<br>＋+ 2e<br>－+ 2H<br>＋<br>NADH + H<br>＋<br>知識補給站<br>2<br>細胞經由酵素催化一系列的氧化還原反應，分解葡<br>萄糖、胺基酸或脂肪酸等有機物，並將這些反應所釋出<br>的能量轉移生成 ATP，此過程稱為呼吸作用，包括有氧<br>呼吸、無氧呼吸與發酵作用，其中有氧呼吸與無氧呼吸<br>都會經過電子傳遞鏈產生大量的 ATP。但有些生物在<br>缺氧的環境下，也可以將葡萄糖分解成較小分子的有機<br>物，卻沒有經過電子傳遞鏈，所以只獲得少量的 ATP，<br>稱為發酵作用。<br>2-2.1 有氧呼吸<br>有氧呼吸需要 O2 參與氧化還原反應，真核細胞的<br>有氧呼吸在細胞質液與粒線體中進行，以利用葡萄糖為<br>例可分為四個階段: 糖解作用、乙醯輔  A 的形成、檸<br>檬酸循環及電子傳遞鏈過程（ 圖 2－5 ）。<br>反應簡式：C6H12O6 + O2 + ADP + Pi → CO2 + H2O + ATP<br>第 2 章  細胞的代謝與能量　75</p><small>課本 P75完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>2-2 <br>呼吸作用<br>2-2.1 <br>有氧呼吸<br>2-2.2 <br>無氧呼吸<br>2-2.3 <br>發酵作用<br>內膜<br>電子傳遞鏈<br>膜間腔<br>基質<br>ATP<br> 合成酶<br>NAD<br>+<br>e<br>-<br>H<br>+<br>e<br>-<br>H<br>+<br>FAD<br>e<br>-<br>e<br>-<br>O<br>2<br>H<br>+<br>H<br>2<br>O<br>ADP+Pi<br>ATP<br>H<br>+<br>H<br>+<br>H<br>+</p><small>原PPT第1頁完整文字</small></div><div class=\"quote\"><p>◆ 將葡萄糖、胺基酸或脂肪酸<br>等物質完全分解，釋<br>出能量<br>◆ 包括<br>有氧呼吸<br>與<br>無氧呼吸<br>◆ 在無氧的環境下，將葡萄糖分解，<br>釋出能量<br>發酵作用<br>2-2 <br>呼吸作用<br>呼吸作用<br>◆ 電子傳遞鏈階段，會產生<br>大量 <br>ATP<br>◆ 沒有電子傳遞鏈階段，只能<br>產生<br>少量的 <br>ATP<br>配合<br>課本 <br>P75</p><small>原PPT第2頁完整文字</small></div>", "tb": [["BOOK1", "課本 P75 完整頁面"]]}, {"id": "b1-22-l02", "t": "四階段：沿著位置追蹤碳與電子", "src": "課本 P76、P77；原簡報第 3、9 頁", "slide": 3, "figSpec": {"image": "respiration"}, "sec": "s1", "txt": "<h3>真核細胞的空間路線</h3><ol><li><b>糖解：</b>細胞質液，葡萄糖轉成丙酮酸。</li><li><b>乙醯輔酶 A 形成：</b>粒線體基質。</li><li><b>檸檬酸循環：</b>粒線體基質。</li><li><b>電子傳遞與氧化磷酸化：</b>粒線體內膜。</li></ol><p>課本圖2-6原本跨 P76–77，此處依書頁邊界接合。分別追蹤碳骨架、NADH／FADH₂ 與 ATP，不把三條路線混成一條。</p><p>教材的總反應是<b>反應簡式，未配平</b>，不能直接拿其中係數計算分子數。</p><div class=\"quote\"><p>糖解作用<br>有氧呼吸的第一階段為糖解作用，於細胞質液中進行。葡萄糖被分解為丙酮酸，所釋<br>出的能量使 ADP 轉變為 ATP，並將 NAD<br>＋ 還原成 NADH（圖 2－6），此過程不需要O2<br>的參與。<br>乙醯輔<br> A 的形成及檸檬酸循環<br>在氧氣足夠的情況下，細胞質液中的丙酮酸進入粒線體基質與輔 <br> A 反應，生成<br>乙醯輔<br> A ，過程中產生 NADH 及 CO2。接著，乙醯輔<br> A 進入檸檬酸循環，經一系列<br>作用後產生 CO2、ATP、NADH 及 FADH2。由於檸檬酸循環是由英國生化學家克瑞布斯所<br>發現，因此檸檬酸循環亦稱為克氏循環。<br>糖解作用　glycolysis<br>基質　matrix <br>乙醯輔<br> A　acetyl CoA<br>檸檬酸循環　citric acid cycle<br>克氏循環　Krebs cycle <br>克瑞布斯　Hans Adolf Krebs, 1900∼1981<br>膜間腔<br>基質<br>內膜<br>外膜<br> 圖 2－6　真核細胞有氧呼吸的各個階段<br>76　選修生物 Ⅰ (全)</p><small>課本 P76完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>電子傳遞鏈<br>粒線體的電子傳遞鏈位於內膜上，由數個蛋白質複合體構成，<br>NADH 及 FADH2 將電子釋出，由這些蛋白質複合體接收，進行一連串的氧化還原<br>反應，釋出的能量使大量的 ADP 被磷酸化生成 ATP。而電子最後由 O2  接受，並<br>與 H<br>+ 結合形成 H2O。<br>有氧呼吸生成的 ATP 大部分來自電子傳遞的過程，由於此階段需要 O2 的參<br>與，因此在有氧的情況下，丙酮酸才能進入粒線體，並進一步被分解。另外，由<br>於原核細胞沒有粒線體，進行呼吸作用時，是藉由細胞膜上的電子傳遞鏈完成。<br>反應簡式：     O2 + 2H<br>+ + 2e<br>－ → H2O<br>1<br>2<br>內<br>膜<br>內<br>膜<br>蛋白質複合體<br>第 2 章  細胞的代謝與能量　77</p><small>課本 P77完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>2-2.1 <br>有氧呼吸<br>C<br>6<br>H<br>12<br>O<br>6<br> + O<br>2<br> + ADP + Pi → CO<br>2<br> + H<br>2<br>O + ATP<br>◆ 分為<br>糖解作用<br>、<br>乙醯輔<br>酶 <br>A<br> 的<br>形成<br>、<br>檸檬酸循環<br>和<br>電子傳遞鏈<br>四個階段<br>◆<br> 反應簡式 ：<br>細胞的呼吸作用<br>配合<br>課本 <br>P75</p><small>原PPT第3頁完整文字</small></div><div class=\"quote\"><p>糖解作用<br>  <br>ADP+Pi<br> <br> <br>ATP<br>   <br>NAD<br>+<br>葡萄糖<br>丙酮酸<br> NADH<br>乙醯輔酶 <br>A<br> 的形成<br>CO<br>2<br>輔酶 <br>A<br> <br>NAD<br>+<br>乙醯輔酶<br>A<br> NADH<br>檸檬酸循環<br>CO<br>2<br>   <br>NAD<br>+<br>   <br>ADP+Pi<br>   <br>ATP<br>   <br>FAD<br>四碳化合物<br>檸檬酸<br>輔酶<br>A<br>   <br>NADH<br> <br> <br> <br>FADH<br>2<br>葡萄糖分解 br> 反應 ：丙酮酸進入粒線體基質後，和輔酶 <br>A<br> <br>形成乙醯輔酶 <br>A<br>，並產生 <br>NADH<br> 和 <br>CO<br>2<br>1.<br> 位置 ：<br>粒線體基質<br>丙酮酸<br>CO<br>2<br>乙醯輔酶 <br>A<br>輔酶 <br>A<br> <br>NAD<br>+<br> <br>NADH<br>2-2.1 <br>有氧呼吸<br>配合<br>課本 <br>P76</p><small>原PPT第6頁完整文字</small></div>", "tb": [["BOOK2", "課本 P76 完整頁面"]]}, {"id": "b1-22-l06", "t": "檸檬酸循環：碳排出，電子留下", "src": "課本 P76；原簡報第 7、8 頁", "slide": 7, "figSpec": {"flip": [7, 8]}, "sec": "s1", "txt": "<h3>二碳接上四碳，再生四碳</h3><p>乙醯基與四碳化合物結合，形成六碳檸檬酸。經一系列反應再生四碳接受者，形成循環。</p><p>教材重點是產生 <b>CO₂、少量 ATP、NADH 與 FADH₂</b>，把電子留給後續的電子傳遞鏈。</p><p>循環本身不直接消耗 O₂；但有氧呼吸要靠後續電子傳遞再生氧化態載體，才可持續運轉。</p><div class=\"quote\"><p>糖解作用<br>有氧呼吸的第一階段為糖解作用，於細胞質液中進行。葡萄糖被分解為丙酮酸，所釋<br>出的能量使 ADP 轉變為 ATP，並將 NAD<br>＋ 還原成 NADH（圖 2－6），此過程不需要O2<br>的參與。<br>乙醯輔<br> A 的形成及檸檬酸循環<br>在氧氣足夠的情況下，細胞質液中的丙酮酸進入粒線體基質與輔 <br> A 反應，生成<br>乙醯輔<br> A ，過程中產生 NADH 及 CO2。接著，乙醯輔<br> A 進入檸檬酸循環，經一系列<br>作用後產生 CO2、ATP、NADH 及 FADH2。由於檸檬酸循環是由英國生化學家克瑞布斯所<br>發現，因此檸檬酸循環亦稱為克氏循環。<br>糖解作用　glycolysis<br>基質　matrix <br>乙醯輔<br> A　acetyl CoA<br>檸檬酸循環　citric acid cycle<br>克氏循環　Krebs cycle <br>克瑞布斯　Hans Adolf Krebs, 1900∼1981<br>膜間腔<br>基質<br>內膜<br>外膜<br> 圖 2－6　真核細胞有氧呼吸的各個階段<br>76　選修生物 Ⅰ (全)</p><small>課本 P76完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>(<br>三<br>)<br> 檸檬酸循環<br>1.<br> 位置 ：<br>粒線體基質<br>2.<br> 反應 ：<br>乙醯輔酶 <br>A<br> 和四碳化合物結合形成檸檬酸，經一系列作用，產生 <br>CO<br>2<br>、<br>ATP<br>、<br>NADH<br>、<br>FADH<br>2<br>檸檬酸循環是由<br>英國<br>生化學家<br>克瑞布斯<br><br>所發現，因此檸檬酸循環亦稱<br>克氏循環<br>2-2.1 <br>有氧呼吸<br>配合<br>課本 <br>P76</p><small>原PPT第7頁完整文字</small></div><div class=\"quote\"><p>四碳化合物<br>乙醯輔酶 <br>A<br>輔酶 <br>A<br>CO<br>2<br> <br>NAD<br>+<br> <br>NADH<br> <br>ADP+Pi<br> <br>ATP<br> <br>FAD<br> <br>FADH<br>2<br>檸檬酸<br>(<br>三<br>)<br> 檸檬酸循環<br>2-2.1 <br>有氧呼吸<br>配合<br>課本 <br>P76</p><small>原PPT第8頁完整文字</small></div>", "tb": [["BOOK2", "課本 P76 完整頁面"]]}, {"id": "b1-22-l07", "t": "電子傳遞鏈：氧在哪一步出場？", "src": "課本 P77；原簡報第 10、11、13 頁", "slide": 10, "figSpec": {"image": "etc"}, "sec": "s2", "txt": "<h3>電子抵達終點，形成水</h3><p>電子經粒線體內膜上的載體傳遞，最後由 <b>O₂ 接受</b>，並與 H⁺ 形成 H₂O。</p><p>原核細胞沒有粒線體，呼吸電子傳遞鏈位於<b>細胞膜</b>。</p><p class=\"scope-note\">原文「有氧時丙酮酸才能進入粒線體」是整條有氧代謝的簡化描述。O₂ 直接參與的是電子傳遞鏈終端反應；它不是丙酮酸運輸或檸檬酸循環直接使用的反應物。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26894/\" target=\"_blank\" rel=\"noopener\">生化教材</a></p><div class=\"quote\"><p>電子傳遞鏈<br>粒線體的電子傳遞鏈位於內膜上，由數個蛋白質複合體構成，<br>NADH 及 FADH2 將電子釋出，由這些蛋白質複合體接收，進行一連串的氧化還原<br>反應，釋出的能量使大量的 ADP 被磷酸化生成 ATP。而電子最後由 O2  接受，並<br>與 H<br>+ 結合形成 H2O。<br>有氧呼吸生成的 ATP 大部分來自電子傳遞的過程，由於此階段需要 O2 的參<br>與，因此在有氧的情況下，丙酮酸才能進入粒線體，並進一步被分解。另外，由<br>於原核細胞沒有粒線體，進行呼吸作用時，是藉由細胞膜上的電子傳遞鏈完成。<br>反應簡式：     O2 + 2H<br>+ + 2e<br>－ → H2O<br>1<br>2<br>內<br>膜<br>內<br>膜<br>蛋白質複合體<br>第 2 章  細胞的代謝與能量　77</p><small>課本 P77完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>(<br>四<br>)<br> 電子傳遞鏈<br>2.<br> 粒線體內膜上與電子傳遞鏈相關的配件 ：<br>(1)<br> 電子載體<br>(2)<br> <br>ATP<br> 合成酶<br>1.<br> 位置 ：<br>粒線體內膜<br>內膜<br>膜間腔<br>基質<br>註<br>電子載體依電子親和力由小到大排列，形成電子傳遞鏈<br>電子傳遞鏈<br>ATP<br> 合成酶<br>電子載體<br>電子載體<br>2-2.1 <br>有氧呼吸<br>配合<br>課本 <br>P77</p><small>原PPT第10頁完整文字</small></div><div class=\"quote\"><p>(<br>四<br>)<br> 電子傳遞鏈<br>(1)<br> 葡萄糖<br>分解過程中所產生的 <br>NADH<br> 和 <br>FADH<br>2<br> <br>到粒線<br>體內<br>膜上釋出電子<br>(2)<br> <br>這些電子經過電子傳遞鏈，最後由<br> <br>O<br>2<br> <br>接受，並與<br> <br>H<br>＋<br> <br>結合產生<br> <br>H<br>2<br>O<br>3.<br> 反應 ：<br>2-2.1 <br>有氧呼吸<br>內膜<br>ATP<br> 合成酶<br>電子傳遞鏈<br>膜間腔<br>基質<br>NAD<br>+<br>e<br>-<br>H<br>+<br>e<br>-<br>H<br>+<br>FAD<br>e<br>-<br>e<br>-<br>O<br>2<br>H<br>+<br>H<br>2<br>O<br>配合<br>課本 <br>P77</p><small>原PPT第11頁完整文字</small></div><div class=\"quote\"><p>◆ 此階段產生有氧呼吸<br>大部分<br>的 <br>ATP <br>◆<br> <br>此階段<br>需要 <br>O<br>2<br> <br>的參與，<br>因此在有氧的情況下，<br>丙酮酸才能進入粒線體，並進一步被分解成 <br>CO<br>2<br>◆ <br>原核細胞沒有粒線體，進行呼吸作用時，是藉由<br>細胞膜<br>上的電子傳遞鏈完成<br>2-2.1 <br>有氧呼吸<br>配合<br>課本 <br>P77</p><small>原PPT第13頁完整文字</small></div>", "tb": [["BOOK3", "課本 P77 完整頁面"]]}, {"id": "b1-22-l08", "t": "化學滲透：電子流建立質子梯度", "src": "課本 P78、P79；原簡報第 12、17 頁", "slide": 12, "figSpec": {"image": "coupling"}, "sec": "s2", "txt": "<h3>泵出去，再經 ATP 合成酶回來</h3><ol><li>電子傳遞釋出的能量驅動 H⁺ 由<b>基質 → 膜間腔</b>。</li><li>內膜兩側建立質子<b>電化學梯度</b>，含濃度差與電位差。</li><li>H⁺ 經 ATP 合成酶由<b>膜間腔 → 基質</b>，驅動 ADP + Pi 形成 ATP。</li></ol><p>電子與 H⁺ 的路線不同；ATP 合成酶利用的是質子回流。梯度若被消散，電子流仍可能存在，ATP 合成卻會受影響。</p><div class=\"quote\"><p>ATP 的生成<br>細胞內 ATP 的生成是經由 ADP 加上磷酸基的磷酸化反應所產<br>生，可分成兩種形式：受質層次磷酸化和化學滲透磷酸化。<br>進行糖解作用時，葡萄糖分解成丙酮酸的過程中，會產生帶有<br>磷酸基的中間產物磷酸烯醇丙酮酸（PEP），經酵素的催化，將此<br>中間產物的磷酸基轉移給 ADP，生成 ATP（圖 2－7 ）。在此過程<br>中，磷酸基是來自酵素受質的中間產物，稱為受質層次磷酸化，檸<br>檬酸循環產生ATP 的方式與糖解作用皆屬於此種磷酸化形式。<br>於粒線體內，NADH 與 FADH2 釋出的電子進入內膜的電子傳<br>遞鏈時，傳遞過程所釋出的能量，可用來將基質中的 H<br>+ 輸送至粒<br>線體內膜與外膜之間的膜間腔累積，因而在粒線體內膜的兩側形成<br>濃度差異，這個濃度差異所產生的擴散運動正是推動化學滲透磷酸<br>化的主因。內膜上的 ATP 合成  兼具通道蛋白與酵素的功能，當 <br>H<br>+ 經由 ATP 合成  由膜間腔往基質擴散時，可促使 ADP 磷酸化而<br>生成 ATP（圖 2－8 ），上述過程稱為化學滲透磷酸化。<br>磷酸化　phosphorylation<br>受質層次磷酸化　substrate-level phosphorylation<br>化學滲透磷酸化　chemosmosis phosphorylation<br>氧化磷酸化　oxidative phosphorylation<br>氧化磷酸化<br>氧化磷酸化包含<br>兩個階段，分別是電<br>子傳遞鏈和化學滲透<br>磷酸化。在粒線體內<br>膜上發生一系列的氧<br>化還原作用造成傳遞<br>電子的現象，同時也<br>使質子累積於粒線體<br>膜間腔內，因而和基<br>質間產生質子濃度梯<br>度，質子濃度梯度促<br>使化學滲透磷酸化的<br>發生，而產生 ATP。<br>若電子傳遞鏈和<br>化學滲透磷酸化發生<br>於葉綠體的類囊體<br>膜，因為和光合作用<br>有關，故稱為光合磷<br>酸化。<br>知識補給站<br>光合磷酸化　photosynthetic phosphorylation<br>磷酸<br>醇丙酮酸　phosphenolpyruvate,PEP<br>膜間腔　intermembrane space<br> 圖 2－7　糖解作用產生 ATP 的示意圖<br>78　選修生物 Ⅰ (全)</p><small>課本 P78完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>2-2.2 無氧呼吸<br>某些生活在無氧環境中的原核生物，其電子傳遞鏈最後接<br>受電子與H<br>＋的不是 O2，而是其他化合物，如 SO4<br>2－、NO3<br>－、<br>CO2 等，產物也各有不同。例如： SO4<br>2－接受電子與H<br>＋後會產<br>生H2S，而不是 H2O，腐敗雞蛋的刺鼻臭味就是來自於這類細<br>菌進行無氧呼吸所釋放出來的 H2S。<br>反應簡式 : C6H12O6 + SO4<br>2－+ ADP + Pi → CO2 + H2S + ATP<br> 圖 2－8 　粒線體及葉綠體進行化學滲透磷酸化產生 ATP 的示意圖<br>第 2 章  細胞的代謝與能量　79</p><small>課本 P79完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>(3)① NADH<br> 與 <br>FADH<br>2<br> <br>釋出的電子經過電子傳遞鏈時所釋出的能量，可用來將基質中的 <br>H<br>+<br> <br>輸送至粒線體的膜間腔累積<br>②<br> <br>當<br> <br>H<br>＋ <br>經由 <br>ATP<br> 合成酶由膜間腔往基質擴散時，可<br>促使 <br> <br>    ADP<br> <br>磷酸化而生成 <br>ATP<br>3. <br>反應 ：<br>2-2.1 <br>有氧呼吸<br>內膜<br>ATP<br> 合成酶<br>電子傳遞鏈<br>膜間腔<br>基質<br>NAD<br>+< mentation"}, "sec": "s4", "txt": "<h3>能量少，氧化態載體仍不可少</h3><p>有氧電子傳遞受阻時，部分細胞以有機物接受 NADH 的電子，<b>再生 NAD⁺</b>，使糖解得以繼續。</p><p>發酵不使用電子傳遞鏈；淨得的 <b>2 ATP／葡萄糖</b>來自糖解的受質層次磷酸化，不是丙酮酸變成乳酸或乙醇時額外產生。</p><p>大部分燃料能量仍留在有機產物中。「無電子傳遞鏈終端接受者」不等於「沒有物質接受電子」。</p><div class=\"quote\"><p>2-2.3 發酵作用<br>當細胞所需的 O2 供給不足時，電子傳遞鏈會因沒有足夠的 O2 接受電子而受到阻礙。<br>此時糖解作用與檸檬酸循環生成的 NADH 與 FADH2 會逐漸堆積，導致糖解作用與檸檬酸<br>循環因缺少 NAD<br>＋ 與 FAD 接受電子而停止，細胞因此無法繼續獲得能量。但有些生物體<br>的細胞可以持續進行糖解作用獲得 ATP，這些細胞能將糖解作用所產生的丙酮酸轉變成其<br>他有機物，並使 NADH 氧化成 NAD<br>＋，以利於糖解作用不斷進行，此過程不需要 O2 即可<br>產生 ATP 供細胞使用，稱為發酵作用（圖 2－9）。<br>植物、酵母菌及一些細菌在氧氣不足的情況下，可利用葡萄糖進行酒精發酵。過程中<br>先在細胞質液進行糖解作用將葡萄糖分解為丙酮酸，當丙酮酸還原為酒精（乙醇）並釋<br>出 CO2，同時 NADH 氧化成 NAD<br>＋，再生的 NAD<br>＋ 繼續參與糖解作用。<br>反應簡式 : C6H12O6 + ADP + Pi → C2H5OH（乙醇） + CO2 + ATP<br>而乳酸菌等微生物和骨骼肌細胞則可進行乳酸發酵，其糖解作用產生的丙酮酸會被還<br>原成乳酸，並使 NADH 氧化成 NAD<br>＋。<br>反應簡式 : C6H12O6 + ADP + Pi → C3H6O3（乳酸）+ ATP <br> 圖 2－9　發酵作用<br>酒精發酵　alcohol fermentation<br>乳酸發酵　lactic acid fermentation<br>80　選修生物 Ⅰ (全)</p><small>課本 P80完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>當細胞所需的 <br>O<br>2<br> <br>供給不足時，電子傳遞鏈會因沒有足夠的 <br>O<br>2<br> <br>接受電子而受到阻礙<br>2-2.3 <br>發酵作用<br>糖解作用與檸檬酸循環生成的 <br>NADH<br> 與<br>FADH<br>2<br> <br>會逐漸堆積<br>糖解作用與檸檬酸循環因缺少<br>NAD<br>＋ <br>與 <br>FAD<br> 接受電子而停止<br>細胞無法繼續獲得能量<br>但有些生物體的細胞能將糖解作用所產生的丙酮酸轉變成其他有機物，並使 <br>NADH<br> 氧化成 <br>NAD<br>＋<br>糖解作用可繼續進行，<br>產生 <br>ATP <br>供細胞使用<br>，<br>稱<br>為<br>發酵<br>作用<br>行發酵作用時，由於丙酮酸並未被完全分解成 <br>CO<br>2<br>，葡萄糖所蘊藏的能量未完全釋放，產生的 <br>ATP<br> 較少<br>!<br>配合<br>課本 <br>P80</p><small>原PPT第22頁完整文字</small></div>", "tb": [["BOOK6", "課本 P80 完整頁面"]]}, {"id": "b1-22-l13", "t": "酒精發酵：乙醛接受電子", "src": "課本 P80；原簡報第 23、24 頁", "slide": 23, "figSpec": {"image": "fermentation"}, "sec": "s4", "txt": "<h3>先脫羧，再還原</h3><p>糖解先形成丙酮酸；丙酮酸脫羧形成<b>乙醛與 CO₂</b>，乙醛再接受 NADH 的電子，還原成乙醇並再生 NAD⁺。</p><p>教材列植物、酵母菌及部分細菌為例。每分子葡萄糖合計淨產 2 ATP，來自糖解。</p><p>原圖把多步反應簡寫成「丙酮酸轉成乙醇和 CO₂」；判斷實際接受 NADH 電子的分子時，應回答<b>乙醛</b>。</p><div class=\"quote\"><p>2-2.3 發酵作用<br>當細胞所需的 O2 供給不足時，電子傳遞鏈會因沒有足夠的 O2 接受電子而受到阻礙。<br>此時糖解作用與檸檬酸循環生成的 NADH 與 FADH2 會逐漸堆積，導 物、酵母菌及一些細菌在氧氣不足的情況下，可利用葡萄糖進行酒精發酵。過程中<br>先在細胞質液進行糖解作用將葡萄糖分解為丙酮酸，當丙酮酸還原為酒精（乙醇）並釋<br>出 CO2，同時 NADH 氧化成 NAD<br>＋，再生的 NAD<br>＋ 繼續參與糖解作用。<br>反應簡式 : C6H12O6 + ADP + Pi → C2H5OH（乙醇） + CO2 + ATP<br>而乳酸菌等微生物和骨骼肌細胞則可進行乳酸發酵，其糖解作用產生的丙酮酸會被還<br>原成乳酸，並使 NADH 氧化成 NAD<br>＋。<br>反應簡式 : C6H12O6 + ADP + Pi → C3H6O3（乳酸）+ ATP <br> 圖 2－9　發酵作用<br>酒精發酵　alcohol fermentation<br>乳酸發酵　lactic acid fermentation<br>80　選修生物 Ⅰ (全)</p><small>課本 P80完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>2-2.3 <br>發酵作用<br>乳酸發酵<br>1.<br> 位置 ：<br>細胞質<br>(1)<br> 糖解作用<br>：<br>葡萄糖經酵素催化，形成丙酮酸，並產生 <br>ATP<br> 和 <br>NADH<br>(2)<br> 丙酮酸經 <br>NADH<br> 還原為乳酸<br>2.<br> 反應 ：<br>  <br>ADP+Pi<br> <br>ATP<br>   <br>NAD<br>+<br>葡萄糖<br>丙酮酸<br> <br> <br>NADH<br> <br> <br>NAD<br>+<br>  <br>NADH<br>乳酸<br>配合<br>課本 <br>P80</p><small>原PPT第25頁完整文字</small></div><div class=\"quote\"><p>2-2.3 <br>發酵作用<br>4.<br> 能量產生 ：<br>2<br> <br>ATP<br>5.<br> 細胞種類 ：乳酸菌、骨骼肌細胞<br>3.<br> 反應簡式 <br>：C<br>6<br>H<br>12<br>O<br>6<br> + ADP + Pi → C<br>3<br>H<br>6<br>O<br>3<br>（乳酸）<br>+ ATP<br>配合<br>課本 <br>P80</p><small>原PPT第26頁完整文字</small></div>", "tb": [["BOOK6", "課本 P80 完整頁面"]]}, {"id": "b1-22-l15", "t": "三種能量策略：看鏈、接受者與產能", "src": "課本 P81；原簡報第 27、28 頁", "slide": 27, "figSpec": {"flip": [27, 28]}, "sec": "s4", "txt": "<h3>同一項比較，先定義清楚</h3><ul><li><b>有氧呼吸：</b>電子傳遞鏈，終點為 O₂；教材典型估計 30 或 32 ATP／葡萄糖。</li><li><b>無氧呼吸：</b>電子傳遞鏈，終點為非 O₂ 接受者；產能依路徑與條件不同。</li><li><b>發酵：</b>不使用電子傳遞鏈，藉有機接受者再生 NAD⁺；淨得 2 ATP。</li></ul><p>原表在發酵「電子接受者」欄寫「無」，讀成無<b>呼吸電子鏈的終端接受者</b>。有機接受者仍存在。</p><p>課本的產能高低是典型比較；不能把所有無氧呼吸都當成固定同一 ATP 數，也不把一般排序當作跨所有條件的定律。</p><div class=\"quote\"><p>杯底養金魚<br>乳酸發酵可以在缺氧環境下讓動物獲得ATP，只是乳酸具有毒性，累積太多的乳酸甚至可能致命，<br>因此乳酸發酵並非長久之計。但在冬季水面結冰時，水面下的魚類如何生活在缺氧的環境呢？科學家發<br>現金魚（Carassius auratus）與其近親北歐鯽魚（Carassius carassius）能將乳酸轉變成乙醇（如下<br>圖），並由鰓排出體外，因此可在冰封的水底生存數月之久。科學家估算，如果將金魚放入一個啤酒杯<br>中，並將杯口密封放入冰箱冷藏室，模擬酷寒、缺氧的環境。經過200 天後，金魚仍可存活，而啤酒杯<br>中的乙醇濃度將上升到4％，相當於啤酒的濃度。<br>請問：<br>1 \u0007金魚產生乙醇的方式與酵母菌的酒精發酵有何異同？<br>2 \u0007冰箱裡的金魚為何不用餵食，還能生存200 天？<br>細胞進行發酵作用時，由於丙酮酸並未被完全分解成CO2，葡萄糖所蘊藏的能量大部<br>分仍保留在乙醇或乳酸等有機分子中，最終只有糖解作用產生的 2 分子 ATP，因此能量的<br>轉換率遠低於有氧呼吸與無氧呼吸。<br>腦力激盪<br> 金魚的新陳代謝示意圖<br>第 2 章  細胞的代謝與能量　81</p><small>課本 P81完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>◆ <br>有氧呼吸、無氧呼吸和發酵作用的<br>比較<br> <br>：<br>補充<br>類　型<br>有氧呼吸<br>無氧呼吸<br>發酵作用<br>乳酸發酵<br>酒精發酵<br>氧的參與<br>有<br>無<br>無<br>無<br>反應位置<br>  細胞質、<br>  粒線體<br>細胞質<br>細胞質<br>細胞質<br>反應<br><br>過程<br>糖解作用<br>有<br>-<br>有<br>有<br>檸檬酸循環<br>有<br>-<br>無<br>無<br>電子傳遞鏈<br>有<br>-<br>無<br>無<br>反應物<br>葡萄糖、胺基酸、脂肪酸等<br>-<br>葡萄糖<br>葡萄糖<br>產　物<br>二氧化碳、水<br>-<br>乳酸<br>酒精、<br>二氧化碳<br>2-2.3 <br>發酵作用<br>補充</p><small>原PPT第27頁完整文字</small></div><div class=\"quote\"><p>◆ <br>有氧呼吸、無氧呼吸和發酵作用的<br>比較<br> <br>：<br>補充<br>類　型<br>有氧呼吸<br>無氧呼吸<br>發酵作用<br>乳酸發酵<br>酒精發酵<br>電子接受者<br>O<br>2<br>非 <br>O<br>2  <br>的其他物質，如 <br>SO<br>4<br>2-<br>無<br>無<br>產生的 <br>ATP <br>數<br>30 <br>或 <br>32<br>-<br>2<br>2<br>例　子<br>一般細胞<br>某些生活在無氧環境中的原核生物<br>乳酸菌、骨骼肌細胞<br>植物、酵母菌及一些細菌<br>2-2.3 <br>發酵作用<br>補充</p><small>原PPT第28頁完整文字</small></div>", "tb": [["BOOK7", "課本 P81 完整頁面"]]}, {"id": "b1-22-l16", "t": "金魚缺氧適應：產物排出與燃料儲備", "src": "課本 P81；原簡報第 29、30、31、32 頁", "slide": 29, "figSpec": {"image": "goldfish"}, "sec": "s5", "txt": "<h3>從器官路徑提出可檢驗的解釋</h3><p>課本圖示一般器官產生乳酸，經血液送到肌肉，轉成丙酮酸、乙醛與乙醇；乙醇由血液送到鰓排出。</p><p>低溫降低代謝需求，儲存的肝醣仍提供燃料；能排出產物不代表不需能量。</p><p class=\"scope-note\">研究指出金魚與鯽魚的乙醇途徑涉及肌肉中演化出的酵素系統，機制與酵母不同，卻有相似的乙醇終產物。耐缺氧仍受肝醣儲備限制。<a href=\"https://www.nature.com/articles/s41598-017-07385-4\" target=\"_blank\" rel=\"noopener\">Fagernes 等，2017</a></p><p>「200天、4%」是教材估算情境，不是任一金魚的存活保證。以圖解、模型與資料討論，不安排密封活魚的操作。</p><div class=\"quote\"><p>杯底養金魚<br>乳酸發酵可以在缺氧環境下讓動物獲得ATP，只是乳酸具有毒性，累積太多的乳酸甚至可能致命，<br>因此乳酸發酵並非長久之計。但在冬季水面結冰時，水面下的魚類如何生活在缺氧的環境呢？科學家發<br>現金魚（Carassius auratus）與其近親北歐鯽魚（Carassius carassius）能將乳酸轉變成乙醇（如下<br>圖），並由鰓排出體外，因此可在冰封的水底生存數月之久。科學家估算，如果將金魚放入一個啤酒杯<br>中，並將杯口密封放入冰箱冷藏室，模擬酷寒、缺氧的環境。經過200 天後，金魚仍可存活，而啤酒杯<br>中的乙醇濃度將上升到4％，相當於啤酒的濃度。<br>請問：<br>1 \u0007金魚產生乙醇的方式與酵母菌的酒精發酵有何異同？<br>2 \u0007冰箱裡的金魚為何不用餵食，還能生存200 天？<br>細胞進行發酵作用時，由於丙酮酸並未被完全分解成CO2，葡萄糖所蘊藏的能量大部<br>分仍保留在乙醇或乳酸等有機分子中，最終只有糖解作用產生的 2 分子 ATP，因此能量的<br>轉換率遠低於有氧呼吸與無氧呼吸。<br>腦力激盪<br> 金魚的新陳代謝示意圖<br>第 2 章  細胞的代謝與能量　81</p><small>課本 P81完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>  <br>腦力激盪<br>乳酸發酵可以在缺氧環境下讓動物獲得 <br>ATP<br>，只是乳酸具有毒性，累積太多的乳酸甚至可能致命，因此乳酸發酵並非長久之計。但在冬季水面結冰時，水面下的魚類如何生活在缺氧的環境呢？<br>杯底養金魚<br>配合<br>課本 <br>P81</p><small>原PPT第29頁完整文字</small></div><div class=\"quote\"><p>  <br>腦力激盪<br>　　科學家<br>發現金魚（<br>Carassius auratus<br>）與其近親北歐鯽魚（<br>Carassius <br>carassius<br>）能將乳酸轉變成乙醇，並由鰓排出體外，因此可在冰封的水底生存數月之久。<br>杯底養金魚<br>配合<br>課本 <br>P81</p><small>原PPT第30頁完整文字</small></div><div class=\"quote\"><p>  <br>腦力激盪<br>杯底養金魚<br>       科學家估算，如果將金魚放入一個啤酒杯中，並將杯口密封放入冰箱冷藏室，模擬酷寒、缺氧的環境。經過 <br>200 <br>天後，金魚仍可存活，而啤酒杯中的乙醇濃度將上升到 <br>4<br>％，相當於啤酒的濃度。<br>請問 ：<br>配合<br>課本 <br>P81</p><small>原PPT第31頁完整文字</small></div><div class=\"quote\"><p>  <br>腦力激盪<br>答 ：冰箱中金魚的體溫極低，新陳代謝的速率很低，養分的消耗<br>很少<br>答 ：金魚產生的乙醇並非來自酒精發酵，而是利用丙酮酸去羧酶將丙酮酸轉變成乙醛，再由乙醇去氫酶進一步轉變成乙醇。而其乳酸發酵產生的乳酸可以轉變成丙酮酸，不會堆積在各器官<br>中<br>1. <br>金魚產生乙醇的方式與酵母菌的酒精發酵有何異同？<br>2. <br>冰箱裡的金魚為何不用餵食，還能生存 <br>200 <br>天？<br>杯底養金魚<br>配合<br>課本 <br>P81</p><small>原PPT第32頁完整文字</small></div>", "tb": [["BOOK7", "課本 P81 完整頁面"]]}, {"id": "b1-22-l17", "t": "整合原題：把簡化敘述放回機制", "src": "課本 P81；原簡報第 33、34、35、36 頁", "slide": 33, "figSpec": {"flip": [33, 34, 35, 36]}, "sec": "s5", "txt": "<h3>用四個檢核問題回看原題</h3><ol><li>糖解、基質反應與內膜反應的位置是否正確？</li><li>O₂ 是在哪個步驟直接接受電子？</li><li>發酵如何再生 NAD⁺，ATP 在哪裡形成？</li><li>硫酸根是接受者還是產物？</li></ol><p>保留原題一 A、C、E；原題二 B；原題三 B。第三題整張比較表已重排成可點選的大字列，原題原圖與解析仍可查看。</p><p>原題一 E 的「電子傳遞過程產生大量 ATP」指電子鏈與化學滲透相耦合；ATP 由 ATP 合成酶形成，不是電子直接變成 ATP。</p><div class=\"quote\"><p>杯底養金魚<br>乳酸發酵可以在缺氧環境下讓動物獲得ATP，只是乳酸具有毒性，累積太多的乳酸甚至可能致命，<br>因此乳酸發酵並非長久之計。但在冬季水面結冰時，水面下的魚類如何生活在缺氧的環境呢？科學家發<br>現金魚（Carassius auratus）與其近親北歐鯽魚（Carassius carassius）能將乳酸轉變成乙醇（如下<br>圖），並由鰓排出體外，因此可在冰封的水底生存數月之久。科學家估算，如果將金魚放入一個啤酒杯<br>中，並將杯口密封放入冰箱冷藏室，模擬酷寒、缺氧的環境。經過200 天後，金魚仍可存活，而啤酒杯<br>中的乙醇濃度將上升到4％，相當於啤酒的濃度。<br>請問：<br>1 \u0007金魚產生乙醇的方式與酵母菌的酒精發酵有何異同？<br>2 \u0007冰箱裡的金魚為何不用餵食，還能生存200 天？<br>細胞進行發酵作用時，由於丙酮酸並未被完全分解成CO2，葡萄糖所蘊藏的能量大部<br>分仍保留在乙醇或乳酸等有機分子中，最終只有糖解作用產生的 2 分子 ATP，因此能量的<br>轉換率遠低於有氧呼吸與無氧呼吸。<br>腦力激盪<br> 金魚的新陳代謝示意圖<br>第 2 章  細胞的代謝與能量　81</p><small>課本 P81完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>  <br>Question<br>1. <br>下列有關真核生物有氧呼吸的敘述，哪些正確<br>？ <br>(<br>A)<br>可分為細胞質液階段及粒線體<br>階段　<br>(<br>B)<br>糖解作用的產物為丙酮酸，有氧氣的情況下會進入粒線體膜間腔繼續<br>反應　<br>(<br>C)<br>丙酮酸進入粒線體後會先與輔<br>酶 <br>A <br>反應<br>，生成乙醯輔酶 <br>A<br>　<br>(<br>D)<br>乙醯輔酶 <br>A <br>與<br>氧氣經由檸檬酸循環進一步反應，生成 <br>CO<br>2<br>、<br>ATP<br>、<br>NADH<br>、<br>FADH<br>2<br> <br>等<br>分子　<br>(<br>E)<br> <br>NADH<br>、<br>FADH<br>2<br> <br>將電子釋放進入內膜的電子傳遞鏈，在電子傳遞過程中產生大量 <br>ATP<br>。<br>解答 <br>：<br>(<br>A)(C)(E)<br>解析 <br>：<br>(<br>B)<br>丙酮酸在有氧氣的情況下會進入粒線體基質繼續反應。 <br>(D)<br>檸檬酸循環沒有氧氣參與。</p><small>原PPT第33頁完整文字</small></div><div class=\"quote\"><p>  <br>Question<br>2<br>. <br>當部分細胞缺氧時，會以發酵作用產生所需的能量，下列有關發酵作用的敘述，何者正確<br>？　<br>(<br>A)<br>發酵作用可將葡萄糖的能量完全轉換<br>出來　<br>(<br>B)<br>丙酮酸轉變成乙醇或乳酸時，可將 <br>NADH<br> 轉變成 <br>NAD<br>＋<br>，有利於糖解作用繼續<br>發生　<br>(<br>C)<br>優酪乳即是靠酵母菌等微生物行發酵作用所<br>製<br><br>造<br>的<br>　<br>(<br>D)<br>骨骼肌在氧氣供應不足時亦可行酒精發酵。<br>解答 ：<br>(<br>B)<br>解析 ：<br>(<br>A)<br>發酵作用仍保留大部分能量於乙醇及乳酸中。<br>(C)<br>優酪乳為乳酸菌的乳酸發酵所產生。<br>(D)<br>骨骼肌在缺氧情況下會行乳酸發酵。</p><small>原PPT第34頁完整文字</small></div><div class=\"quote\"><p>  <br>Question<br>3. <br>下表是細胞獲得能量的方式，若消耗等量的葡萄糖，下列何者正確？<br>有氧呼吸<br>無氧呼吸<br>發酵作用<br>(A)<br>糖解作用<br>有<br>有<br>無<br>(B)<br>電子傳遞鏈<br>有<br>有<br>無<br>(C)<br>電子傳遞鏈電子承接者<br>O<br>2<br>H<br>2<br>S<br> 等非 <br>O<br>2<br> <br>分子<br>乙醇<br>(D)<br>能量產生<br>有氧呼吸<br>&gt;<br>無氧呼吸<br>=<br>發酵作用</p><small>原PPT第35頁完整文字</small></div><div class=\"quote\"><p>  <br>Question<br>解答 ：<br>(<br>B)<br>有氧呼吸<br>無氧呼吸<br>發酵作用<br>(A)<br>糖解作用<br>有<br>有<br>有<br>(C)<br>電子傳遞鏈電子承接者<br>O<br>2<br>SO<br>4<br>2<br>－<br>無<br>(D)<br>能量產生<br>有氧呼吸<br>&gt;<br>無氧呼吸<br>&gt;<br>發酵作用<br>解析 ：</p><small>原PPT第36頁完整文字</small></div>", "tb": [["BOOK7", "課本 P81 完整頁面"]]}], "questions": [{"t": "四階段的位置：空間配對", "q": "把四個階段配到反應位置與主要產物。", "sub": "課本 P75–77；原PPT第3–13頁", "learn": 1, "tag": "stages", "hint": "先用位置區分，再以碳與電子載體辨認基質的兩階段。", "why": "糖解在細胞質液；乙醯輔酶A形成與循環在基質；電 太多的乳酸甚至可能致命，因此乳酸發酵並非長久之計。但在冬季水面結冰時，水面下的魚類如何生活在缺氧的環境呢？\n杯底養金魚\n配合\n課本 \nP81", "30": "  \n腦力激盪\n　　科學家\n發現金魚（\nCarassius auratus\n）與其近親北歐鯽魚（\nCarassius \ncarassius\n）能將乳酸轉變成乙醇，並由鰓排出體外，因此可在冰封的水底生存數月之久。\n杯底養金魚\n配合\n課本 \nP81", "31": "  \n腦力激盪\n杯底養金魚\n       科學家估算，如果將金魚放入一個啤酒杯中，並將杯口密封放入冰箱冷藏室，模擬酷寒、缺氧的環境。經過 \n200 \n天後，金魚仍可存活，而啤酒杯中的乙醇濃度將上升到 \n4\n％，相當於啤酒的濃度。\n請問 ：\n配合\n課本 \nP81", "32": "  \n腦力激盪\n答 ：冰箱中金魚的體溫極低，新陳代謝的速率很低，養分的消耗\n很少\n答 ：金魚產生的乙醇並非來自酒精發酵，而是利用丙酮酸去羧酶將丙酮酸轉變成乙醛，再由乙醇去氫酶進一步轉變成乙醇。而其乳酸發酵產生的乳酸可以轉變成丙酮酸，不會堆積在各器官\n中\n1. \n金魚產生乙醇的方式與酵母菌的酒精發酵有何異同？\n2. \n冰箱裡的金魚為何不用餵食，還能生存 \n200 \n天？\n杯底養金魚\n配合\n課本 \nP81", "33": "  \nQuestion\n1. \n下列有關真核生物有氧呼吸的敘述，哪些正確\n？ \n(\nA)\n可分為細胞質液階段及粒線體\n階段　\n(\nB)\n糖解作用的產物為丙酮酸，有氧氣的情況下會進入粒線體膜間腔繼續\n反應　\n(\nC)\n丙酮酸進入粒線體後會先與輔\n酶 \nA \n反應\n，生成乙醯輔酶 \nA\n　\n(\nD)\n乙醯輔酶 \nA \n與\n氧氣經由檸檬酸循環進一步反應，生成 \nCO\n2\n、\nATP\n、\nNADH\n、\nFADH\n2\n \n等\n分子　\n(\nE)\n \nNADH\n、\nFADH\n2\n \n將電子釋放進入內膜的電子傳遞鏈，在電子傳遞過程中產生大量 \nATP\n。\n解答 \n：\n(\nA)(C)(E)\n解析 \n：\n(\nB)\n丙酮酸在有氧氣的情況下會進入粒線體基質繼續反應。 \n(D)\n檸檬酸循環沒有氧氣參與。", "34": "  \nQuestion\n2\n. \n當部分細胞缺氧時，會以發酵作用產生所需的能量，下列有關發酵作用的敘述，何者正確\n？　\n(\nA)\n發酵作用可將葡萄糖的能量完全轉換\n出來　\n(\nB)\n丙酮酸轉變成乙醇或乳酸時，可將 \nNADH\n 轉變成 \nNAD\n＋\n，有利於糖解作用繼續\n發生　\n(\nC)\n優酪乳即是靠酵母菌等微生物行發酵作用所\n製\n\n造\n的\n　\n(\nD)\n骨骼肌在氧氣供應不足時亦可行酒精發酵。\n解答 ：\n(\nB)\n解析 ：\n(\nA)\n發酵作用仍保留大部分能量於乙醇及乳酸中。\n(C)\n優酪乳為乳酸菌的乳酸發酵所產生。\n(D)\n骨骼肌在缺氧情況下會行乳酸發酵。", "35": "  \nQuestion\n3. \n下表是細胞獲得能量的方式，若消耗等量的葡萄糖，下列何者正確？\n有氧呼吸\n無氧呼吸\n發酵作用\n(A)\n糖解作用\n有\n有\n無\n(B)\n電子傳遞鏈\n有\n有\n無\n(C)\n電子傳遞鏈電子承接者\nO\n2\nH\n2\nS\n 等非 \nO\n2\n \n分子\n乙醇\n(D)\n能量產生\n有氧呼吸\n>\n無氧呼吸\n=\n發酵作用", "36": "  \nQuestion\n解答 ：\n(\nB)\n有氧呼吸\n無氧呼吸\n發酵作用\n(A)\n糖解作用\n有\n有\n有\n(C)\n電子傳遞鏈電子承接者\nO\n2\nSO\n4\n2\n－\n無\n(D)\n能量產生\n有氧呼吸\n>\n無氧呼吸\n>\n發酵作用\n解析 ："}};

const THINK={"b1-22-l01": ["細胞分解葡萄糖時，釋出的能量是全部都轉存到 ATP 嗎？", "不是。細胞以酵素催化養分的氧化，只把其中一部分能量轉移到 ATP 供生命活動使用，其餘能量以熱的形式散失。"], "b1-22-l02": ["有氧呼吸的四個階段，在真核細胞中各在哪裡進行？", "糖解在細胞質液；乙醯輔酶 A 形成與檸檬酸循環在粒線體基質；電子傳遞與氧化磷酸化在粒線體內膜。"], "b1-22-l03": ["一分子葡萄糖經糖解後，產生了哪些物質？糖解需要直接消耗氧嗎？", "產生兩分子丙酮酸，淨得 2 ATP，並形成 NADH。糖解不直接消耗 O₂，有氧呼吸與發酵都以糖解為共同起點。"], "b1-22-l04": ["NAD⁺ 與 NADH、FAD 與 FADH₂，哪一個是氧化態？哪一個攜帶著電子？", "NAD⁺、FAD 是氧化態；接受電子後形成還原態的 NADH、FADH₂，攜帶電子到電子傳遞鏈，交出電子後又回到氧化態。"], "b1-22-l05": ["丙酮酸在粒線體基質轉變成乙醯輔酶 A 時，碳數如何改變？同時產生了什麼？", "三碳的丙酮酸失去一個碳，以 CO₂ 形式釋出，剩下的二碳乙醯基與輔酶 A 結合成乙醯輔酶 A，同時產生 NADH。"], "b1-22-l06": ["檸檬酸循環中，葡萄糖原有的碳最後去了哪裡？產生的 NADH、FADH₂ 有什麼用途？", "碳以 CO₂ 的形式排出；NADH 與 FADH₂ 把電子送到電子傳遞鏈，用於後續大量合成 ATP。循環中也直接產生少量 ATP。"], "b1-22-l07": ["在有氧呼吸中，O₂ 是在哪一個步驟直接參與反應？它扮演什麼角色？", "O₂ 在電子傳遞鏈的末端接受電子，並與 H⁺ 結合形成 H₂O，是最終電子接受者；它並不直接參與糖解或檸檬酸循環。"], "b1-22-l08": ["電子傳遞過程中，H⁺ 被送到哪裡？H⁺ 又是經由什麼回流，並驅動 ATP 形成？", "電子傳遞釋出的能量把 H⁺ 由基質送到膜間腔，形成質子梯度；H⁺ 再經內膜上的 ATP 合成酶流回基質，驅動 ADP 與 Pi 合成 ATP。"], "b1-22-l09": ["受質層次磷酸化與氧化磷酸化合成 ATP 的方式有什麼不同？", "受質層次磷酸化是酵素把受質上的磷酸基直接轉給 ADP，不需要質子梯度，如糖解與檸檬酸循環；氧化磷酸化則利用電子傳遞建立的質子梯度，經 ATP 合成酶合成 ATP。"], "b1-22-l10": ["粒線體與葉綠體都以化學滲透合成 ATP，兩者的 H⁺ 各在哪一側累積？", "粒線體的 H⁺ 累積在膜間腔，經 ATP 合成酶回到基質；葉綠體的 H⁺ 累積在類囊體腔，回流到葉綠體基質。"], "b1-22-l11": ["無氧呼吸與有氧呼吸都使用電子傳遞鏈，兩者最大的差別是什麼？", "最終電子接受者不同：有氧呼吸是 O₂；無氧呼吸是硫酸根、硝酸根或 CO₂ 等其他物質，例如硫酸根接受電子後還原成 H₂S。"], "b1-22-l12": ["發酵只產生 2 ATP，那麼把丙酮酸轉成乳酸或乙醇的步驟有什麼意義？", "這個步驟把 NADH 的電子交給有機物，再生 NAD⁺，讓糖解能繼續進行；2 ATP 來自糖解，丙酮酸轉換的步驟本身不產生 ATP。"], "b1-22-l13": ["酒精發酵中，實際接受 NADH 電子而還原成乙醇的分子是什麼？", "是乙醛。丙酮酸先脫羧形成乙醛與 CO₂，乙醛再接受 NADH 的電子還原成乙醇，同時再生 NAD⁺。"], "b1-22-l14": ["乳酸發酵和酒精發酵相比，丙酮酸的變化有什麼不同？", "乳酸發酵是丙酮酸直接接受 NADH 的電子還原成乳酸，保留三碳且不釋出 CO₂；酒精發酵則先脫羧釋出 CO₂，形成乙醛後再還原成乙醇。"], "b1-22-l15": ["比較有氧呼吸、無氧呼吸與發酵：哪些使用電子傳遞鏈？最終電子接受者各是什麼？", "有氧呼吸與無氧呼吸都使用電子傳遞鏈，最終電子接受者分別是 O₂ 與非 O₂ 的物質；發酵不使用電子傳遞鏈，由有機物接受 NADH 的電子以再生 NAD⁺。"], "b1-22-l16": ["金魚在缺氧的結冰池塘中，如何避免乳酸大量累積？", "一般器官產生的乳酸經血液送到肌肉，轉成乙醇，再由血液送到鰓排出體外；低溫降低代謝需求，儲存的肝醣則持續提供燃料。"], "b1-22-l17": ["「電子傳遞過程產生大量 ATP」這句話中，ATP 實際上是由什麼合成的？", "由 ATP 合成酶合成。電子傳遞釋出的能量建立質子梯度，H⁺ 經 ATP 合成酶回流時才驅動 ATP 合成，並不是電子直接變成 ATP。"]};

el('hint-toggle').setAttribute('aria-haspopup','dialog');el('hint-toggle').onclick=()=>{el('hint-toggle').setAttribute('aria-expanded','true');const d=openDialog('思考提示',`<p>${esc(STAGES[QI].hint)}</p>`);d.addEventListener('close',()=>el('hint-toggle').setAttribute('aria-expanded','false'),{once:true});};el('reference-btn').onclick=()=>openReferences(STAGES[QI]);el('question-learn').onclick=()=>{returnQuestion=true;navigate('learn',STAGES[QI].learn)};el('q-jump').onchange=e=>showQuestion(+e.target.value);el('prev-btn').onclick=()=>QI>0&&showQuestion(QI-1);el('skip-btn').onclick=()=>QI<STAGES.length-1?showQuestion(QI+1):navigate('done');el('check-btn').onclick=check;el('reset-btn').onclick=resetQuestion;el('finish-btn').onclick=()=>navigate('done');
el('shsel').innerHTML=[...new Set(DECK.map(d=>d[1]))].map(n=>`<option value="${n}">第 ${n} 頁 · ${esc(DECK.find(d=>d[1]===n)[2].slice(0,22))}</option>`).join('');el('shsel').onchange=e=>{showStopPlay();SI=DECK.findIndex(d=>d[1]===+e.target.value);showRender();};el('shprev').onclick=()=>showStep(-1);el('shnext').onclick=()=>showStep(1);el('shplay').onclick=()=>{if(SPLAY)showStopPlay();else{if(SI===DECK.length-1)SI=0;showRender();SPLAY=setInterval(()=>{if(SI>=DECK.length-1){showStopPlay();return;}SI++;showRender()},2600);el('shplay').textContent='⏸ 暫停';}};el('shfs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else el('show').requestFullscreen?.().catch(()=>{el('shfs').textContent='此瀏覽器不支援原生全螢幕'})};el('shclose').onclick=()=>navigate('intro');
el('theme-toggle').onclick=()=>{ST.theme=ST.theme==='dark'?'light':'dark';applyPreferences();save();};el('font-toggle').onclick=()=>{ST.font=(ST.font+1)%3;applyPreferences();save();fit();};function applyPreferences(){document.documentElement.dataset.theme=ST.theme;document.documentElement.style.setProperty('--text',[20,22,24][ST.font]+'px');document.documentElement.dataset.font=ST.font;el('theme-toggle').setAttribute('aria-pressed',String(ST.theme==='dark'));el('font-toggle').title='文字大小 '+[20,22,24][ST.font]+'px';}
document.addEventListener('fullscreenchange',fullscreenSync);document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const fs=document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation');if(fs){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();if(LI>0)showLearn(LI-1);}else if(e.key==='Escape')exitLearnFullscreen();return;}if(PAGE==='show'){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showStep(1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();showStep(-1);}else if(e.key==='Escape')navigate('intro');else if(e.key==='Home'){SI=0;showRender()}else if(e.key==='End'){SI=DECK.length-1;showRender()}return;}if(PAGE==='learn'&&el('flip')){if(e.key==='ArrowRight'){e.preventDefault();flipStop();flipShow(FI+1)}if(e.key==='ArrowLeft'){e.preventDefault();flipStop();flipShow(FI-1)}}});
el('learn-stage').addEventListener('contextmenu',e=>{if(document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation')){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1)}});
window.addEventListener('resize',fit);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){flipStop();showStopPlay();save();}});new ResizeObserver(fit).observe(el('bar'));
el('slide-text').onclick=()=>openDialog('原PPT第'+DECK[SI][1]+'頁原文',`<p>${esc(CONTENT.pptText[DECK[SI][1]])}</p>`);el('hero-image').src=IMG[DECK.filter(d=>d[1]===12).at(-1)[0]];el('video-external').href=VIDEO_URL;el('video-external').textContent='在 Google 雲端硬碟開啟影片 ↗';el('raw-animation').onclick=()=>{const d=openDialog('原始簡報動畫',`<video controls autoplay playsinline style="width:100%" src="${ANIMATION_SRC}"></video>`);d.addEventListener('close',()=>d.querySelector('video')?.pause(),{once:true});};applyPreferences();const start=['learn','play','done'].includes(ST.page)?ST.page:'intro';navigate(start);if(!saving)storageNotice();
</script></body></html>
