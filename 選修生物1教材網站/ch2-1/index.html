const CONTENT={"lessons": [{"id": "b1-21-l01", "t": "新陳代謝：物質與能量一起看", "src": "課本 P70；原簡報第 1、2、3、4 頁", "slide": 1, "figSpec": {"flip": [1, 2, 3, 4]}, "sec": "s1", "txt": "<h3>由轉變方向判斷代謝</h3><p><b>新陳代謝</b>包含生物體內物質與能量的轉換。</p><ul><li><b>同化代謝：</b>利用能量合成自身所需的物質，如葡萄糖與果糖合成蔗糖。</li><li><b>異化代謝：</b>分解物質，通常釋出能量，如氧化葡萄糖形成 CO₂ 與 H₂O。</li></ul><p>酵素協助兩類反應有效進行。不是只有分解反應才需要酵素或活化能；脫水與水解是教材的反應例子，不代表所有代謝都只有這兩種機制。</p><div class=\"quote\"><p>-1 新陳代謝與酵素<br>2<br>生物體內所有物質與能量的轉換過程稱為新陳代謝，簡稱<br>代謝，包含同化代謝與異化代謝，同化代謝是指生物體利用能<br>量將物質合成自身所需的化合物，如植物細胞利用能量，將葡<br>萄糖與果糖合成蔗糖。異化代謝則是指生物體將物質分解的過<br>程，通常伴隨能量的釋出，如細胞將葡萄糖氧化後產生 CO2 與 <br>H2O，以釋出能量提供生物體進行生理作用。無論是同化代謝<br>或異化代謝，這些化學反應都需要在酵素的協助下才能更有效<br>地進行。<br>2-1.1 活化能<br>化學反應進行時，需先提升反應物的能量狀態，達到足夠<br>的不穩定程度後才能引發反應。能有效發生反應的能量狀態被<br>稱為「活化」狀態，而幫助反應物達到此一狀態所需的最低能<br>量稱為「活化能」。在化學實驗室中，通常藉由加熱提升反應<br>物的能量狀態，以利反應的進行。然而加入催化劑可以降低反<br>應所需的活化能，因此亦可以加速化學反應的進行。<br>生物體要維持正常的構造與功能，必須由環境取得能量與養分，但這<br>些能量與養分未必能直接供應生物體使用，生物體如何將其轉變成可以利<br>用的形式呢？生物體分解養分產生能量，與汽車燃燒汽油產生動能相似，<br>主要產物都是 H2O、CO2 及能量，而細胞又如何利用這些養分分解後所釋<br>出的能量呢？<br>新陳代謝　metabolism<br>同化代謝　anabolism<br>異化代謝　catabolism <br>活化能　activation energy <br>2<br>70　選修生物 Ⅰ (全)</p><small>課本 P70完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>2-1 <br>新陳代謝與酵素<br>2-1.1 <br>活化能<br>2-1.2 <br>酵素的功能<br>2-1.3 <br>影響酵素活性的因素</p><small>原PPT第1頁完整文字</small></div><div class=\"quote\"><p>酵素<br>+<br>能量<br>OH<br>+<br>葡萄糖<br>HO<br>O<br>果<br>糖<br>蔗<br>糖<br>+<br>H<br>2<br>O<br>O<br>O<br>◇<br> <br>同化代謝 <br>：<br>2-1 <br>新陳代謝與酵素<br>酵素<br>+<br>6<br>O<br>2<br>+<br>能量<br>H<br>2<br>O<br>C<br>O<br>2<br>+<br>OH<br>葡萄糖<br>■<br> 脫水反應<br>■<br> 光合作用<br>補充<br>◆ 生物體內所有物質與能量的轉換過程稱為<br>新陳代謝<br>，簡稱代謝，<br>包含<br>同化<br>代謝<br>與<br>異化代謝</p><small>原PPT第2頁完整文字</small></div><div class=\"quote\"><p>◇<br> <br>異化<br>代謝 <br>：<br>◆ 生物體內所有物質與能量的轉換過程稱為<br>新陳代謝<br>，簡稱代謝，<br>包含<br>同化<br>代謝<br>與<br>異化代謝<br>2-1 <br>新陳代謝與酵素<br>+<br>能量<br>酵素<br>+<br>H<br>2<br>O<br>6<br>O<br>2<br>C<br>O<br>2<br>+<br>OH<br>葡萄糖<br>■<br> 水解<br>反應 ：<br>■<br> 呼吸作用<br>蔗<br>糖<br>+<br>H<br>2<br>O<br>能量<br>OH<br>+<br>+<br> 與分解酵素蛋白。</p><div class=\"quote\"><p>2-1.2 酵素的功能<br>酵素又稱為<br>，屬於有機催化劑，可降低化學反應所需的活化能，使反應加速進行。<br>例如：蔗糖溶液在常壓下經長時間加熱沸騰，達到發生反應所需的「活化」狀態才能緩慢<br>分解，但人體在進行消化作用時，藉由酵素的參與，可將蔗糖迅速分解成葡萄糖及果糖。<br>由於酵素能降低反應所需的活化能，因此可調控生物體內的化學反應速率（圖 2－1a）。<br>在酵素催化的反應中，反應物稱為受質，酵素可與受質結合的位置稱為活性位。當受<br>質與酵素活性位結合，酵素提供適當的排列空間，有利於反應進行，故酵素與受質的作用<br>具有專一性（圖2－1b）。受質在反應後轉變成產物，酵素可重複再與新的受質結合進行<br>下一次反應。<br> 圖 2－1　 a酵素的有無對活化能的影響。酵素可降低反應所需的活化能，因此可加速反應的進行；b酵素<br>的催化反應示意圖。<br>a<br>b<br>酵素　enzyme<br>受質　substrate<br>活性位　active site<br>第 2 章  細胞的代謝與能量　71</p><small>課本 P71完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>酵素<br>活性位<br>◆ 酵素的催化反應示意圖<br>酵素與受質結合的位置<br>受質<br>酵素<br>—<br>受<br>質複合物<br>當受質與酵素活性位結合，會誘導酵素的構形發生改變，提供受質適當的排列空間，有利於反應進行 <br>→專一性<br>產物<br>酵素<br>受質在催化反應後轉變成產物，酵素則恢復原狀<br>→可重複使用<br>2-1.2 <br>酵素的功能<br>配合<br>課本 <br>P71</p><small>原PPT第11頁完整文字</small></div>", "tb": [["BOOK2", "課本 P71 完整頁面"]]}, {"id": "b1-21-l05", "t": "鎖鑰與誘導契合：構形會改變", "src": "課本 P72；原簡報第 12 頁", "slide": 12, "figSpec": {"image": "models"}, "sec": "s2", "txt": "<h3>兩種模型解釋受質如何結合</h3><p><b>鎖鑰假說：</b>把活性位與受質比作原先已相合的鎖孔與鑰匙。</p><p><b>誘導契合學說：</b>受質初步結合會誘導酵素構形改變，使兩者進一步緊密結合。</p><p>圖中上下兩列應分別完整閱讀。模型的差異在於結合過程是否伴隨構形變化，兩者都用來說明受質與酵素的選擇性。</p><div class=\"quote\"><p>酵素活性位與受質間的關係<br>早期認為酵素的專一性就像鑰匙與鎖之間能緊密結合，稱為鎖鑰假說（圖a）。但近年來發現受質<br>與酵素的活性位結合，會誘導酵素的構形發生改變，兩者間才進一步的緊密結合，稱為誘導契合學說<br>（圖b）。<br>此外，有些物質具有與受質相似的結構，能夠占據酵素的活性位，阻止受質與酵素結合，此類物質<br>稱為「酵素競爭抑制劑」。例如：在抗菌治療中常用的磺胺類藥物就是一種酵素競爭抑制劑。細菌需要<br>合成葉酸以形成生存必須的化合物，在合成葉酸的過程中，會產生對胺苯甲酸（PABA），PABA 再與<br>酵素結合，最終合成葉酸。磺胺類藥物中的磺胺酸（SFA）結構與 PABA 的結構相似，也能與該酵素結<br>合，和 PABA 競爭相同酵素的活性位，使細菌無法合成足量的葉酸，進而造成細菌死亡，達到治療感染<br>的目的（圖c）。<br>知識補給站<br>鎖<br>鑰<br>假<br>說<br>誘<br>導<br>契<br>合<br>學<br>說<br>鎖鑰假說　lock and key hypothesis<br>誘導契合學說　induced fit theory<br> a鎖鑰假說；b誘導<br>契合學說；cPABA<br>為合成葉酸所必須，<br>磺胺酸（SFA ）的結<br>構與PABA 的結構類<br>似，在細菌內會干擾<br>葉酸的合成。<br>72　選修生物 Ⅰ (全)</p><small>課本 P72完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>  <br>知識補給站<br>酵素活性位與受質間的關係<br>◆ 早期 ：認為酵素的專一性就像鑰匙與鎖之間能緊密結合，稱為<br>鎖鑰假說<br>鎖鑰假說<br>誘導契合學說<br>◆ <br>近年 ：發現受質與酵素的活性位結合，會誘導酵素的構形發生改變，兩者間才進一步的緊密結合，稱為<br>誘導契合學說<br>。<br>酵素和受質間<br>緊密結合<br>受質<br>和<br>酵素結合後會誘導酵素的構形發生改變才進一步緊密結合<br>配合<br>課本 <br>P72</p><small>原PPT第12頁完整文字</small></div>", "tb": [["BOOK3", "課本 P72 完整頁面"]]}, {"id": "b1-21-l06", "t": "競爭抑制：相似構造占據活性位", "src": "課本 P72；原簡報第 13 頁", "slide": 13, "figSpec": {"image": "competition"}, "sec": "s3", "txt": "<h3>把正常路徑與受阻路徑相比</h3><p>課本以 PABA 與 SFA 的相似構造說明：抑制劑能與受質競爭活性位，減少正常產物的形成。</p><ul><li>上列：正常受質參與，形成葉酸。</li><li>下列：SFA 占據活性位，葉酸合成受阻。</li></ul><p class=\"scope-note\">生物化學補充：抗菌磺胺藥競爭抑制葉酸合成途徑的酵素，通常描述為抑制細菌生長。PABA 是此途徑所利用的前驅物；不要推論成藥物能直接破壞所有細菌。<a href=\"https://pubmed.ncbi.nlm.nih.gov/10329458/\" target=\"_blank\" rel=\"noopener\">研究來源</a></p><div class=\"quote\"><p>酵素活性位與受質間的關係<br>早期認為酵素的專一性就像鑰匙與鎖之間能緊密結合，稱為鎖鑰假說（圖a）。但近年來發現受質<br>與酵素的活性位結合，會誘導酵素的構形發生改變，兩者間才進一步的緊密結合，稱為誘導契合學說<br>（圖b）。<br>此外，有些物質具有與受質相似的結構，能夠占據酵素的活性位，阻止受質與酵素結合，此類物質<br>稱為「酵素競爭抑制劑」。例如：在抗菌治療中常用的磺胺類藥物就是一種酵素競爭抑制劑。細菌需要<br>合成葉酸以形成生存必須的化合物，在合成葉酸的過程中，會產生對胺苯甲酸（PABA），PABA 再與<br>酵素結合，最終合成葉酸。磺胺類藥物中的磺胺酸（SFA）結構與 PABA 的結構相似，也能與該酵素結<br>合，和 PABA 競爭相同酵素的活性位，使細菌無法合成足量的葉酸，進而造成細菌死亡，達到治療感染<br>的目的（圖c）。<br>知識補給站<br>鎖<br>鑰<br>假<br>說<br>誘<br>導<br>契<br>合<br>學<br>說<br>鎖鑰假說　lock and key hypothesis<br>誘導契合學說　induced fit theory<br> a鎖鑰假說；b誘導<br>契合學說；cPABA<br>為合成葉酸所必須，<br>磺胺酸（SFA ）的結<br>構與PABA 的結構類<br>似，在細菌內會干擾<br>葉酸的合成。<br>72　選修生物 Ⅰ (全)</p><small>課本 P72完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>  <br>知識補給站<br>酵素活性位與受質間的關係<br>◆ 有些物質具有與受質相似的結構，能夠<br>占據酵素的活性位<br>，阻止受質與酵素結合，此類物質稱為<br>酵素競爭抑制劑<br>酵素<br>細菌合成葉酸的過程<br>P<br>PABA<br>G<br>對胺苯甲酸（<br>PABA<br>）<br>PABA<br>酵素<br>P<br>G<br>SFA<br>加入 <br>SFA<br> 使葉酸合成受阻<br>SFA<br>磺胺酸（<br>SFA<br>）<br>葉酸<br>配合<br>課本 <br>P72</p><small>原PPT第13頁完整文字</small></div>", "tb": [["BOOK3", "課本 P72 完整頁面"]]}, {"id": "b1-21-l07", "t": "溫度：碰撞增加與構形受損的拉鋸", "src": "課本 P73；原簡報第 14、15 頁", "slide": 14, "figSpec": {"image": "temperature"}, "sec": "s4", "txt": "<h3>最適溫度因酵素而異</h3><p>適當範圍內，升溫增加分子碰撞及有效結合，反應加快；超過適當範圍，高溫使構形受損，活性下降。</p><p>圖2-2比較人類與嗜熱菌的酵素，<b>峰值的位置不同</b>。不能把人體的適當溫度套用到全部生物。</p><p>降低溫度通常使反應暫時變慢；高溫變性後是否能恢復，取決於酵素與處理條件，不寫成所有酵素必然永久失活。</p><p>圖的縱軸以每種酵素自身最高反應速率為100%，不能據此比較兩種酵素的絕對最大速率。</p><div class=\"quote\"><p>2-1.3 影響酵素活性的因素<br>酵素活性位的構形會影響催化的活性，而酵素的成分大多為蛋白質，故會影響蛋白質<br>構形的因子，例如: 溫度、酸鹼度、重金屬及輔因子等都可能會影響酵素的催化活性。<br>在適當的溫度範圍內，酵素催化反應的速率會隨著溫度上升而增加，因溫度上升會加<br>速分子間的碰撞，使受質與酵素結合的機率增加，而使反應加速。當溫度超過適當的範<br>圍時，高溫會改變酵素的構形，使受質無法與酵素有效的結合，酵素因而失去催化反應<br>的能力，縱使某些微生物可以生活在高溫環境中，其酵素在溫度過高時也會失去活性<br>（圖 2－2）。<br>酵素的構形也會受到酸鹼度的影響，因此酵素需在適合的 pH 值範圍內才具有催化能<br>力。大部分酵素適合在接近中性的環境下作用，如人體的唾液澱粉 ；有些酵素在酸性環<br>境下才有活性，如人體的胃蛋白 ；有些酵素則適合在弱鹼性環境下作用，如人體腸道中的<br>胰蛋白<br>（圖 2－3）。<br>胰蛋白<br>　trypsin<br>唾液澱粉<br>　ptyalin<br>胃蛋白<br>　pepsin<br> 圖 2－2　溫度對酵素活性的影響<br> 圖 2－3　pH 值對酵素活性的影響<br>適當的溫度範圍內，酵素的活性隨著溫度上<br>升而增加，當溫度高於此範圍時，酵素的活<br>性會迅速下降。<br>大部分的酵素如唾液澱粉<br>在接近中性的<br>環境下有最佳的活性，但人體的胃蛋白<br>與胰蛋白<br>分別在 pH 值約 2.0 與 8.0 時有<br>最佳的活性。<br>e：圖 2－2 與圖 2－3 縱坐標的反應速率是以各酵素最高反應速率當作 100%。<br>第 2 章  細胞的代謝與能量　73</p><small>課本 P73完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>◆ 酵素的催化活性是由活性位的構形決定，而酵素的成分大多為蛋白質，故會<br>影響蛋白質構形的因子<br>，<br>例如 ：<br>溫度<br>、<br>酸鹼度<br>、<br>重金屬<br>及<br>輔<br>因子<br>等<br>都可能會影響酵素的催化活性<br>2-1.3 <br>影響酵素活性的因素<br>配合<br>課本 <br>P73</p><small>原PPT第14頁完整文字</small></div><div class=\"quote\"><p>溫度 <br>(℃)<br>反應速率<br>(   )<br>20<br>40<br>60<br>80<br>100<br>100<br>0<br>溫度<br>人類的酵素<br>嗜熱菌的酵素<br>酵素的蛋白質構形受到高溫破壞<br>酵素作用的最適溫度，依酵素種類不同而異<br>2-1.3 <br>影響酵素活性的因素<br>配合<br>課本 <br>P73<br>%<br>在一定的溫度範圍內，酵素活性隨溫度的上升而增加</p><small>原PPT第15頁完整文字</small></div>", "tb": [["BOOK4", "課本 P73 完整頁面"]]}, {"id": "b1-21-l08", "t": "pH：峰值要連結作用環境", "src": "課本 P73；原簡報第 16 頁", "slide": 16, "figSpec": {"image": "ph"}, "sec": "s4", "txt": "<h3>圖2-3的三條曲線</h3><ul><li><b>胃蛋白酶：</b>在酸性範圍較活躍，圖示最適 pH 約2。</li><li><b>唾液澱粉酶：</b>在接近中性範圍較活躍。</li><li><b>胰蛋白酶：</b>在弱鹼性範圍較活躍，圖示最適 pH 約8。</li></ul><p>pH 影響活性位的電荷與構形，離開適合範圍會降低活性；活性降低不必然都代表不可逆變性。</p><p>本圖以各酵素自己的最高速率為100%，重點是比較最適環境，不是比較總催化能力。</p><div class=\"quote\"><p>2-1.3 影響酵素活性的因素<br>酵素活性位的構形會影響催化的活性，而酵素的成分大多為蛋白質，故會影響蛋白質<br>構形的因子，例如: 溫度、酸鹼度、重金屬及輔因子等都可能會影響酵素的催化活性。<br>在適當的溫度範圍內，酵素催化反應的速率會隨著溫度上升而增加，因溫度上升會加<br>速分子間的碰撞，使受質與酵素結合的機率增加，而使反應加速。當溫度超過適當的範<br>圍時，高溫會改變酵素的構形，使受質無法與酵素有效的結合，酵素因而失去催化反應<br>的能力，縱使某些微生物可以生活在高溫環境中，其酵素在溫度過高時也會失去活性<br>（圖 2－2）。<br>酵素的構形也會受到酸鹼度的影響，因此酵素需在適合的 pH 值範圍內才具有催化能<br>力。大部分酵素適合在接近中性的環境下作用，如人體的唾液澱粉 ；有些酵素在酸性環<br>境下才有活性，如人體的胃蛋白 ；有些酵素則適合在弱鹼性環境下作用，如人體腸道中的<br>胰蛋白<br>（圖 2－3）。<br>胰蛋白<br>　trypsin<br>唾液澱粉<br>　ptyalin<br>胃蛋白<br>　pepsin<br> 圖 2－2　溫度對酵素活性的影響<br> 圖 2－3　pH 值對酵素活性的影響<br>適當的溫度範圍內，酵素的活性隨著溫度上<br>升而增加，當溫度高於此範圍時，酵素的活<br>性會迅速下降。<br>大部分的酵素如唾液澱粉<br>在接近中性的<br>環境下有最佳的活性，但人體的胃蛋白<br>與胰蛋白<br>分別在 pH 值約 2.0 與 8.0 時有<br>最佳的活性。<br>e：圖 2－2 與圖 2－3 縱坐標的反應速率是以各酵素最高反應速率當作 100%。<br>第 2 章  細胞的代謝與能量　73</p><small>課本 P73完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>酸鹼<br>度<br>2-1.3 <br>影響酵素活性的因素<br>配合<br>課本 <br>P73</p><small>原PPT第16頁完整文字</small></div>", "tb": [["BOOK4", "課本 P73 完整頁面"]]}, {"id": "b1-21-l09", "t": "輔因子：有些酵素需要搭檔", "src": "課本 P74；原簡報第 17、18 頁", "slide": 17, "figSpec": {"image": "cofactor"}, "sec": "s5", "txt": "<h3>辨認酵素、受質與輔因子</h3><p>有些酵素需要非蛋白質成分協助。課本圖2-4示範：輔因子結合後形成適當構形，受質才能有效結合。</p><ul><li><b>金屬離子：</b>如 Zn²⁺、Ca²⁺、Mn²⁺。</li><li><b>有機輔因子：</b>稱為輔酶，維生素及其衍生物是常見例子。</li></ul><p>不是所有酵素都需要輔因子，也不是所有維生素都是輔因子。輔因子的作用不只調整構形，也可能傳遞電子或化學基團。</p><div class=\"quote\"><p>酵素的作用有時需要輔因子的協助，許多金屬離子如鋅（Zn<br>2＋）、<br>鈣（Ca<br>2＋）或錳（Mn<br>2＋）等離子都是常見的輔因子，有些酵素需要與輔<br>因子結合之後，才能形成正確的構形與受質結合（ 圖 2－4 ）。然而有<br>些重金屬離子，如汞（Hg<br>2＋）、鉛（Pb<br>2＋）及鎘（Cd<br>2＋）等離子會與酵<br>素結合，使酵素產生永久性的變形而失去活性。<br>除了金屬離子外，許多有機物也可作為輔因子，稱為輔<br>，如<br>維生素 C 與維生素 B 群等。有些輔 <br>在化學反應中接受電子，協<br>助酵素持續作用，例如：呼吸作用中的輔  NAD<br>＋ 與光合作用中的<br>輔 <br>NADP<br>＋，可接受電子而分別還原成 NADH 與 NADPH，協助<br>呼吸作用與光合作用的酵素持續進行反應。<br> 圖 2－4　輔因子可以活化酵素<br>輔因子　cofactor<br>輔<br>　coenzyme<br>74　選修生物 Ⅰ (全)</p><small>課本 P74完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>輔因子<br>◆<br> 有些酵素需要輔因子的協助<br>◆<br> 輔因子包括 ：<br>①<br> <br>金屬離子 <br>：如<br>鋅<br>離子 <br>(Zn<br>2+<br>)<br> <br>、鈣離子 <br>(Ca<br>2+<br>)<br>、錳離子<br> (Mn<br>2+<br>)<br> <br>②<br> <br>輔酶 <br>：<br>非<br>蛋白質有機<br>物<br>，<br>如<br>維生素 <br>C<br> 與維生素 <br>B<br> 群的衍生物<br>2-1.3 <br>影響酵素活性的因素<br>配合<br>課本 <br>P74</p><small>原PPT第17頁完整文字</small></div><div class=\"quote\"><p>輔因子<br>產物<br>酵素<br>受質<br>例如 <br>：<br>有些<br>酵素需與輔因子結合形成正確構形，才能與受質結合<br>2-1.3 <br>影響酵素活性的因素<br>配合<br>課本 <br>P74</p><small>原PPT第18頁完整文字</small></div>", "tb": [["BOOK5", "課本 P74 完整頁面"]]}, {"id": "b1-21-l10", "t": "電子載體與重金屬：協助和干擾", "src": "課本 P74；原簡報第 19、20 頁", "slide": 19, "figSpec": {"flip": [19, 20]}, "sec": "s5", "txt": "<h3>同樣結合，效果可能相反</h3><p>NAD⁺、NADP⁺ 可接受電子，形成 NADH、NADPH，協助代謝中的氧化還原反應。</p><p class=\"scope-note\">電子式補充：半反應應寫為 NAD⁺ + 2e⁻ + H⁺ → NADH；NADP⁺ 同理。原簡報第19頁的電子／氫離子數未配平，原文與原動畫保留，讀式時以此補充為準。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26838/\" target=\"_blank\" rel=\"noopener\">來源說明</a></p><p>課本列舉 Hg²⁺、Pb²⁺、Cd²⁺ 與酵素結合，造成構形改變而失去活性。不要把所有金屬離子都視為有益的輔因子，也不要把所有酵素都視為必然受同一離子影響。</p><div class=\"quote\"><p>酵素的作用有時需要輔因子的協助，許多金屬離子如鋅（Zn<br>2＋）、<br>鈣（Ca<br>2＋）或錳（Mn<br>2＋）等離子都是常見的輔因子，有些酵素需要與輔<br>因子結合之後，才能形成正確的構形與受質結合（ 圖 2－4 ）。然而有<br>些重金屬離子，如汞（Hg<br>2＋）、鉛（Pb<br>2＋）及鎘（Cd<br>2＋）等離子會與酵<br>素結合，使酵素產生永久性的變形而失去活性。<br>除了金屬離子外，許多有機物也可作為輔因子，稱為輔<br>，如<br>維生素 C 與維生素 B 群等。有些輔 <br>在化學反應中接受電子，協<br>助酵素持續作用，例如：呼吸作用中的輔  NAD<br>＋ 與光合作用中的<br>輔 <br>NADP<br>＋，可接受電子而分別還原成 NADH 與 NADPH，協助<br>呼吸作用與光合作用的酵素持續進行反應。<br> 圖 2－4　輔因子可以活化酵素<br>輔因子　cofactor<br>輔<br>　coenzyme<br>74　選修生物 Ⅰ (全)</p><small>課本 P74完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>例如 <br>：<br>呼吸作用<br>的輔酶 <br>NAD<br>+<br> <br>與<br>光合作用<br>中的輔<br>酶 <br>NADP<br>+<br> <br>，<br>可<br>接受電子<br>而分別還原<br>成 <br>NADH <br>與 <br>NADPH<br> ，<br>協助<br>呼吸作用與光合作用的酵素持續進行反應<br>NAD<br>+<br> <br>+e<br>-<br> +2H<br>+<br> → NADH<br>呼吸作用的輔酶<br>NADP<br>+<br> <br>+e<br>-<br> +2H<br>+<br> → NADPH<br>光合作用的輔酶<br>2-1.3 <br>影響酵素活性的因素<br>配合<br>課本 <br>P74</p><small>原PPT第19頁完整文字</small></div><div class=\"quote\"><p>◆ 有些重金屬離子，如汞（<br>Hg<br>2<br>＋<br>）、鉛（<br>Pb<br>2<br>＋<br>）<br>及鎘（<br>Cd<br>2<br>＋<br>）<br>等離子會與酵素結合，使酵素產生永久性的變形而失去活性<br>重金屬<br>2-1.3 <br>影響酵素活性的因素<br>配合<br>課本 <br>P74</p><small>原PPT第20頁完整文字</small></div>", "tb": [["BOOK5", "課本 P74 完整頁面"]]}, {"id": "b1-21-l11", "t": "整合判斷：把門檻、構形與環境串起來", "src": "課本 P74；原簡報第 21、22、23、24、25 頁", "slide": 21, "figSpec": {"image": "environment"}, "sec": "s5", "txt": "<h3>面對新情境的三個問題</h3><ol><li>改變的是活化能，還是反應前後能量差？</li><li>受質能否有效結合活性位？</li><li>溫度、pH、輔因子或抑制劑提供什麼條件？</li></ol><p>清潔劑選酵素必須同時滿足溫度與 pH。輔因子可協助不同酵素，但酵素仍會選擇適合的輔因子，不能推成任一輔因子可搭配所有酵素。</p><p>原題三依原簡報答案 A 計分。原解析「輔因子無專一性」是相較受質專一性的簡化說法，導讀採上述較精確界線。</p><div class=\"quote\"><p>酵素的作用有時需要輔因子的協助，許多金屬離子如鋅（Zn<br>2＋）、<br>鈣（Ca<br>2＋）或錳（Mn<br>2＋）等離子都是常見的輔因子，有些酵素需要與輔<br>因子結合之後，才能形成正確的構形與受質結合（ 圖 2－4 ）。然而有<br>些重金屬離子，如汞（Hg<br>2＋）、鉛（Pb<br>2＋）及鎘（Cd<br>2＋）等離子會與酵<br>素結合，使酵素產生永久性的變形而失去活性。<br>除了金屬離子外，許多有機物也可作為輔因子，稱為輔<br>，如<br>維生素 C 與維生素 B 群等。有些輔 <br>在化學反應中接受電子，協<br>助酵素持續作用，例如：呼吸作用中的輔  NAD<br>＋ 與光合作用中的<br>輔 <br>NADP<br>＋，可接受電子而分別還原成 NADH 與 NADPH，協助<br>呼吸作用與光合作用的酵素持續進行反應。<br> 圖 2－4　輔因子可以活化酵素<br>輔因子　cofactor<br>輔<br>　coenzyme<br>74　選修生物 Ⅰ (全)</p><small>課本 P74完整可擷取原文；字形缺漏請看原頁</small></div><div class=\"quote\"><p>  <br>Question<br>1. <br>右圖是某化學反應的能量變化，有關酵素參與生化反應的敘述，下列哪些正確<br>？　<br>(<br>A)<br>分解反應的受質需要活化能，合成反應則不<br>需要　<br>(<br>B)<br>要加速反應可給予反應物能量或加入酵素降低反應<br>活化能　<br>(<br>C)<br>酵素參與後所降低的能量為<br>甲 <br>-<br> <br>乙<br>　<br><br>(<br>D)<br>酵素可減少丙的能量，加速<br>反應　<br>(<br>E)<br>酵素參與反應<br>的<br><br>活化能<br>是乙＋丙。</p><small>原PPT第21頁完整文字</small></div><div class=\"quote\"><p>  <br>Question<br>解答 <br>：<br>(<br>B)(C)<br>解析 <br>：<br>(<br>A)<br>合成反應、分解反應皆需要活化能。<br>(D)<br>酵素影響的是活化能，丙為反應物及產物的能量差，不會改變。<br>(E)<br>無酵素參與的活化能為甲，有酵素參與的活化能為乙。</p><small>原PPT第22頁完整文字</small></div><div class=\"quote\"><p>  <br>Question<br>2. <br>研究者分析多種脂肪酵素的活性，在不同溫度下結果如左下圖，不同 <br>pH <br>值下如右下圖。廚房清潔劑中常添加脂肪酵素以分解油脂。為使常溫下鹼性廚房清潔劑的效能最佳化，下列何者最適合添加在本清潔劑中？<br>(A)<br>甲　<br>(<br>B)<br>乙　<br>(<br>C)<br>丙　<br>(<br>D)<br>丁　<br>(<br>E)<br>戊。</p><small>原PPT第23頁完整文字</small></div><div class=\"quote\"><p>  <br>Question<br>解答 <br>：<br>(<br>D)<br>解析 ：<br>由題圖<br>中可知，酵素乙、丁的最佳反應溫度約在正常室溫範圍，而丁的最佳<br>反應 <br>p<br>Ｈ 值<br>約為 <br>8<br>，符合鹼性條件，故選丁。</p><small>原PPT第24頁完整文字</small></div><div class=\"quote\"><p>  <br>Question<br>3. <br>下列有關輔因子的敘述何者正確<br>？　<br>(<br>A)<br> <br>Mn<br>2<br>＋<br>、<br>Zn<br>2<br>＋ <br>等金屬離子是常見的輔<br>因子　<br>(<br>B)<br>所有的維生素都可擔任輔<br>因子　<br>(<br>C)<br>輔因子與酵素相同，具有專一<br>性　<br>(<br>D)<br>有機輔因子無法重複作用，反應後即分解。<br>解答 ：<br>(<br>A)<br>解析 ：<br>(<br>B)<br>維生素 <br>B<br> 群、維生素 <br>C<br> 可作為輔因子，但並非全部維生素皆可作為輔因子。<br>(C)<br>輔因子無專一性。 <br>(D)<br>輔因子可重複利用。</p><small>原PPT第25頁完整文字</small></div>", "tb": [["BOOK5", "課本 P74 完整頁面"]]}], "questions": [{"t": "同化與異化：反應分類", "q": "把反應與能量特徵配到對應的代謝類別。", "sub": "課本 P70；原PPT第2–4頁", "learn": 0, "tag": "metabolism", "hint": "分別檢查物質方向與能量轉換，不用是否需要酵素來區分。", "why": "同化利用能量合成；異化分解物質且通常釋出能量。兩者都可能需要酵素。", "kind": "drag", "slots": [{"id": "s0", "label": "同化 · 反應例子"}, {"id": "s1", "label": "同化 · 物質方向"}, {"id": "s2", "label": "同化 · 能量"}, {"id": "s3", "label": "異化 · 反應例子"}, {"id": "s4", "label": "異化 · 物質方向"}, {"id": "s5", "label": "異化 · 能量"}], "pieces": [{"id": "a0", "label": "葡萄糖與果糖合成蔗糖"}, {"id": "a1", "label": "由簡單物質合成所需物質"}, {"id": "a2", "label": "利用能量進行合成"}, {"id": "a3", "label": "氧化葡萄糖形成 CO₂、H₂O"}, {"id": "a4", "label": "分解物質"}, {"id": "a5", "label": "通常釋出能量"}, {"id": "a6", "label": "反應永遠不需要酵素"}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3", "s4": "a4", "s5": "a5"}, "pre": {"s0": "a0"}, "fig": null, "refs": [{"src": "BOOK1", "cap": "課本 P70；原PPT第2–4頁"}]}, {"kind": "drag", "labelFig": "lf_energy", "lfStack": false, "slots": [{"id": "noenz", "label": "", "x": 25.74, "y": 18.3, "w": 17.02, "h": 15.18}, {"id": "enz", "label": "", "x": 34.77, "y": 77.01, "w": 17.02, "h": 14.73}, {"id": "sub", "label": "", "x": 17.33, "y": 58.93, "w": 6.93, "h": 7.14}, {"id": "prod", "label": "", "x": 89.81, "y": 73.88, "w": 7.35, "h": 5.8}, {"id": "lg1", "label": "", "x": 87.18, "y": 17.86, "w": 11.34, "h": 6.25}, {"id": "lg2", "label": "", "x": 87.39, "y": 35.94, "w": 11.76, "h": 5.8}], "pieces": [{"id": "p0", "label": "無酵素存在時所需的活化能"}, {"id": "p1", "label": "有酵素存在時所需的活化能"}, {"id": "p2", "label": "受質"}, {"id": "p3", "label": "產物"}, {"id": "p4", "label": "無酵素存在"}, {"id": "p5", "label": "有酵素存在"}, {"id": "x0", "label": "反應釋放的能量"}, {"id": "x1", "label": "酵素本身的能量"}], "sol": stion\n2. \n研究者分析多種脂肪酵素的活性，在不同溫度下結果如左下圖，不同 \npH \n值下如右下圖。廚房清潔劑中常添加脂肪酵素以分解油脂。為使常溫下鹼性廚房清潔劑的效能最佳化，下列何者最適合添加在本清潔劑中？\n(A)\n甲　\n(\nB)\n乙　\n(\nC)\n丙　\n(\nD)\n丁　\n(\nE)\n戊。", "24": "  \nQuestion\n解答 \n：\n(\nD)\n解析 ：\n由題圖\n中可知，酵素乙、丁的最佳反應溫度約在正常室溫範圍，而丁的最佳\n反應 \np\nＨ 值\n約為 \n8\n，符合鹼性條件，故選丁。", "25": "  \nQuestion\n3. \n下列有關輔因子的敘述何者正確\n？　\n(\nA)\n \nMn\n2\n＋\n、\nZn\n2\n＋ \n等金屬離子是常見的輔\n因子　\n(\nB)\n所有的維生素都可擔任輔\n因子　\n(\nC)\n輔因子與酵素相同，具有專一\n性　\n(\nD)\n有機輔因子無法重複作用，反應後即分解。\n解答 ：\n(\nA)\n解析 ：\n(\nB)\n維生素 \nB\n 群、維生素 \nC\n 可作為輔因子，但並非全部維生素皆可作為輔因子。\n(C)\n輔因子無專一性。 \n(D)\n輔因子可重複利用。"}};

const EXPL={"b1-21-l01": "<h3>新陳代謝：物質與能量的轉換<\/h3><p>生物體內<b>所有物質與能量的轉換過程<\/b>稱為<b>新陳代謝<\/b>，簡稱代謝。<\/p><h3>兩大類<\/h3><ul><li><b>同化代謝<\/b>：生物體利用能量，把物質合成自身所需的化合物，例如植物細胞用能量把葡萄糖與果糖合成蔗糖（課本圖：脫水反應、光合作用）。<\/li><li><b>異化代謝<\/b>：把物質分解，通常伴隨能量釋出，例如細胞氧化葡萄糖產生 CO₂ 與 H₂O，釋出能量供生理作用使用。<\/li><\/ul><h3>共同點<\/h3><p>無論同化或異化，這些化學反應都需要在<b>酵素<\/b>的協助下才能更有效地進行。課本以汽車燃燒汽油作類比：生物體分解養分的主要產物同樣是 H₂O、CO₂ 與能量。<\/p>", "b1-21-l02": "<h3>活化能：反應啟動的門檻<\/h3><p>化學反應要發生，反應物必須先提升能量狀態，達到足夠<b>不穩定<\/b>的程度，這種能有效反應的狀態稱為「<b>活化<\/b>」狀態；幫助反應物達到這個狀態所需的<b>最低能量<\/b>稱為<b>活化能<\/b>。<\/p><h3>兩種降低門檻的方法<\/h3><ul><li>化學實驗室常用<b>加熱<\/b>提升反應物的能量。<\/li><li>加入<b>催化劑<\/b>可以降低反應所需的活化能，一樣能加速反應。<\/li><\/ul><h3>讀圖的方法<\/h3><p>橫軸是反應進行，縱軸是能量。先找受質的起點，再找曲線最高點（山頂）；活化能是「起點到山頂」的高度，不是受質與產物之間的能量差。<\/p>", "b1-21-l03": "<h3>讀圖 2－1a：有無酵素<\/h3><p><b>酵素<\/b>又稱<b>酶<\/b>，屬於有機催化劑，可降低反應所需的活化能，使反應加速。<\/p><h3>比較兩條曲線<\/h3><ul><li><b>無酵素<\/b>：山頂較高，需要較多能量。<\/li><li><b>有酵素<\/b>：山頂較低，反應較快。<\/li><li>受質與產物間的<b>能量差不變<\/b>：酵素只改變反應的快慢，不改變反應的方向或總能量變化。<\/li><\/ul><h3>課本例子<\/h3><p>蔗糖溶液在常壓下長時間加熱沸騰才會緩慢分解；但人體消化時有酵素參與，蔗糖可以迅速分解成葡萄糖與果糖。<\/p>", "b1-21-l04": "<h3>讀圖 2－1b：酵素催化循環<\/h3><p>在酵素催化的反應中，反應物稱為<b>受質<\/b>，酵素可與受質結合的位置稱為<b>活性位<\/b>。<\/p><h3>四個步驟<\/h3><ul><li>受質與酵素的<b>活性位<\/b>結合。<\/li><li>形成酵素—受質複合物，酵素提供適當的排列空間，有利於反應。<\/li><li>受質轉變成<b>產物<\/b>，產物離開。<\/li><li>酵素可<b>重複<\/b>再與新的受質結合，進行下一次反應。<\/li><\/ul><h3>專一性<\/h3><p>只有形狀與活性位相合的受質才能結合，所以酵素與受質的作用具有<b>專一性<\/b>。專一性不是只能用一次；酵素在一次催化中不被消耗（但細胞仍會合成與分解酵素蛋白）。<\/p>", "b1-21-l05": "<h3>知識補給站：鎖鑰與誘導契合<\/h3><p>兩個模型都在解釋「受質怎麼和活性位結合」。<\/p><h3>兩種說法<\/h3><ul><li><b>鎖鑰假說<\/b>（圖 a）：早期認為酵素的專一性像<b>鑰匙與鎖<\/b>，原本就能緊密結合。<\/li><li><b>誘導契合學說<\/b>（圖 b）：近年發現，受質與活性位結合時會<b>誘導酵素的構形改變<\/b>，兩者才進一步緊密結合。<\/li><\/ul><h3>比較重點<\/h3><p>差別在於結合過程<b>是否伴隨酵素構形的改變<\/b>。圖上列和下列要分別完整閱讀。<\/p>", "b1-21-l06": "<h3>讀圖 2－1c：競爭抑制<\/h3><p>有些物質的結構與受質相似，能占據酵素的活性位，阻止受質與酵素結合，這種物質稱為<b>酵素競爭抑制劑<\/b>。<\/p><h3>課本的例子：磺胺類藥物<\/h3><ul><li>細菌需要合成<b>葉酸<\/b>來形成生存必須的化合物；合成過程中會產生<b>對胺苯甲酸（PABA）<\/b>，PABA 再與酵素結合，最終合成葉酸。<\/li><li>磺胺類藥物中的<b>磺胺酸（SFA）<\/b>結構與 PABA 相似，也能與該酵素結合，和 PABA<b>競爭同一個活性位<\/b>。<\/li><li>使細菌無法合成足量葉酸，達到治療感染的目的。<\/li><\/ul><h3>看圖<\/h3><p>上列是正常路徑（PABA 結合 → 葉酸）；下列是 SFA 占據活性位，葉酸合成受阻。通常描述為「抑制細菌生長」，不要推論成藥物能直接破壞所有細菌。<\/p>", "b1-21-l07": "<h3>影響酵素活性的因素<\/h3><p>酵素的成分大多是<b>蛋白質<\/b>，所以會影響蛋白質構形的因子，例如<b>溫度、酸鹼度、重金屬與輔因子<\/b>等，都可能影響酵素的催化活性。<\/p><h3>讀圖 2－2：溫度<\/h3><ul><li>在適當範圍內，溫度上升使分子碰撞加快，受質與酵素<b>結合機率增加<\/b>，反應加速。<\/li><li>溫度超過適當範圍，高溫會<b>改變酵素的構形<\/b>，受質無法有效結合，酵素失去催化能力。<\/li><li>縱使有些微生物生活在高溫環境，它們的酵素在溫度過高時也會失去活性。<\/li><\/ul><h3>讀圖提醒<\/h3><p>圖中縱軸是以<b>各酵素自己的最高速率為 100%<\/b>，所以不能拿來比較兩種酵素的絕對速率；也不要把人體的適當溫度套用到所有生物。<\/p>", "b1-21-l08": "<h3>讀圖 2－3：pH 與酵素<\/h3><p>酵素的構形也受酸鹼度影響，所以需要在適合的 pH 範圍內才有催化能力。<\/p><h3>三條曲線<\/h3><ul><li><b>唾液澱粉酶<\/b>：適合在接近<b>中性<\/b>的環境下作用（大部分酵素屬於這類）。<\/li><li><b>胃蛋白酶<\/b>：在<b>酸性<\/b>環境下才有活性，最適 pH 約 2.0。<\/li><li><b>胰蛋白酶<\/b>（腸道）：適合<b>弱鹼性<\/b>環境，最適 pH 約 8.0。<\/li><\/ul><h3>連結作用環境<\/h3><p>胃液是酸性的，所以胃蛋白酶適應酸性；小腸環境偏弱鹼性，所以胰蛋白酶適應弱鹼性。同樣以各自最高速率為 100%，重點是比較「最適環境」，不是比較酵素的催化能力。<\/p>", "b1-21-l09": "<h3>讀圖 2－4：輔因子<\/h3><p>酵素的作用有時需要<b>輔因子<\/b>的協助；有些酵素要與輔因子結合之後，才能形成正確的構形，與受質結合。<\/p><h3>兩類輔因子<\/h3><ul><li><b>金屬離子<\/b>：鋅（Zn²⁺）、鈣（Ca²⁺）、錳（Mn²⁺）等。<\/li><li><b>有機物<\/b>：稱為<b>輔酶<\/b>，如維生素 C 與維生素 B 群。<\/li><\/ul><h3>提醒<\/h3><p>不是所有酵素都需要輔因子，也不是所有維生素都是輔因子。輔因子除了調整構形，也可能傳遞電子或化學基團。<\/p>", "b1-21-l10": "<h3>同樣結合，效果可能相反<\/h3><p>金屬離子與酵素結合，有的幫忙、有的干擾。<\/p><h3>協助：電子載體<\/h3><ul><li>有些輔酶在化學反應中<b>接受電子<\/b>，協助酵素持續作用。<\/li><li>呼吸作用的輔酶 <b>NAD⁺<\/b> 與光合作用的輔酶 <b>NADP⁺<\/b>，可接受電子分別還原成 <b>NADH<\/b> 與 <b>NADPH<\/b>。<\/li><li>電子式（補充）：NAD⁺ + 2e⁻ + H⁺ → NADH；NADP⁺ 同理。<\/li><\/ul><h3>干擾：重金屬<\/h3><ul><li>汞（Hg²⁺）、鉛（Pb²⁺）、鎘（Cd²⁺）等重金屬離子與酵素結合，使酵素產生<b>永久性的變形<\/b>而失去活性。<\/li><li>不要把所有金屬離子都當成有益的輔因子。<\/li><\/ul>", "b1-21-l11": "<h3>整合：三個問題判斷新情境<\/h3><p>前面幾張的概念，面對新題目時可用三個問題檢查。<\/p><h3>三個問題<\/h3><ul><li>改變的是<b>活化能<\/b>，還是反應前後的<b>能量差<\/b>？（酵素改變前者，不改變後者。）<\/li><li>受質能不能有效結合活性位？（專一性、構形、抑制劑。）<\/li><li><b>溫度、pH、輔因子或抑制劑<\/b>提供了什麼條件？<\/li><\/ul><h3>例題提醒<\/h3><p>像「洗衣用清潔劑中的酵素」要同時滿足溫度與 pH 的條件。輔因子可協助不同酵素，但酵素仍會選擇適合的輔因子，不能推成任何輔因子都能搭配所有酵素；原題依原簡報答案 A 計分。<\/p>"};

const THINK={"b1-21-l01": ["植物把葡萄糖與果糖合成蔗糖、細胞把葡萄糖氧化成 CO₂ 與 H₂O，各屬於哪一類代謝？兩者在能量上有什麼不同？", "前者是同化代謝，需要利用能量把小分子合成自身所需的物質；後者是異化代謝，分解物質，通常伴隨能量釋出。兩類反應都需要酵素協助才能有效進行。"], "b1-21-l02": ["合成反應和分解反應都需要活化能嗎？在實驗室中，常用哪兩種方法讓反應較容易進行？", "兩者都需要活化能。實驗室中可加熱提升反應物的能量狀態，或加入催化劑降低反應所需的活化能。"], "b1-21-l03": ["比較圖2-1(a)有、無酵素的兩條曲線：加入酵素後，哪個部分改變了？哪個部分沒有改變？", "山頂變低，也就是活化能降低，反應因此加快；受質與產物之間的能量差沒有改變，酵素不會改變反應的總能量變化。"], "b1-21-l04": ["酵素完成一次催化後會發生什麼事？為什麼細胞中少量的酵素就能處理大量受質？", "產物離開活性位後，酵素恢復原狀，可再與新的受質結合，重複進行催化，因此少量酵素就能催化大量受質。"], "b1-21-l05": ["鎖鑰假說和誘導契合學說最主要的差別是什麼？", "鎖鑰假說認為活性位與受質原本就互相吻合；誘導契合學說則認為受質與活性位結合後，會誘導酵素構形改變，兩者才進一步緊密結合。"], "b1-21-l06": ["磺胺類藥物中的 SFA 為什麼能使細菌無法合成足量的葉酸？", "SFA 的結構與 PABA 相似，能占據合成葉酸之酵素的活性位，與 PABA 競爭，使 PABA 無法有效結合，葉酸合成因而受阻。"], "b1-21-l07": ["為什麼溫度升高時，酵素反應速率先增加，超過某個溫度後又迅速下降？", "在適當範圍內，升溫使分子碰撞增加，受質與酵素結合的機會變多；溫度過高會改變酵素構形，受質無法有效結合，活性因而迅速下降。最適溫度因酵素而異，例如嗜熱菌的酵素就比人類的高。"], "b1-21-l08": ["胃蛋白酶隨食物進入小腸（弱鹼性環境）後，活性會如何變化？胰蛋白酶在小腸中又如何？", "胃蛋白酶的最適 pH 約為 2，到了弱鹼性環境活性會大幅下降；胰蛋白酶的最適 pH 約為 8，在小腸的弱鹼性環境中活性較高。"], "b1-21-l09": ["輔因子可分成哪兩類？請各舉一例。", "一類是金屬離子，如 Zn²⁺、Ca²⁺、Mn²⁺；另一類是有機物，稱為輔酶，如維生素 C 與維生素 B 群等。"], "b1-21-l10": ["同樣是與酵素結合的金屬離子，為什麼 Zn²⁺ 能協助酵素作用，Hg²⁺ 卻會使酵素失去活性？", "有些酵素需與 Zn²⁺ 等輔因子結合，才能形成正確構形與受質結合；Hg²⁺、Pb²⁺、Cd²⁺ 等重金屬離子與酵素結合後，會使酵素產生永久性的變形而失去活性。"], "b1-21-l11": ["若要為洗衣精挑選添加的酵素，除了能分解污漬之外，還需要考慮哪些條件？", "酵素必須在洗滌時的溫度與 pH 範圍內仍保有活性；也要考慮它是否需要輔因子，以及洗衣精中是否有會抑制或破壞它的成分。"]};

let READING=null,tableState=null,resultObserver=null;
function readingBlocks(node){
 const blocks=[];for(const child of [...node.childNodes]){
  if(child.nodeType===3){if(child.textContent.trim()){const p=document.createElement('p');p.textContent=child.textContent;blocks.push(p);}continue;}
  if(child.matches('ul,ol'))for(const li of child.children){const list=document.createElement(child.tagName);list.append(li.cloneNode(true));blocks.push(list);}
  else blocks.push(child.cloneNode(true));
 }return blocks;
}

function stepReading(d){if(!READING)return;const i=READING.tab;READING.indices[i]=Math.max(0,Math.min((READING.pages[i]?.length||1)-1,READING.indices[i]+d));renderReading();}
function splitBlock(node,body){
 // Range fragments keep inline emphasis and every character when a long paragraph needs another page.
 const length=node.textContent.length;if(!length)return [node];const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT),texts=[];let n,offset=0;while(n=walker.nextNode()){texts.push({node:n,start:offset,end:offset+n.length});offset+=n.length;}

 const parts=[];let from=0;while(from<length){let lo=from+1,hi=length,best=lo;while(lo<=hi){const mid=(lo+hi)>>1,c=fragment(from,mid);body.replaceChildren(c);if(body.scrollHeight<=body.clientHeight+1){best=mid;lo=mid+1;}else hi=mid-1;}
  if(best<length){const s=node.textContent.slice(from,best),breakAt=Math.max(s.lastIndexOf('。'),s.lastIndexOf('；'),s.lastIndexOf('，'));if(breakAt>Math.max(20,s.length*.55))best=from+breakAt+1;}
  parts.push(fragment(from,best));from=best;
 }body.replaceChildren();return parts;
}
function paginateReading(){
 if(!READING)return;const i=READING.tab,g=READING.groups[i];if(g.notes)return;const pane=el('reading-pane-'+i),body=pane.querySelector('.reading-body'),pager=pane.querySelector('.reading-pager');pager.hidden=false;

function renderReading(){if(!READING)return;const i=READING.tab,pages=READING.pages[i];if(!pages)return;const pane=el('reading-pane-'+i),j=READING.indices[i];pane.querySelector('.reading-body').replaceChildren(...pages[j].map(x=>x.cloneNode(true)));const pager=pane.querySelector('.reading-pager');pager.hidden=pages.length<2;pager.querySelector('span').textContent=`${j+1} / ${pages.length} 頁`;const b=pager.querySelectorAll('button');b[0].disabled=j===0;b[1].disabled=j===pages.length-1;bindZoom(pane);}
function fitLessonTable(){if(!tableState)return;const {table,rows,pager}=tableState,canvas=table.closest('.figure-canvas');rows.forEach(r=>r.hidden=false);if(innerWidth<=900){tableState.count=rows.length;tableState.index=0;}else{const head=table.rows[0].getBoundingClientRect().height,room=canvas.clientHeight-head-2;let height=0,count=0;for(const row of rows){const h=row.getBoundingClientRect().height;if(height+h>room&&count)break;height+=h;count++;}tableState.count=Math.max(1,count);tableState.index=Math.max(0,Math.min(Math.ceil(rows.length/tableState.count)-1,tableState.index));}
